<text xml:space="preserve" text-anchor="middle" x="1345.42" y="-228.56" font-family="Arial" font-size="11.00">TimingZeroSFA | source population interfaces; each RG contains16 spiking somas.</text>
<text xml:space="preserve" text-anchor="middle" x="1345.42" y="-215.06" font-family="Arial" font-size="11.00">Chemical edges use spike&#45;derived proxy voltage; these are NOT event synapses.</text>
<text xml:space="preserve" text-anchor="middle" x="1345.42" y="-201.56" font-family="Arial" font-size="11.00">Zero extra SFA; h tau multiplier0.9496883348174533; 0.2ms internal clock.</text>
<text xml:space="preserve" text-anchor="middle" x="1345.42" y="-188.06" font-family="Arial" font-size="11.00">Arrow: saved excitatory category. Open circle: saved inhibitory category.</text>
<text xml:space="preserve" text-anchor="middle" x="1345.42" y="-174.56" font-family="Arial" font-size="11.00">Neuron colours: RG blue; PF green; motor salmon; afferent purple.</text>
<text xml:space="preserve" text-anchor="middle" x="1345.42" y="-161.06" font-family="Arial" font-size="11.00">Dashed pentagons: boundary references, not additional neurons.</text>
<text xml:space="preserve" text-anchor="middle" x="1345.42" y="-147.56" font-family="Arial" font-size="11.00">Edge numbers: gmax (uS). Full fields and IDs accompany each panel.</text>

" font-size="19" text-anchor="start" fill="#111">yes</text><rect x="30" y="686" width="1440" height="46" rx="5" fill="#EFF3F4"/><text x="45" y="714.0" font-family="Arial" font-size="19" text-anchor="start" fill="#111">IIIN_tib_ant → MN_soleus</text><text x="750" y="714.0" font-family="Arial" font-size="19" text-anchor="start" fill="#111">0.133333</text><text x="910" y="714.0" font-family="Arial" font-size="19" text-anchor="start" fill="#111">-5.0</text><text x="1090" y="714.0" font-family="Arial" font-size="19" text-anchor="start" fill="#111">0 / 5</text><text x="1350" y="714.0" font-family="Arial" font-size="19" text-anchor="start" fill="#111">yes</text><text x="45" y="762.0" font-family="Arial" font-size="19" text-anchor="start" fill="#111">IIIN_tib_ant → MN_tib_post</text><text x="750" y="762.0" font-family="Arial" font-size="19" text-anchor="start" fill="#111">0.133333</text><text x="910" y="762.0" font-family="Arial" font-size="19" text-anchor="start" fill="#111">-5.0</text><text x="1090" y="762.0" font-family="Arial" font-size="19" text-anchor="start" fill="#111">0 / 5</text><text x="1350" y="762.0" font-family="Arial" font-size="19" text-anchor="start" fill="#111">yes</text><rect x="30" y="782" width="1440" height="46" rx="5" fill="#EFF3F4"/><text x="45" y="810.0" font-family="Arial" font-size="19" text-anchor="start" fill="#111">IIIN_tib_ant → MN_flex_dig</text><text x="750" y="810.0" font-family="Arial" font-size="19" text-anchor="start" fill="#111">0.133333</text><text x="910" y="810.0" font-family="Arial" font-size="19" text-anchor="start" fill="#111">-5.0</text><text x="1090" y="810.0" font-family="Arial" font-size="19" text-anchor="start" fill="#111">0 / 5</text><text x="1350" y="810.0" font-family="Arial" font-size="19" text-anchor="start" fill="#111">yes</text><text x="45" y="858.0" font-family="Arial" font-size="19" text-anchor="start" fill="#111">IIIN_tib_ant → MN_flex_hal</text><text x="750" y="858.0" font-family="Arial" font-size="19" text-anchor="start" fill="#111">0.133333</text><text x="910" y="858.0" font-family="Arial" font-size="19" text-anchor="start" fill="#111">-5.0</text><text x="1090" y="858.0" font-family="Arial" font-size="19" text-anchor="start" fill="#111">0 / 5</text><text x="1350" y="858.0" font-family="Arial" font-size="19" text-anchor="start" fill="#111">yes</text><rect x="30" y="878" width="1440" height="46" rx="5" fill="#EFF3F4"/><text x="45" y="906.0" font-family="Arial" font-size="19" text-anchor="start" fill="#111">IIX_tib_ant → MN_tib_ant</text><text x="750" y="906.0" font-family="Arial" font-size="19" text-anchor="start" fill="#111">0.4</text><text x="910" y="906.0" font-family="Arial" font-size="19" text-anchor="start" fill="#111">8.0</text><text x="1090" y="906.0" font-family="Arial" font-size="19" text-anchor="start" fill="#111">0 / 5</text><text x="1350" y="906.0" font-family="Arial" font-size="19" text-anchor="start" fill="#111">yes</text><text x="45" y="954.0" font-family="Arial" font-size="19" text-anchor="start" fill="#111">IIIN_tib_ant → MN_per_brev</text><text x="750" y="954.0" font-family="Arial" font-size="19" text-anchor="start" fill="#111">0.133333</text><text x="910" y="954.0" font-family="Arial" font-size="19" text-anchor="start" fill="#111">-5.0</text><text x="1090" y="954.0" font-family="Arial" font-size="19" text-anchor="start" fill="#111">0 / 5</text><text x="1350" y="954.0" font-family="Arial" font-size="19" text-anchor="start" fill="#111">yes</text><rect x="30" y="974" width="1440" height="46" rx="5" fill="#EFF3F4"/><text x="45" y="1002.0" font-family="Arial" font-size="19" text-anchor="start" fill="#111">IIIN_tib_ant → MN_per_long</text><text x="750" y="1002.0" font-family="Arial" font-size="19" text-anchor="start" fill="#111">0.133333</text><text x="910" y="1002.0" font-family="Arial" font-size="19" text-anchor="start" fill="#111">-5.0</text><text x="1090" y="1002.0" font-family="Arial" font-size="19" text-anchor="start" fill="#111">0 / 5</text><text x="1350" y="1002.0" font-family="Arial" font-size="19" text-anchor="start" fill="#111">yes</text><text x="45" y="1050.0" font-family="Arial" font-size="19" text-anchor="start" fill="#111">IIIN_tib_ant → MN_per_tert</text><text x="750" y="1050.0" font-family="Arial" font-size="19" text-anchor="start" fill="#111">0.133333</text><text x="910" y="1050.0" font-family="Arial" font-size="19" text-anchor="start" fill="#111">-5.0</text><text x="1090" y="1050.0" font-family="Arial" font-size="19" text-anchor="start" fill="#111">0 / 5</text><text x="1350" y="1050.0" font-family="Arial" font-size="19" text-anchor="start" fill="#111">yes</text><text x="50" y="1290.0" font-family="Arial" font-size="22" text-anchor="start" fill="#111">A ×N line bundles N separately parameterized connections; it is not a single summed synapse.</text><text x="50" y="1330.0" font-family="Arial" font-size="20" text-anchor="start" fill="#111">Ankle channels are included in the muscle bundles where present. Complete members and edge IDs accompany the drawings.</text></svg>
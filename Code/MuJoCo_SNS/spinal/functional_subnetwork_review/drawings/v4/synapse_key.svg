<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1400"><rect width="100%" height="100%" fill="white"/><text x="750" y="45.0" font-family="Arial" font-size="28" text-anchor="middle" fill="#111">Source / destination / synapse: what the labels mean</text><text x="50" y="85.0" font-family="Arial" font-size="22" text-anchor="start" fill="#111">II_tib_ant names one type-II afferent neuron, not one globally fixed synapse.</text><text x="50" y="125.0" font-family="Arial" font-size="22" text-anchor="start" fill="#111">A connection is defined by its source, destination, conductance, reversal, and presynaptic window.</text><text x="50" y="165.0" font-family="Arial" font-size="22" text-anchor="start" fill="#111">The same afferent can therefore have different parameters at different destinations.</text><text x="50" y="205.0" font-family="Arial" font-size="22" text-anchor="start" fill="#111">The checked left/right homologues below match; diagram labels omit the side suffix.</text><text x="45" y="285.0" font-family="Arial" font-size="20" text-anchor="start" fill="#111">Source → destination</text><text x="750" y="285.0" font-family="Arial" font-size="20" text-anchor="start" fill="#111">g (uS)</text><text x="910" y="285.0" font-family="Arial" font-size="20" text-anchor="start" fill="#111">Erev (mV)</text><text x="1090" y="285.0" font-family="Arial" font-size="20" text-anchor="start" fill="#111">lo / hi (mV)</text><text x="1350" y="285.0" font-family="Arial" font-size="20" text-anchor="start" fill="#111">L = R</text><rect x="30" y="302" width="1440" height="46" rx="5" fill="#EFF3F4"/><text x="45" y="330.0" font-family="Arial" font-size="19" text-anchor="start" fill="#111">II_tib_ant → RG_F</text><text x="750" y="330.0" font-family="Arial" font-size="19" text-anchor="start" fill="#111">0.0278947</text><text x="910" y="330.0" font-family="Arial" font-size="19" text-anchor="start" fill="#111">8.0</text><text x="1090" y="330.0" font-family="Arial" font-size="19" text-anchor="start" fill="#111">0 / 5</text><text x="1350" y="330.0" font-family="Arial" font-size="19" text-anchor="start" fill="#111">yes</text><text x="45" y="378.0" font-family="Arial" font-size="19" text-anchor="start" fill="#111">II_tib_ant → InF</text><text x="750" y="378.0" font-family="Arial" font-size="19" text-anchor="start" fill="#111">0.0278947</text><text x="910" y="378.0" font-family="Arial" font-size="19" text-anchor="start" fill="#111">8.0</text><text x="1090" y="378.0" font-family="Arial" font-size="19" text-anchor="start" fill="#111">0 / 5</text><text x="1350" y="378.0" font-family="Arial" font-size="19" text-anchor="start" fill="#111">yes</text><rect x="30" y="398" width="1440" height="46" rx="5" fill="#EFF3F4"/><text x="45" y="426.0" font-family="Arial" font-size="19" text-anchor="start" fill="#111">II_tib_ant → PF_HIP-F</text><text x="750" y="426.0" font-family="Arial" font-size="19" text-anchor="start" fill="#111">0.0278947</text><text x="910" y="426.0" font-family="Arial" font-size="19" text-anchor="start" fill="#111">8.0</text><text x="1090" y="426.0" font-family="Arial" font-size="19" text-anchor="start" fill="#111">0 / 5</text><text x="1350" y="426.0" font-family="Arial" font-size="19" text-anchor="start" fill="#111">yes</text><text x="45" y="474.0" font-family="Arial" font-size="19" text-anchor="start" fill="#111">II_tib_ant → PF_KNEE-F</text><text x="750" y="474.0" font-family="Arial" font-size="19" text-anchor="start" fill="#111">0.0278947</text><text x="910" y="474.0" font-family="Arial" font-size="19" text-anchor="start" fill="#111">8.0</text><text x="1090" y="474.0" font-family="Arial" font-size="19" text-anchor="start" fill="#111">0 / 5</text><text x="1350" y="474.0" font-family="Arial" font-size="19" text-anchor="start" fill="#111">yes</text><rect x="30" y="494" width="1440" height="46" rx="5" fill="#EFF3F4"/><text x="45" y="522.0" font-family="Arial" font-size="19" text-anchor="start" fill="#111">II_tib_ant → IIX_tib_ant</text><text x="750" y=
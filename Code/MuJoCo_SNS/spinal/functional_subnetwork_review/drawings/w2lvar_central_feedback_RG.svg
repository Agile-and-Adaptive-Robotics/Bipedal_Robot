" width="285" height="65" fill="#FFE52E" stroke="#222" stroke-width="1.5" stroke-dasharray="6 4"/><text x="1322" y="531.0" font-family="Arial" font-size="17" text-anchor="middle">RG F (L)</text><text x="1322" y="552.25" font-family="Arial" font-size="17" text-anchor="middle">(same HC; off-page reference)</text><circle cx="1174" cy="535" r="6" fill="black"/><rect x="770" y="670" width="260" height="85" fill="#D3EABD" stroke="#222" stroke-width="1.5"/><text x="900" y="703.0" font-family="Arial" font-size="18" text-anchor="middle">InF (L)</text><line x1="1030" y1="710" x2="1180" y2="715" stroke="#333" stroke-width="1.6"/><rect x="1180" y="685" width="285" height="65" fill="#FFE52E" stroke="#222" stroke-width="1.5" stroke-dasharray="6 4"/><text x="1322" y="711.0" font-family="Arial" font-size="17" text-anchor="middle">RG E (L)</text><text x="1322" y="732.25" font-family="Arial" font-size="17" text-anchor="middle">(same HC; off-page reference)</text><circle cx="1174" cy="715" r="6" fill="black"/><polygon points="756,148 770,141 770,155" fill="white" stroke="#222" stroke-width="1.5"/><polygon points="756,328 770,321 770,335" fill="white" stroke="#222" stroke-width="1.5"/><polygon points="756,351 770,344 770,358" fill="white" stroke="#222" stroke-width="1.5"/><polygon points="756,508 770,501 770,515" fill="white" stroke="#222" stroke-width="1.5"/><polygon points="756,531 770,524 770,538" fill="white" stroke="#222" stroke-width="1.5"/><polygon points="756,688 770,681 770,695" fill="white" stroke="#222" stroke-width="1.5"/><polygon points="756,711 770,704 770,718" fill="white" stroke="#222" stroke-width="1.5"/><polygon points="756,734 770,727 770,741" fill="white" stroke="#222" stroke-width="1.5"/><text x="750" y="1065.0" font-family="Arial" font-size="18" text-anchor="middle">A thick ×N line stands for N distinct source-muscle connections; the member list is in the companion key.</text><text x="750" y="1097.0" font-family="Arial" font-size="18" text-anchor="middle">Triangles have their base on the receiving object. Filled circles are inhibitory terminals.</text><text x="750" y="1129.0" font-family="Arial" font-size="18" text-anchor="middle">HC = half-centre · IN = interneuron · Dashed destination: reference to the same HC, not an added cell.</text></svg>
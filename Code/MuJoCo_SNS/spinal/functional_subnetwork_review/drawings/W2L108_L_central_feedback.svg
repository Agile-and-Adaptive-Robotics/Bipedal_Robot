anchor="middle" fill="#111">in this condition</text><text x="700" y="1350.0" font-family="Arial" font-size="17" text-anchor="middle" fill="#111">Triangle base meets its receiving object; triangle point lies on the incoming line.</text><text x="700" y="1380.0" font-family="Arial" font-size="17" text-anchor="middle" fill="#111">Filled circle: inhibition at target rest. Crossings without dots are not junctions.</text><text x="700" y="1410.0" font-family="Arial" font-size="17" text-anchor="middle" fill="#111">Ia / II / Ib sensory boxes each represent one source afferent neuron, not a muscle bundle.</text><text x="700" y="1440.0" font-family="Arial" font-size="17" text-anchor="middle" fill="#111">All direct afferent targets here are HCs; opposite-side V3 targets the RG extensor IN.</text><text x="700" y="1470.0" font-family="Arial" font-size="17" text-anchor="middle" fill="#111">Other homonymous II and toe routes belong to motor/reflex circuits, not this central panel.</text></svg>
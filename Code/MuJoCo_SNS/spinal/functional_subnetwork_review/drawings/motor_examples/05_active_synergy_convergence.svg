d="M 950.00,290.00 L 950.00,440.00 Q 950.00,450.00 960.00,450.00 L 1350.00,450.00 Q 1360.00,450.00 1360.00,460.00 L 1360.00,690.00" fill="none" stroke="#333" stroke-width="2" stroke-linejoin="round"/><path d="M 1240.00,290.00 L 1240.00,443.00 A 7 7 0 0 1 1240.00,457.00 L 1240.00,540.00 Q 1240.00,550.00 1230.00,550.00 L 897.00,550.00 A 7 7 0 0 1 883.00,550.00 L 580.00,550.00 Q 570.00,550.00 570.00,560.00 L 570.00,690.00" fill="none" stroke="white" stroke-width="6.5" stroke-linecap="round"/><path d="M 1240.00,290.00 L 1240.00,443.00 A 7 7 0 0 1 1240.00,457.00 L 1240.00,540.00 Q 1240.00,550.00 1230.00,550.00 L 897.00,550.00 A 7 7 0 0 1 883.00,550.00 L 580.00,550.00 Q 570.00,550.00 570.00,560.00 L 570.00,690.00" fill="none" stroke="#333" stroke-width="2" stroke-linejoin="round"/><path d="M 1350.00,290.00 L 1350.00,370.00 Q 1350.00,380.00 1360.00,380.00 L 1440.00,380.00 Q 1450.00,380.00 1450.00,390.00 L 1450.00,690.00" fill="none" stroke="white" stroke-width="6.5" stroke-linecap="round"/><path d="M 1350.00,290.00 L 1350.00,370.00 Q 1350.00,380.00 1360.00,380.00 L 1440.00,380.00 Q 1450.00,380.00 1450.00,390.00 L 1450.00,690.00" fill="none" stroke="#333" stroke-width="2" stroke-linejoin="round"/><rect x="390" y="210" width="220" height="80" rx="12" fill="#FFE52E" stroke="#222" stroke-width="1.5"/><text x="500.0" y="257.0" font-family="Arial" font-size="20" text-anchor="middle" fill="#111">S2</text><rect x="790" y="210" width="220" height="80" rx="12" fill="#FFE52E" stroke="#222" stroke-width="1.5"/><text x="900.0" y="257.0" font-family="Arial" font-size="20" text-anchor="middle" fill="#111">S3</text><rect x="1190" y="210" width="220" height="80" rx="12" fill="#FFE52E" stroke="#222" stroke-width="1.5"/><text x="1300.0" y="257.0" font-family="Arial" font-size="20" text-anchor="middle" fill="#111">S5</text><rect x="340" y="690" width="250" height="90" rx="12" fill="#9AD8F1" stroke="#222" stroke-width="1.5"/><text x="465.0" y="730.0" font-family="Arial" font-size="20" text-anchor="middle" fill="#111">Rectus femoris</text><text x="465.0" y="754.0" font-family="Arial" font-size="20" text-anchor="middle" fill="#111">MN</text><rect x="810" y="690" width="250" height="90" rx="12" fill="#9AD8F1" stroke="#222" stroke-width="1.5"/><text x="935.0" y="730.0" font-family="Arial" font-size="20" text-anchor="middle" fill="#111">Vastus medialis</text><text x="935.0" y="754.0" font-family="Arial" font-size="20" text-anchor="middle" fill="#111">MN</text><rect x="1280" y="690" width="250" height="90" rx="12" fill="#9AD8F1" stroke="#222" stroke-width="1.5"/><text x="1405.0" y="730.0" font-family="Arial" font-size="20" text-anchor="middle" fill="#111">Soleus</text><text x="1405.0" y="754.0" font-family="Arial" font-size="20" text-anchor="middle" fill="#111">MN</text><polygon points="440.00,675.00 433.00,690.00 447.00,690.00" fill="white" stroke="#333" stroke-width="1.6"/><polygon points="890.00,675.00 883.00,690.00 897.00,690.00" fill="white" stroke="#333" stroke-width="1.6"/><polygon points="520.00,675.00 513.00,690.00 527.00,690.00" fill="white" stroke="#333" stroke-width="1.6"/><polygon points="1360.00,675.00 1353.00,690.00 1367.00,690.00" fill="white" stroke="#333" stroke-width="1.6"/><polygon points="570.00,675.00 563.00,690.00 577.00,690.00" fill="white" stroke="#333" stroke-width="1.6"/><polygon points="1450.00,675.00 1443.00,690.00 1457.00,690.00" fill="white" stroke="#333" stroke-width="1.6"/><text x="900" y="845.0" font-family="Arial" font-size="19" text-anchor="middle" fill="#111">All three PF inputs to rectus femoris are shown. The other two MNs also receive inputs from channels outside this view.</text><text x="900" y="890.0" font-family="Arial" font-size="22" text-anchor="middle" fill="#111">Rectus femoris integrates three separate PF synapses; S2 also branches to vastus medialis.</text><text x="900" y="935.0" font-family="Arial" font-size="20" text-anchor="middle" fill="#111">S3 and S5 also branch to soleus. These channels encode muscle synergies, not named hip/knee half-centers.</text><text x="900" y="990.0" font-family="Arial" font-size="20" text-anchor="middle" fill="#111">S2 → rectus femoris: g = 0.007152 µS; S2 → vastus medialis: g = 0.01747 µS.</text><text x="900" y="1035.0" font-family="Arial" font-size="19" text-anchor="middle" fill="#111">Each outgoing synapse has its own weight. Other channel inputs and local reflex circuits are omitted here.</text><text x="900" y="1105.0" font-family="Arial" font-size="18" text-anchor="middle" fill="#111">All displayed connections are excitatory and nonzero. Exact conductances and thresholds accompany the editable drawing.</text></svg>
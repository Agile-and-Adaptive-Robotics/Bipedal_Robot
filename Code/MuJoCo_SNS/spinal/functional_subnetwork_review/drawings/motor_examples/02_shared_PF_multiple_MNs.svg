" y="580" width="220" height="90" rx="12" fill="#9AD8F1" stroke="#222" stroke-width="1.5"/><text x="1210.0" y="620.0" font-family="Arial" font-size="20" text-anchor="middle" fill="#111">Semimembranosus</text><text x="1210.0" y="644.0" font-family="Arial" font-size="20" text-anchor="middle" fill="#111">MN</text><rect x="1450" y="580" width="220" height="90" rx="12" fill="#9AD8F1" stroke="#222" stroke-width="1.5"/><text x="1560.0" y="620.0" font-family="Arial" font-size="20" text-anchor="middle" fill="#111">Semitendinosus</text><text x="1560.0" y="644.0" font-family="Arial" font-size="20" text-anchor="middle" fill="#111">MN</text><polygon points="200.00,565.00 193.00,580.00 207.00,580.00" fill="white" stroke="#888" stroke-width="1.6"/><polygon points="525.00,565.00 518.00,580.00 532.00,580.00" fill="white" stroke="#888" stroke-width="1.6"/><polygon points="850.00,565.00 843.00,580.00 857.00,580.00" fill="white" stroke="#888" stroke-width="1.6"/><polygon points="1210.00,565.00 1203.00,580.00 1217.00,580.00" fill="white" stroke="#888" stroke-width="1.6"/><polygon points="1560.00,565.00 1553.00,580.00 1567.00,580.00" fill="white" stroke="#888" stroke-width="1.6"/><text x="200" y="715.0" font-family="Arial" font-size="18" text-anchor="middle" fill="#111">defined g = 1.814 µS</text><text x="525" y="715.0" font-family="Arial" font-size="18" text-anchor="middle" fill="#111">defined g = 1.825 µS</text><text x="850" y="715.0" font-family="Arial" font-size="18" text-anchor="middle" fill="#111">defined g = 2 µS</text><text x="1210" y="715.0" font-family="Arial" font-size="18" text-anchor="middle" fill="#111">defined g = 1.461 µS</text><text x="1560" y="715.0" font-family="Arial" font-size="18" text-anchor="middle" fill="#111">defined g = 1.851 µS</text><text x="900" y="805.0" font-family="Arial" font-size="23" text-anchor="middle" fill="#111">These are five separate motor pools, not one pooled “extensor” or “flexor” MN.</text><text x="900" y="845.0" font-family="Arial" font-size="21" text-anchor="middle" fill="#111">Each has its own afferents and interneurons; sharing a PF source does not merge those circuits.</text><text x="900" y="900.0" font-family="Arial" font-size="19" text-anchor="middle" fill="#111">Selected w2lvar fan-out. Additional PF inputs to the biarticular hamstrings are shown in example 3.</text><text x="900" y="940.0" font-family="Arial" font-size="19" text-anchor="middle" fill="#111">Gray dashed = source-defined connection with effective g = 0 in this saved standing condition.</text><text x="900" y="1005.0" font-family="Arial" font-size="18" text-anchor="middle" fill="#111">K&amp;A is the model’s combined knee–ankle PF pair; only the selected knee-muscle branches are expanded here.</text></svg>
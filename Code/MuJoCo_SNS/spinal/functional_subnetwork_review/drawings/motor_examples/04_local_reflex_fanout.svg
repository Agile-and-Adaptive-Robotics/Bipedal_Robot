" fill="#111">Tibialis anterior</text><text x="190.0" y="846.5" font-family="Arial" font-size="20" text-anchor="middle" fill="#111">Ib</text><rect x="460" y="190" width="180" height="75" rx="12" fill="#9AD8F1" stroke="#222" stroke-width="1.5"/><text x="550.0" y="234.5" font-family="Arial" font-size="20" text-anchor="middle" fill="#111">TA Ia IN</text><rect x="460" y="410" width="200" height="75" rx="12" fill="#9AD8F1" stroke="#222" stroke-width="1.5"/><text x="560.0" y="454.5" font-family="Arial" font-size="20" text-anchor="middle" fill="#111">TA II inhibitory IN</text><rect x="460" y="610" width="200" height="75" rx="12" fill="#9AD8F1" stroke="#222" stroke-width="1.5"/><text x="560.0" y="654.5" font-family="Arial" font-size="20" text-anchor="middle" fill="#111">TA II excitatory IN</text><rect x="460" y="790" width="200" height="75" rx="12" fill="#9AD8F1" stroke="#222" stroke-width="1.5"/><text x="560.0" y="834.5" font-family="Arial" font-size="20" text-anchor="middle" fill="#111">TA Ib inhibitory IN</text><rect x="900" y="860" width="240" height="90" rx="12" fill="#9AD8F1" stroke="#222" stroke-width="1.5"/><text x="1020.0" y="900.0" font-family="Arial" font-size="20" text-anchor="middle" fill="#111">Tibialis anterior</text><text x="1020.0" y="924.0" font-family="Arial" font-size="20" text-anchor="middle" fill="#111">MN</text><rect x="900" y="1090" width="240" height="75" rx="12" fill="#9AD8F1" stroke="#222" stroke-width="1.5"/><text x="1020.0" y="1134.5" font-family="Arial" font-size="20" text-anchor="middle" fill="#111">TA Renshaw cell</text><rect x="1410" y="190" width="310" height="80" rx="12" fill="#9AD8F1" stroke="#222" stroke-width="1.5"/><text x="1565.0" y="237.0" font-family="Arial" font-size="20" text-anchor="middle" fill="#111">Soleus MN</text><rect x="1410" y="390" width="310" height="80" rx="12" fill="#9AD8F1" stroke="#222" stroke-width="1.5"/><text x="1565.0" y="437.0" font-family="Arial" font-size="20" text-anchor="middle" fill="#111">Medial gastrocnemius MN</text><rect x="1410" y="590" width="310" height="80" rx="12" fill="#9AD8F1" stroke="#222" stroke-width="1.5"/><text x="1565.0" y="637.0" font-family="Arial" font-size="20" text-anchor="middle" fill="#111">Lateral gastrocnemius MN</text><polygon points="445.00,227.50 460.00,234.50 460.00,220.50" fill="white" stroke="#333" stroke-width="1.6"/><polygon points="1000.00,845.00 993.00,860.00 1007.00,860.00" fill="white" stroke="#333" stroke-width="1.6"/><polygon points="445.00,447.50 460.00,454.50 460.00,440.50" fill="white" stroke="#333" stroke-width="1.6"/><polygon points="445.00,647.50 460.00,654.50 460.00,640.50" fill="white" stroke="#333" stroke-width="1.6"/><polygon points="885.00,890.00 900.00,897.00 900.00,883.00" fill="white" stroke="#333" stroke-width="1.6"/><polygon points="445.00,827.50 460.00,834.50 460.00,820.50" fill="white" stroke="#333" stroke-width="1.6"/><circle cx="894.0" cy="925.0" r="6" fill="#333"/><polygon points="1020.00,1075.00 1013.00,1090.00 1027.00,1090.00" fill="white" stroke="#333" stroke-width="1.6"/><circle cx="894.0" cy="910.0" r="6" fill="#333"/><circle cx="550.0" cy="271.0" r="6" fill="#333"/><circle cx="1404.0" cy="215.0" r="6" fill="#333"/><circle cx="1404.0" cy="245.0" r="6" fill="#333"/><circle cx="1404.0" cy="415.0" r="6" fill="#333"/><circle cx="1404.0" cy="447.5" r="6" fill="#333"/><circle cx="1404.0" cy="615.0" r="6" fill="#333"/><circle cx="1404.0" cy="645.0" r="6" fill="#333"/><text x="900" y="1230.0" font-family="Arial" font-size="21" text-anchor="middle" fill="#111">A separate inhibitory synapse reaches each antagonist MN; the three targets are not one pooled muscle.</text><text x="900" y="1265.0" font-family="Arial" font-size="20" text-anchor="middle" fill="#111">The same TA Ia neuron also excites its own MN. II uses separate excitatory and inhibitory interneurons.</text><text x="900" y="1300.0" font-family="Arial" font-size="18" text-anchor="middle" fill="#111">PF gating, central feedback, other antagonist muscles, and the wider Renshaw network are outside this focused view.</text><text x="900" y="1345.0" font-family="Arial" font-size="18" text-anchor="middle" fill="#111">TA = tibialis anterior. All lines on this page are nonzero saved w2lvar connections. No muscle or MN is duplicated.</text></svg>
 text-anchor="middle" fill="#111">MN</text><rect x="1060" y="700" width="290" height="95" rx="12" fill="#9AD8F1" stroke="#222" stroke-width="1.5"/><text x="1205.0" y="742.5" font-family="Arial" font-size="20" text-anchor="middle" fill="#111">Semimembranosus</text><text x="1205.0" y="766.5" font-family="Arial" font-size="20" text-anchor="middle" fill="#111">MN</text><polygon points="520.00,685.00 513.00,700.00 527.00,700.00" fill="white" stroke="#888" stroke-width="1.6"/><polygon points="620.00,685.00 613.00,700.00 627.00,700.00" fill="white" stroke="#888" stroke-width="1.6"/><polygon points="1160.00,685.00 1153.00,700.00 1167.00,700.00" fill="white" stroke="#888" stroke-width="1.6"/><polygon points="1260.00,685.00 1253.00,700.00 1267.00,700.00" fill="white" stroke="#888" stroke-width="1.6"/><text x="540" y="390.0" font-family="Arial" font-size="18" text-anchor="middle" fill="#111">g defined = 2 µS</text><text x="820" y="525.0" font-family="Arial" font-size="18" text-anchor="middle" fill="#111">g defined = 1.227 µS</text><text x="780" y="455.0" font-family="Arial" font-size="18" text-anchor="middle" fill="#111">g defined = 0.965 µS</text><text x="1460" y="660.0" font-family="Arial" font-size="18" text-anchor="middle" fill="#111">g defined = 1.461 µS</text><text x="565" y="850.0" font-family="Arial" font-size="20" text-anchor="middle" fill="#111">Hip flexion + knee extension</text><text x="1205" y="850.0" font-family="Arial" font-size="20" text-anchor="middle" fill="#111">Hip extension + knee flexion</text><text x="900" y="940.0" font-family="Arial" font-size="23" text-anchor="middle" fill="#111">Each muscle has ONE MN pool. Both PF synapses terminate on that same pool.</text><text x="900" y="980.0" font-family="Arial" font-size="21" text-anchor="middle" fill="#111">Both inputs are excitatory; separate conductances contribute to the MN membrane equation.</text><text x="900" y="1020.0" font-family="Arial" font-size="20" text-anchor="middle" fill="#111">A muscle’s action at two joints does not require a second MN or a second copy of its local reflex circuit.</text><text x="900" y="1100.0" font-family="Arial" font-size="19" text-anchor="middle" fill="#111">Gray dashed = defined source routing; every displayed PF→MN edge has effective g = 0 in the saved w2lvar condition.</text><text x="900" y="1165.0" font-family="Arial" font-size="18" text-anchor="middle" fill="#111">Weights belong to individual source→target synapses. Sharing an MN does not make the two PF connections one synapse.</text></svg>
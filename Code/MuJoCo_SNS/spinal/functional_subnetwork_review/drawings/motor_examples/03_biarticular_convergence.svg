<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1210" viewBox="0 0 1800 1210"><rect width="100%" height="100%" fill="white"/><text x="900" y="45.0" font-family="Arial" font-size="29" text-anchor="middle" fill="#111">3 · A biarticular muscle receives separate inputs from two PF layers</text><rect x="200" y="130" width="620" height="200" rx="16" fill="#F6FAF2" stroke="#333" stroke-width="1.6"/><rect x="336.4" y="130" width="347.20000000000005" height="36" rx="8" fill="#A7DF46" stroke="#333" stroke-width="1.4"/><text x="510.0" y="155.0" font-family="Arial" font-size="22" text-anchor="middle" fill="#111">Hip PF</text><rect x="980" y="130" width="620" height="200" rx="16" fill="#F6FAF2" stroke="#333" stroke-width="1.6"/><rect x="1116.4" y="130" width="347.20000000000005" height="36" rx="8" fill="#A7DF46" stroke="#333" stroke-width="1.4"/><text x="1290.0" y="155.0" font-family="Arial" font-size="22" text-anchor="middle" fill="#111">K&amp;A PF</text><path d="M 690.00,295.00 L 690.00,410.00 Q 690.00,420.00 680.00,420.00 L 530.00,420.00 Q 520.00,420.00 520.00,430.00 L 520.00,700.00" fill="none" stroke="white" stroke-width="6.5" stroke-linecap="round"/><path d="M 690.00,295.00 L 690.00,410.00 Q 690.00,420.00 680.00,420.00 L 530.00,420.00 Q 520.00,420.00 520.00,430.00 L 520.00,700.00" fill="none" stroke="#888" stroke-width="2" stroke-linejoin="round" stroke-dasharray="9 6"/><path d="M 1110.00,295.00 L 1110.00,540.00 Q 1110.00,550.00 1100.00,550.00 L 630.00,550.00 Q 620.00,550.00 620.00,560.00 L 620.00,700.00" fill="none" stroke="white" stroke-width="6.5" stroke-linecap="round"/><path d="M 1110.00,295.00 L 1110.00,540.00 Q 1110.00,550.00 1100.00,550.00 L 630.00,550.00 Q 620.00,550.00 620.00,560.00 L 620.00,700.00" fill="none" stroke="#888" stroke-width="2" stroke-linejoin="round" stroke-dasharray="9 6"/><path d="M 330.00,295.00 L 330.00,470.00 Q 330.00,480.00 340.00,480.00 L 513.00,480.00 A 7 7 0 0 1 527.00,480.00 L 1103.00,480.00 A 7 7 0 0 1 1117.00,480.00 L 1150.
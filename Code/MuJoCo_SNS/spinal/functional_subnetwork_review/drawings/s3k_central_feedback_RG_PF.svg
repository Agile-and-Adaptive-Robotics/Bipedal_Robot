<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1200" viewBox="0 0 1500 1200"><rect width="100%" height="100%" fill="white"/><text x="750" y="38.0" font-family="Arial" font-size="27" text-anchor="middle">s3k · left sensory feedback into RG / PF</text><text x="750" y="73.0" font-family="Arial" font-size="19" text-anchor="middle">Muscle bundles are labelled by channel count; actual receiving interneurons stay explicit.</text><rect x="40" y="145" width="275" height="85" fill="#EEEEEE" stroke="#222" stroke-width="1.5"/><text x="177.5" y="171.0" font-family="Arial" font-size="19" text-anchor="middle">Ia</text><text x="177.5" y="194.75" font-family="Arial" font-size="19" text-anchor="middle">No direct RG/PF route</text><text x="177.5" y="218.5" font-family="Arial" font-size="19" text-anchor="middle">in this saved condition</text><rect x="40" y="315" width="275" height="85" fill="#EEEEEE" stroke="#222" stroke-width="1.5"/><text x="177.5" y="341.0" font-family="Arial" font-size="19" text-anchor="middle">II</text><text x="177.5" y="364.75" font-family="Arial" font-size="19" text-anchor="middle">No direct RG/PF route</text><text x="177.5" y="388.5" font-family="Arial" font-size="19" text-anchor="middle">in this saved condition</text><rect x="40" y="485" width="275" height="85" fill="#EEEEEE" stroke="#222" stroke-width="1.5"/><text x="177.5" y="511.0" font-family="Arial" font-size="19" text-anchor="middle">Ib</text><text x="177.5" y="534.75" font-family="Arial" font-size="19" text-anchor="middle">No direct RG/PF route</text><text x="177.5" y="558.5" font-family="Arial" font-size="19" text-anchor="middle">in this saved condition</text><rect x="40" y="655" width="275" height="85" fill="#EEEEEE" stroke="#222" stroke-width="1.5"/><text x="177.5" y="681.0" font-family="Arial" font-size="19" text-anchor="middle">heel</text><text x="177.5" y="704.75" font-family="Arial" font-size="19" text-anchor="middle">No direct RG/PF route</text><text x="177.5" y="728.5" font-family="Arial" font-size="19" text-anchor="middle">in this saved condition</text><rect x="40" y="825" width="275" height="85" fill="#EEEEEE" stroke="#222" stroke-width="1.5"/><text x="177.5" y="851.0" font-family="Arial" font-size="19" text-anchor="middle">toe</text><text x="177.5" y="874.75" font-family="Arial" font-size="19" text-anchor="middle">No direct RG/PF route</text><text x="177.5" y="898.5" font-family="Arial" font-size="19" text-anchor="middle">in this saved condition</text><rect x="760" y="300" width="580" height="190" fill="#F3F7EF" stroke="#222" stroke-width="1.5"/><text x="1050" y="355.0" font-family="Arial" font-size="23" text-anchor="middle">No direct Ia, II, Ib, heel, or toe</text><text x="1050" y="383.75" font-family="Arial" font-size="23" text-anchor="middle">chemical projection into RG/PF</text><text x="1050" y="412.5" font-family="Arial" font-size="23" text-anchor="middle">in this saved s3k standing condition.</text><text x="750" y="1065.0" font-family="Arial" font-size="18" text-anchor="middle">A thick ×N line stands for N distinct source-muscle connections; the member list is in the companion key.</text><text x="750" y="1097.0" font-family="Arial" font-size="18" text-anchor="middle">Triangles have their base on the receiving object. Filled circles are inhibitory terminals.</text><text x="750" y="1129.0" font-family="Arial" font-size="18" text-anchor="middle">HC = half-centre · IN = interneuron · Dashed destination: reference to the same HC, not an added cell.</text></svg>
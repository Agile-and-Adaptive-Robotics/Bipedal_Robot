<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SADb Explorer — Sensory Afferent Database</title>
<style>
 :root { --bg:#fafafa; --fg:#1a1a1a; --mut:#666; --line:#ddd; --acc:#0b62a4; }
 * { box-sizing:border-box; }
 body { font:14px/1.45 "Segoe UI",system-ui,sans-serif; margin:0; color:var(--fg); background:var(--bg); }
 header { padding:10px 16px; border-bottom:2px solid var(--acc); background:#fff; }
 h1 { font-size:17px; margin:0 0 2px; }
 .sub { color:var(--mut); font-size:12px; }
 .tabs { margin-top:8px; }
 .tabs button { border:1px solid var(--line); background:#fff; padding:6px 18px; cursor:pointer; font-size:14px; }
 .tabs button.on { background:var(--acc); color:#fff; border-color:var(--acc); }
 .bar { display:flex; flex-wrap:wrap; gap:8px; padding:8px 16px; background:#fff; border-bottom:1px solid var(--line); align-items:center; }
 .bar input[type=text], .bar select { padding:4px 8px; border:1px solid var(--line); }
 .bar input[type=number] { width:64px; padding:4px; border:1px solid var(--line); }
 .bar label { font-size:12px; color:var(--mut); white-space:nowrap; }
 main { padding:12px 16px; }
 table { border-collapse:collapse; width:100%; background:#fff; }
 th, td { border-bottom:1px solid var(--line); padding:5px 8px; text-align:left; vertical-align:top; }
 th { position:sticky; top:0; background:#eef3f8; cursor:pointer; user-select:none; white-space:nowrap; }
 td.num { text-align:right; white-space:nowrap; }
 tr.row:hover { background:#f0f6ff; cursor:pointer; }
 .pill { display:inline-block; background:#e7eef5; border-radius:8px; padding:0 7px; margin:1px 2px; font-size:11px; white-space:nowrap; }
 .pill.fb { background:#e8f2e4; } .pill.no { background:#fdeaea; } .pill.yes { background:#e4f0e8; }
 #count { color:var(--mut); font-size:12px; margin:6px 0; }
 .pivot td, .pivot th { text-align:right; }
 .pivot td.rh, .pivot th.rh { text-align:left; }
 .pivot td.cell { cursor:pointer; }
 .pivot td.cell:hover { background:#ffe9b8; }
 .pivot td.tot { font-weight:600; background:#f4f4f4; }
 #crumb { display:flex; align-items:center; gap:10px; padding:4px 0; font-size:13px; }
 #crumb button { border:1px solid var(--acc); background:#fff; color:var(--acc); padding:2px 10px; cursor:pointer; }
 #canvas { border:1px solid var(--line); background:#fff; cursor:grab; display:block; outline-offset:-3px; }
 #canvas:focus { outline:3px solid var(--acc); }
 #tip { position:fixed; display:none; background:#fff; border:1px solid var(--acc); padding:6px 9px;
        font-size:12px; max-width:340px; pointer-events:none; box-shadow:2px 2px 8px rgba(0,0,0,.15); z-index:50; }
 #detail { position:fixed; right:0; top:0; bottom:0; width:430px; background:#fff; border-left:2px solid var(--acc);
           padding:14px 16px; overflow-y:auto; display:none; z-index:40; box-shadow:-4px 0 16px rgba(0,0,0,.12); }
 #detail h2 { font-size:15px; margin:0 0 6px; } #detail .close { float:right; cursor:pointer; border:1px solid var(--line); padding:1px 8px; }
 #detail dt { font-weight:600; font-size:12px; color:var(--mut); margin-top:8px; }
 #detail dd { margin:2px 0 0; }
 .legend { display:flex; flex-wrap:wrap; gap:4px 12px; font-size:11px; color:var(--mut); margin-top:6px; }
 .legend i { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:3px; }
 .warn { background:#fff4d5; border:1px solid #e8d49a; padding:4px 10px; font-size:12px; display:none; }
 .sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }
</style>
</head>
<body>
<header>
  <h1>SADb Explorer — Sensory Afferent Database <span class="sub" id="stats"></span></h1>
  <div class="sub">Offline snapshot of the Airtable "Sensory Feedback" corpus. Rebuild: <code>myo python SADb_audit/export_corpus.py &amp;&amp; SADb_audit/vos_build2.py &amp;&amp; SADb_audit/app/build_app.py</code></div>
  <div class="tabs">
    <button id="tab-table" class="on" onclick="show('table')">Table</button>
    <button id="tab-pivot" onclick="show('pivot')">Pivot</button>
    <button id="tab-map" onclick="show('map')">Bubble map</button>
  </div>
</header>

<div class="bar" id="bar-table">
  <input type="text" id="q" placeholder="Search title / author / year / DOI…" size="38">
  <label>Animal <select id="f-an"><option value="">(any)</option></select></label>
  <label>Pathway <select id="f-fb"><option value="">(any)</option></select></label>
  <label>Source <select id="f-src"><option value="">(any)</option></select></label>
  <label>Year <input type="number" id="f-y0" placeholder="from"> – <input type="number" id="f-y1" placeholder="to"></label>
  <label><input type="checkbox" id="f-notes"> has notes</label>
  <label><input type="checkbox" id="f-pdf"> has PDF</label>
  <span class="warn" id="cellwarn"></span>
  <button onclick="clearCell()">Clear drill-through</button>
</div>

<div class="bar" id="bar-pivot" style="display:none">
  <label>Rows <select id="p-row"></select></label>
  <label>Columns <select id="p-col"></select></label>
  <label class="sub">Count = papers. Multi-valued fields (animal, pathway) count the paper once per value. Click a cell to drill through to the Table tab.</label>
</div>

<div class="bar" id="bar-map" style="display:none">
  <label>View <select id="m-view">
    <option value="all">All papers</option>
    <option value="refs">References</option>
    <option value="citedby">Cited by</option>
    <option value="review">Research review</option>
    <option value="animal">Animal studies</option>
    <option value="models">Models</option>
  </select></label>
  <label>Left click action <select id="m-swap">
    <option value="focus">Focus paper</option>
    <option value="details">Show details</option>
  </select></label>
  <label class="sub">Left-click = focus (in References/Cited-by: make that paper the map; otherwise spotlight it). Right-click, Ctrl+click (Mac) or Shift+Enter = details. Tab/arrow keys + Enter also work; Esc = back. Wheel = zoom, drag = pan.</label>
</div>

<main id="view-table">
  <div id="count"></div>
  <table><thead><tr>
    <th data-k="a">First author</th><th data-k="t">Title</th><th data-k="y" class="num">Year</th>
    <th data-k="c" class="num">Cites</th><th>Tags</th>
  </tr></thead><tbody id="tbody"></tbody></table>
</main>

<main id="view-pivot" style="display:none"></main>
<main id="view-map" style="display:none">
  <div id="crumb"></div>
  <canvas id="canvas" tabindex="0" role="application"
          aria-label="Bubble map: publication year (horizontal) versus citation count (vertical). Use arrow keys to move between bubbles, Enter for the primary action, Shift+Enter for details, Escape to go back."></canvas>
  <div class="sr" id="map-live" aria-live="polite"></div>
  <div class="legend" id="maplegend"></div>
</main>

<script type="application/json" id="sadb-data">[{"id":"rec00Fih3nO6FmfNV","t":"Emergence of natural and robust bipedal walking by learning from biologically plausible objectives","a":"Schumacher","s":"","y":2025,"d":"10.1016/j.isci.2025.112203","an":["Human"],"fb":[],"md":["Schumacher 2025"],"mr":[],"rv":[],"pdf":1,"n":0,"nt":"","src":"task5import","c":10,"cl":0},{"id":"rec00oIejxpXTzNt9","t":"Reorganization of spinal neural connectivity following recovery after thoracic spinal cord injury: insights from computational modelling","a":"Shevtsova","s":"","y":2025,"d":"10.1101/2025.05.17.654682","an":["Rat"],"fb":[],"md":["Shevtsova 2025"],"mr":[],"rv":[],"pdf":1,"n":1,"nt":"Rat-adapted spinal locomotor circuit models reproduce pre-injury and recovered gait after two thoracic injury types and point to distinct recovery mechanisms: lateral hemisection required functional restoration of descending drive and long propriospinal detour pathways, while midline contusion recovery relied on spared sublesional reorganization and altered supralesional cervical control.","src":"task5import","c":0,"cl":1},{"id":"rec01Sym3p8O4bSMn","t":"Locomotor activity in spinal cord-injured persons","a":"Dietz and Harkema","s":"","y":2004,"d":"10.1152/japplphysiol.00942.2003","an":["Human"],"fb":[],"md":[],"mr":[],"rv":[],"pdf":1,"n":1,"nt":"After a spinal cord injury (SCI) of the cat or rat, neuronal centers below the level of lesion exhibit plasticity that can be exploited by specific training paradigms. In individuals with complete or incomplete SCI, human spinal locomotor centers can be activated and modulated by locomotor training (facilitating stepping movements of the legs using body weight support on a treadmill to provide appropriate sensory cues). Individuals with incomplete SCI benefit from locomotor training such that they improve their ability to walk over ground. Load- or hip joint-related afferent input seems to be of crucial importance for both the generation of a locomotor patte d":[],"mr":[],"rv":[],"pdf":0,"n":0,"nt":"","src":"rest383","c":223,"cl":3},{"id":"rec2jytMTqUIEJMaK","t":"Synaptic control of hindlimb motoneurones during three forms of the fictive scratch reflex in the turtle.","a":"Robertson and Stein","s":"","y":1988,"d":"10.1113/jphysiol.1988.sp017281","an":["Turtle"],"fb":[],"md":[],"mr":[],"rv":[],"pdf":1,"n":1,"nt":"Intracellular recordings for three distinct forms of turtle scratch reflex in response to tactile stimulation of body surface.","src":"originals99","c":88,"cl":1},{"id":"rec2l3X3DRev8OZEt","t":"Simulations of neuromuscular control in lamprey swimming","a":"Leeuwen","s":"Ekeberg; Grillner","y":1999,"d":"10.1098/rstb.1999.0441","an":["Lamprey"],"fb":[],"md":["Ekeberg and Grillner"],"mr":[],"rv":[],"pdf":1,"n":1,"nt":"Cited by Geyer and Herr.\nThe neuronal generation of vertebrate locomotion has been extensively studied in the lamprey. Models at different levels of abstraction are being used to describe this system, from abstract nonlinear oscillators to interconnected model neurons comprising multiple compartments and a Hodgkin–Huxley representation of the most relevant ion channels. To study the role of sensory feedback by simulation, it eventually also becomes necessary to incorporate the mechanical movements in the models. By using simplifying models of muscle activation, body mechanics, counteracting water forces, and sensory feedback through stretch receptors and vestibular organs, we have been able to close the feedback loop to enable studies of the interaction between the neuronal and the mechanical systems. The neuromechanical simulations reveal that the currently known network is sufficient for generating a whole repertoire of swimming patterns. Swimming at different speeds and with different wavelengths, together with the performance of lateral turns can all be achieved by simply varying the brainstem input. The neuronal mechanisms behind pitch and roll manoeuvres are less clear. We have put forward a ‘crossed–oscillators’ hypothesis where partly separate dorsal and ventral circuits are postulated. Neuromechanical simulations of this system show that it is also capable of generating realistic pitch turns and rolls, and that vestibular signals can stabilize the posture during swim","src":"originals99","c":154,"cl":0},{"id":"rec2qezdCASwOpm4G","t":"Human postural sway results from frequent, ballistic bias impulses by soleus and gastrocnemius","a":"Loram","s":"","y":2005,"d":"10.1113/jphysiol.2004.076307","an":["Human"],"fb":[],"md":[],"mr":[],"rv":[],"pdf":0,"n":1,"nt":"Here we employ automated analysis of ultrasound images to resolve calf muscle (soleus and gastro- cnemius) length changes as small as 10 µmi n standing subjects.","src":"task5import","c":343,"cl":4},{"id":"rec2vnLEhwtLZDpnJ","t":"Dynamic simulation of insect walking.","a":"Ekeberg","s":"Blümel; Büschges","y":2004,"d":"10.1016/j.asd.2004.05.002","an":["Stick Insect","Insects","Arthropods"],"fb":["Chordotonal organ multi-synaptic excitation","Chordotonal organ multi-synaptic inhibition"],"md":["Ekeberg 2004"],"mr":[],"rv":[],"pdf":0,"n":1,"nt":"A 3-D biomechanical stick-insect leg driven by a reduced neural controller containing only experimentally established chordotonal-organ reflex mechanisms reproduces the full middle-leg step cycle in both restricted and unrestrained simulations; front-leg stepping works with the same mechanisms, whereas hind-leg control requires reorganized, possibly sign-reversed, chordotonal influence on levator–depressor timing.","src":"rest383","c":150,"cl":0},{"id":"rec2xw9sbTwrnAK5e","t":"Balancing of humanoid robot using contact force/moment control by task-oriented whole body control framework","a":"Lee","s":"","y":2015,"d":"10.1007/s10514-015-9509-1","an":["Human"],"fb":[],"md":[],"mr":[],"rv":[],"pdf":0,"n":1,"nt":"The proposed approach in this paper is to maintain balance of torque-controlled robots by controlling contact force and moment using whole-body control framework with hierar- chical structure.","src":"task5import","c":57,"cl":-1},{"id":"rec30h0ZO39QemhM4","t":"Robotics Application of a Method for Analytically Computing Infinitesimal Phase Response Curves","a":"Fitzpatrick","s":"Wang; Thomas; Quinn; Szczecinski","y":2020,"d":"10.1007/978-3-030-64313-3_12","an":[],"fb":[],"md":[],"mr":[],"rv":[],"pdf":0,"n":0,"nt":"","src":"rest383","c":2,"cl":0},{"id":"rec317AjMO6M6rHW7","t":"General Principles of Rhythmogenesis in Central Pattern Generator Networks","a":"Harris-Warrick","s":"","y":2010,"d":"10.1016/b978-0-444-53613-6.00014-9","an":[],"fb":[],"md":[],"mr":[],"rv":[],"pdf":0,"n":0,"nt":"","src":"task5import","c":97,"cl":1},{"id":"rec3237UGETrSD0Uw","t":"Modeling the spinal cord neural circuitry controlling cat hindlimb movement during locomotion","a":"Ivashko","s":"Prilutsky; Markin; Chapin; Rybak","y":2003,"d":"10.1016/S0925-2312(02)00832-9","an":["Cat"],"fb":["Ib disynaptic excitation","Ib disynaptic excitation","Ib stance to swing","Ib swing to stance","Ia stance to swing","Ia swing to stance","Ia monosynaptic","Ia monosynaptic excitation","Mechanosensory monosynaptic excitation","Ia disynaptic inhibition"],"md":["Ivashko 2003"],"mr":[],"rv":[],"pdf":1,"n":1,"nt":"Abstract\nA computational model of the spinal cord neural circuitry that controls locomotor movements of simulated cat hindlimbs. The neural circuitry includes two central pattern generators integrated with reflex circuits. All neurons were modeled in the Hodgkin–Huxley style. The musculoskeletal system includes two three-joint hindlimbs and the trunk. Each\nhindlimb is actuated by nine one- and two-joint muscles (a Hill-type model). Our simulations allow us to suggest a speci\ffic network architecture in the spinal cord and a pattern of feedback connectivities (from Ia and Ib fi\fbers and touch sensors) that provide stable locomotion and realistic patterns of muscle activation and kinematics of limb movements.","src":"originals99","c":57,"cl":0},{"id":"rec35p rc":"rest383","c":22,"cl":2},{"id":"rec5TrEW6v3HlB4bx","t":"The use of state-dependent modulation of spinal reflexes as a tool to investigate the organization of spinal interneurons.","a":"Burke","s":"","y":1999,"d":"10.1007/s002210050847","an":[],"fb":[],"md":[],"mr":[],"rv":[],"pdf":0,"n":0,"nt":"","src":"rest383","c":145,"cl":2},{"id":"rec5Zg2JdbuTEWRgt","t":"Evolution and Development of a Central Pattern Generator for the Swimming of a Lamprey","a":"Ijspeert","s":"","y":1999,"d":"10.1162/106454699568773","an":["Lamprey"],"fb":[],"md":["Ijspeert 1999"],"mr":[],"rv":[],"pdf":0,"n":1,"nt":"Computational model study. Inspired by the central pattern generators found in animals, we develop neural controllers that can produce the patterns of oscillations necessary for the swimming of a simulated lamprey.","src":"task5import","c":5,"cl":-1},{"id":"rec5mXZipoOAVszd0","t":"Firing Properties of Identified Interneuron Populations in the Mammalian Hindlimb Central Pattern Generator","a":"Butt","s":"Harris-Warrick; Kiehn","y":2002,"d":"10.1523/jneurosci.22-22-09961.2002","an":[],"fb":[],"md":[],"mr":[],"rv":[],"pdf":1,"n":0,"nt":"","src":"rest383","c":135,"cl":1},{"id":"rec5nlSDkEYm0W4Zs","t":"Organization of mammalian locomotor rhythm and pattern generation","a":"McCrea and Rybak","s":"","y":2008,"d":"10.1016/j.brainresrev.2007.08.006","an":["Cat","Mammals"],"fb":[],"md":[],"mr":[],"rv":[],"pdf":1,"n":1,"nt":"Central pattern generators (CPGs) located in the spinal cord produce the coordinated activation of flexor and extensor motoneurons during locomotion. Previously proposed architectures for the spinal locomotor CPG have included the classical half-center oscillator and the unit burst generator (UBG) comprised of multiple coupled oscillators. We have recently proposed another organization in which a two-level CPG has a common rhythm generator (RG) that controls the operation of the pattern formation (PF) circuitry responsible for motoneuron activation. These architectures are discussed in relation to recent data obtained during fictive locomotion in the decerebrate cat. The data show that the CPG can maintain the period and phase of locomotor oscillations both during spontaneous deletions of motoneuron activity and during sensory stimulation affecting motoneuron activity throughout the limb. The proposed two-level CPG organization has been investigated with a computational model which incorporates interactions between the CPG, spinal circuits and afferent inputs. The model includes interacting populations of spinal interneurons and motoneurons modeled in the Hodgkin-Huxley style. Our simulations demonstrate that a relatively simple CPG with separate RG and PF networks can realistically reproduce many experimental phenomena including spontaneous deletions of motoneuron activity and a variety of effects of afferent stimulation. The model suggests plausible explanations for a numbe","src":"originals99","c":712,"cl":1},{"id":"rec5sjYrRbJ9t4e20","t":"Functionally complex muscles of the cat hindlimb. IV. Intramuscular distribution of movement command signals and cutaneous reflexes in broad, bifunctional thigh muscles","a":"Pratt","s":"Chanaud; Loeb","y":1991,"d":"10.1007/bf00229407","an":[],"fb":[],"md":[],"mr":[],"rv":[],"pdf":0,"n":0,"nt":"","src":"rest383","c":179,"cl":3},{"id":"rec5srLHcKIr8DRpI","t":"A robust controller for manipulator driven by artificial muscle actuator","a":"Cai","s":"","y":1996,"d":"10.1109/cca.1996.558917","an":[],"fb":[],"md":["Cai 1996"],"mr":[],"rv":[],"pdf":0,"n":1,"nt":"Computational model study. By applying the sliding mode control technique and the presented full dynamic of manipula- tor, a robust tracking control approach is developed for such manipulator system.","src":"task5import","c":27,"cl":-1},{"id":"rec64h8He8xeJf189","t":"Organization of functional synaptic connections between medullary reticulospinal neurons and lumbar descending commissural interneurons in the neonatal mouse.","a":"Szokol","s":"Glover; Perreault","y":2011,"d":"10.1523/jneurosci.5486-10.2011","an":[],"fb":[],"md":[],"mr":[],"rv":[],"pdf":1,"n":0,"nt":"","src":"rest383","c":35,"cl":1},{"id":"rec6CY6DRoQ0Nlgvn","t":"Control Engineering","a":"Keviczky","s":"","y":2019,"d":"10.1007/978-981-10-8297-9","an":[],"fb":[],"md":[],"mr":[],"rv":[],"pdf":0,"n":1,"nt":"Johnson, Oxford, UK Linda Bushnell, Seattle, WA, USA More information about this series at http://www.springer.com/series/4045.","src":"task5import","c":47,"cl":-1},{"id":"rec6EhQhpWHDNDPX5","t":"Modulation of forelimb and hindlimb muscle activity during quadrupedal tied-belt and split-belt locomotion in intact cats","a":"Frigon","s":"Thibaudier; Hurteau","y":2015,"d":"10.1016/j.neuroscience.2014.12.084","an":["Cat"],"fb":[],"md":[],"mr":[],"rv":[],"pdf":1,"n":1,"nt":"Cats were chronically implanted for EMG, which was\nobtained from six muscles: biceps brachii, triceps brachii,\nflexor carpi ulnaris, sartorius, vastus lateralis and medial\ngastrocnemius. During tied-belt locomotion, cats stepped\nfrom 0.4 to 1.0 m/s in 0.1 m/s increments whereas during\nsplit-belt locomotion, cats stepped with left–right speed\ndifferences of 0.1 to 0.4 m/s in 0.1 m/s increments. During\ntied-belt locomotion, EMG burst durations and mean EMG\namplitudes of all muscles respectively decreased and\nincreased with increasing speed. During split-belt locomotion, there was a clear differential modulation of the EMG\npatterns between flexors and extensors and between the\nslow and fast sides. Changes in the EMG pattern of some\nmuscles could be explained by the speed of the belt the limb\nwas stepping on, while in other muscles there were clear\ndissociations from tied-belt values at matched speeds.\nTherefore, results show that EMG patterns during split-belt\nlocomotion are modulated to meet task requirements partly\nvia signals related to the stepping speed of the homonymous\nlimb and from the other limbs.","src":"originals99","c":61,"cl":3},{"id":"rec6Fd1OrPbNA2Yl0","t":"Main characteristics of the hindlimb locomotor cycle in the decorticate cat with special reference to bifunctional muscles.","a":"Perret and Cabelguen","s":"","y":1980,"d":"10.1016/0006-8993(80)90207-3","an":[],"fb":[],"md":[],"mr":[],"rv":[],"pdf":0,"n":0,"nt":"","src":"rest383","c":250,"cl":3},{"id":"rec6GvqjHjEavh3QO","t":"Role of muscle spindle feedback in regulating muscle activity strength during walking at different speed in mice.","a":"Mayer et al.","s":"","y":2018,"d":"10.1152/jn.00250.2018","an":["Mice"],"fb":["Ia monosynaptic excitation"],"md":[],"mr":[],"rv":[],"pdf":0,"n":1,"nt":"Muscle spindle feedback regulates the strength of muscle activity across walking speeds in mice — Ia feedback scales EMG amplitude, not only timing, so spindle loss degrades force output as speed increases.","src":"demo50","c":53,"cl":2},{"id":"rec6LflOgZmei9MLZ","t":"Neuromodulation and flexibility in Central Pattern Generator networks","a":"Harris-Warrick","s":"","y":2011,"d":"10.1016/j.conb.2011.05.011","an":[],"fb":[],"md":[],"mr":[],"rv":[],"pdf":0,"n":0,"nt":"","src":"task5import","c":238,"cl":1},{"id":"rec6Vhp6wlxjLUCWZ","t":"A Limited Set of Muscle Synergies for Force Control During a Postural Task","a":"Ting","s":"","y":2005,"d":"10.1152/jn.00681.2004","an":[],"fb":[],"md":["Ting 2005"],"mr":[],"rv":[],"pdf":0,"n":1,"nt":"Computational model study. 18 articles, 12 of which you can access for free at: This article cites http://jn.physiology.org/content/93/1/609.full#ref-list-1 59 other HighWire-hosted articles: This article has been cited by http://jn.physiology.org/content/93/1/609#cited-by including high resolution figures, can be found at: Updated information and services http://jn.physiology.org/content/93/1/609.full can be found at: Journal of...","src":"task5import","c":714,"cl":4},{"id":"rec6baizWac1zyZw3","t":"Human upright posture control models based on multisensory inputs; in fast and slow dynamics","a":"Chiba","s":"","y":2016,"d":"10.1016/j.neures.2015.12.002","an":["Human"],"fb":[],"md":[],"mr":[],"rv":["Chiba 2016"],"pdf":0,"n":1,"nt":"Review of human upright posture control models based multisensory. We found that the study of the slow dynamics is lagging compared to that of fast dynamics, such that our understanding of long-term alterations is insufﬁcient to reveal the underlying mechanisms and to propose suitable models.","src":"task5import","c":207,"cl":4},{"id":"rec6biPs0jRaVO5Wj","t":"Intra-muscle Synergies Stabilizing Reflex-mediated Force Changes","a":"Madarshahian","s":"Ricotta; Latash","y":2022,"d":"10.1016/j.neuroscience.2022.10.009","an":["Human"],"fb":[],"md":[],"mr":[],"rv":[],"pdf":1,"n":1,"nt":"Highlights\n•\nReflex-mediated finger force changes are stabilized by intra-muscle synergies.\n\n•\nNo synergies in the space of individual finger force stabilized the force changes.\n\n•\nEffects of dominance are seen in inter-finger but not intra-muscle synergies.\n\n•\nEffects of motor equivalence are seen during reflex-induced force changes.\n\n\nAbstract\nWe used the framework of the uncontrolled manifold hypothesis to explore force-stabilizing synergies and motor equivalence in the spaces of individual motor unit (MU) firing frequencies. Healthy subjects performed steady force production tasks by pressing with one finger or three fingers of a hand. Surface EMG was used to identify individual MU action potentials. MUs formed stable groups (MU-modes) with parallel scaling of the firing frequency in both flexor digitorum superficialis (FDS) and extensor digitorum communis (EDC) that allowed identifying them with the reciprocal and coactivation commands. Smooth lifting of the fingers by an “inverse piano” device led to an unintentional, reflex-based force increase. There was significantly larger motion in the space of MU-modes that kept the force unchanged (motor equivalent) compared to motion that changed force (non-motor equivalent). The force change was stabilized by co-varying contributions of the MU-modes defined separately for FDS and EDC. In contrast, analysis of the three-finger task in the space of individual finger forces showed no synergies stabilizing total force change. Effec","src":"originals99","c":46,"cl":4},{"id":"rec6jdOha2pd2hmhL","t":"Stimulation pattern that maximizes force in paralyzed and control whole thenar muscles","a":"Griffin","s":"","y":2002,"d":"10.1152/jn.2002.87.5.2271","an":["Human"],"fb":[],"md":[],"mr":[],"rv":[],"pdf":0,"n":1,"nt":"These data show that the pulse patterns that maximize force and force-time integral in paralyzed muscles are similar to those that maximize these parameters in single motor units and various whole muscles across species.","src":"task5import","c":38,"cl":16},{"id":"rec6lfBtg6uUvOxsZ","t":"The neuromechanical tuning hypothesis","a":"Prochazka","s":"Yakovenko; Cisek; Drew; Kalaska","y":2007,"d":"10.1016/S0079-6123(06)65016-4","an":["Mammals"],"fb":[],"md":[],"mr":[],"rv":[],"pdf":1,"n":1,"nt":"The rhythm-generating properties of central pattern generators (CPGs) are discussed in light of results indicating that cycle characteristics may be preset by tonic drive to spinal interneuronal networks. We then describe neuromechanical simulations that have revealed some basic rules of interaction between CPGs, sensory-mediated switching mechanisms and the biomechanics of locomotor movements. We posit that the spinal CPG timer and the sensory-mediated switch operate in parallel, the former being driven primarily by descending inputs and the latter by the kinematics. The CPG timer produces extensor and flexor phase durations, which covary along specific lines in a plot of phase- versus cycle-duration. We coined the term “phase-duration characteristics” to describe such plots. Descending input from higher centers adjusts the operating points on the phase-duration characteristics according to anticipated biomechanical requirements. In well-predicted movements, CPG-generated phase durations closely match those required by the kinematics, minimizing the corrections in phase duration required of the sensory switching mechanism. We propose the term “neuromechanical tuning” to describe this process of matching the CPG to the kinematics.","src":"originals99","c":53,"cl":5},{"id":"rec6oOFFhiSzLiCWK","t":"Quantifying Dynamic Stability and Maneuverability in Legged Locomotion","a":"Full","s":"","y":2002,"d":"10.1093/icb/42.1.149","an":[],"fb":[],"md":[],"mr":[],"rv":[],"pdf":0,"n":0,"nt":"","src":"task5import","c":258,"cl":0},{"id":"rec6oVWOeGUnJBYPR","t":"Stability Analysis of Legged Locomotion Models by Symmetry-Factored Return Maps","a":"Altendorfer","s":"","y":2004,"d":"10.1177/0278364904047389","an":[],"fb":[],"md":[],"mr":[],"rv":[],"pdf":1,"n":0,"nt":"","src":"task5import","c":91,"cl":0},{"id":"rec78NasDfISVsyLl","t":"Modular organization of murine locomotor pattern in the presence and absence of sensory feedback from muscle spindles","a":"Santuz","s":"Akay; Mayer; Wells; Schroll; Arampatzis","y":2019,"d":"10.1113/jp277515","an":["Mice"],"fb":[],"md":[],"mr":[],"rv":[],"pdf":1,"n":1,"nt":"Muscle synergy testing on mice with and without proprioceptive feedback.","src":"originals99","c":79,"cl":1},{"id":"rec7FBx5woaWolX0i","t":"Unified comparison of spinal locomotion control architectures in neuromechanical simulations","a":"Ton and Song","s":"","y":2026,"d":"10.64898/2026.06.09.731213","an":["Human"],"fb":[],"md":["Ton 2026"],"mr":[],"rv":[],"pdf":1,"n":1,"nt":"Implemented four representative spinal locomotion controllers (reflex-based, CPG-reflex, muscle-synergy, CPG-reflex-synergy) in one unified neuromechanical framework and compared them under shared biomechanical conditions: reflex-based and CPG-reflex-synergy controllers best reproduced experimentally observed gait characteristics, and the CPG-reflex-synergy controller was most versatile across speeds and slopes. The limited versatility of all spinal-only controllers across broader speed–slope conditions points to supraspinal modulation as necessary beyond nominal steady gait.","src":"task5import","c":0,"cl":-1},{"id":"rec7I2DYb4ZhTeZx0","t":"The functional role of triceps during human locomotion","a":"Honeine","s":"","y":2013,"d":"","an":[],"fb":[],"md":[],"mr":[],"rv":[],"pdf":0,"n":0,"nt":"","src":"task5import","c":0,"cl":-1},{"id":"rec7NCgPDniURHbDa","t":"Effects of ankle and hip muscle afferent inputs on rhythm generation during fictive locomotion.","a":"Frigon","s":"Sirois; Gossard","y":2010,"d":"10.1152/jn.01028.2009","an":[],"fb":[],"md":[],"mr":[],"rv":[],"pdf":1,"n":0,"nt":"","src":"rest383","c":34,"cl":2},{"id":"rec7PY2fLq3auXrSs","t":"The human spinal cord interprets velocity-dependent afferent input during stepping","a":"Beres-Jones and Harkema","s":"","y":2004,"d":"10.1093/brain/awh252","an":[],"fb":[],"md":[],"mr":[],"rv":[],"pdf":0,"n":0,"nt":"","src":"rest383","c":123,"cl":2},{"id":"rec7SsuX3Nrwil3Yy","t":"Genetic Ablation of V2a Ipsilateral Interneurons Disrupts Left-Right Locomotor Coordination in Mammalian Spinal Cord","a":"Crone","s":"Quinlan; Zagoraiou; Droho; Restrepo; Lundfald; Endo; Setlak; Jessell; Kiehn; Sharma","y":2008,"d":"10.1016/j.neuron.2008.08.009","an":[],"fb":[],"md":[],"mr":[],"rv":[],"pdf":1,"n":0,"nt":"","src":"rest383","c":366,"cl":1},{"id":"rec7VW15gV61Jljkj","t":"Multiple Rhythmic States in a Model of the Respiratory Central Pattern Generator","a":"Rubin","s":"","y":2009,"d":"10.1152/jn.90958.2008","an":["Rat"],"fb":[],"md":["Rubin 2009"],"mr":[],"rv":[],"pdf":0,"n":1,"nt":"Computational model study. We demonstrate that, although INaP is not necessary for the generation of three- and two-phase oscillations, it contributes to control of the oscillation period in each stat.","src":"task5import","c":166,"cl":1},{"id":"rec7ZwTKgliDson76","t":"Sensory Feedback Induced by Front-Leg Stepping Entrains the Activity of Central Pattern Generators in Caudal Segments of the Stick Insect Walking System","a":"Borgmann","s":"","y":2009,"d":"10.1523/jneu e hind legs in walking cats","src":"originals99","c":86,"cl":2},{"id":"rec8en50Ndz4x6F2Q","t":"Sensory regulation of stance-to-swing transition in generation of adaptive human walking: A simulation study","a":"Aoi","s":"Ogihara; Funato; Tsuchiya","y":2012,"d":"10.1016/j.robot.2011.12.005","an":[],"fb":[],"md":[],"mr":[],"rv":[],"pdf":1,"n":0,"nt":"","src":"rest383","c":19,"cl":0},{"id":"rec8gxMRruhT4CtH7","t":"The convergence of monosynaptic excitatory afferents on to many different species of alpha motoneurones","a":"Eccles and Lundberg","s":"","y":1957,"d":"10.1113/jphysiol.1957.sp005794","an":["Cat"],"fb":[],"md":[],"mr":[],"rv":[],"pdf":1,"n":1,"nt":"Intracellular recording from more than 400 cat spinal motoneurones defined the receptor field of group Ia monosynaptic excitation: a motoneurone receives EPSPs not only from its own muscle (homonymous) but from a characteristic set of synergists (heteronymous), establishing the convergent organization of the Ia monosynaptic pathway.","src":"rest383","c":722,"cl":2},{"id":"rec8jxlUJWMZw73UO","t":"Control of oscillation periods and phase durations in half-center central pattern generators: a comparative mechanistic analysis","a":"Daun","s":"Rubin; Rybak","y":2009,"d":"10.1007/s10827-008-0124-4","an":[],"fb":[],"md":[],"mr":[],"rv":[],"pdf":1,"n":1,"nt":"Although many half-center CPG models, composed of symmetric units linked by reciprocal inhibition yet varying in their intrinsic cellular properties, have been proposed, the precise oscillatory mechanisms operating in most biological CPGs remain unknown. Using numerical simulations and phase-plane analysis, we comparatively investigated how the intrinsic cellular features incorporated in different CPG models, such as subthreshold activation based on a slowly inactivating persistent sodium current, adaptation based on slowly activating calcium-dependent potassium current, or post-inhibitory rebound excitation, can contribute to the control of oscillation period and phase durations in response to changes in excitatory external drive to one or both half-centers. Our analysis shows that both the sensitivity of oscillation period to alterations of excitatory drive and the degree to which the duration of each phase can be separately controlled depend strongly on the intrinsic cellular mechanisms involved in rhythm generation and phase transitions. In particular, the CPG formed from units incorporating a slowly inactivating persistent sodium current shows the greatest range of oscillation periods and the greatest degree of independence in phase duration control by asymmetric inputs. These results are explained based on geometric analysis of the phase plane structures corresponding to the dynamics for each CPG type, which in particular helps pinpoint the roles of escape and release f","src":"originals99","c":134,"cl":0},{"id":"rec92HUnN53mhFrCc","t":"Processing of Horizontal Optic Flow in Three Visual Interneurons of the Drosophila Brain","a":"Schnell","s":"","y":2010,"d":"10.1152/jn.00950.2009","an":["Insects"],"fb":[],"md":[],"mr":[],"rv":[],"pdf":1,"n":1,"nt":"First whole-cell recordings of Drosophila horizontal-system cells (HSN, HSE, HSS): direction-selective tuning to large-field horizontal motion consistent with the correlation-type motion-detection model, with extensive ipsilateral coupling explaining sensitivity to both ipsi- and contralateral motion — the circuit basis for optomotor behavior.","src":"task5import","c":158,"cl":-1},{"id":"rec92tGtIJ6rgNzA8","t":"The Ia afferent feedback of a given movement evokes the illusion of the same movement when returned to the subject via muscle tendon vibration","a":"Albert","s":"","y":2006,"d":"10.1007/s00221-005-0325-2","an":["Human"],"fb":[],"md":[],"mr":[],"rv":[],"pdf":0,"n":1,"nt":"The results show that the Ia aﬀerent feedback of a given movement evokes the illu- sion of the same movement when it is applied to the subject via the appropriate pattern of muscle tendon vibration.","src ivial since complex biomechanical, sensory, neural, and muscular subsystems are involved in human postural control.","src":"task5import","c":142,"cl":4},{"id":"rec9bo7XN3RjQvFgA","t":"Phase-Dependent Response to Afferent Stimulation During Fictive Locomotion: A Computational Modeling Study.","a":"Fujiki","s":"Aoi; Tsuchiya; Danner; Rybak; Yanagihara","y":2019,"d":"10.3389/fnins.2019.01288","an":[],"fb":[],"md":[],"mr":[],"rv":[],"pdf":1,"n":0,"nt":"","src":"rest383","c":8,"cl":2},{"id":"rec9fRy7A9nPiPCWr","t":"Diversity of reticulospinal systems in mammals","a":"Perreault and Giorgi","s":"","y":2019,"d":"10.1016/j.cophys.2019.03.001","an":["Mammals"],"fb":[],"md":[],"mr":[],"rv":["Perreault and Giorgi 2019"],"pdf":0,"n":1,"nt":"Review of reticulospinal system diversity in mammals — cell types, targets, and functional specialization beyond a monolithic 'reticulospinal tract'.","src":"demo50","c":21,"cl":1},{"id":"rec9m5Jii31v6NV9M","t":"A neuromechanical simulation of insect walking and transition to turning of the cockroach Blaberus discoidalis","a":"Szczecinski","s":"Brown; Bender; Quinn; Ritzmann","y":2014,"d":"10.1007/s00422-013-0573-3","an":["Cockroach"],"fb":[],"md":[],"mr":[],"rv":[],"pdf":1,"n":1,"nt":"A neuromechanical simulation of the cockroach Blaberus discoidalis was developed to explore changes in locomotion when the animal transitions from walking straight to turning. Once walking, inside turning, and outside turning were characterized, phase and amplitude changes for each joint of each leg were quantified. Apparent reflex reversals and joint activity changes were used to modify sensory coupling pathways between the CPG at each joint of the simulation. Oiled-plate experiments in simulation produced tarsus trajectories in stance similar to those seen in the animal. Simulations including forces that would be experienced if the insect was walking freely (i.e., weight support and friction) again produced similar results. These data were not considered duri uld be important in preventing\nsensory signals from destabilizing the walking pattern.\n\nThe speeddependent modulation of cutaneous reflexes was assessed by evoking and characterizing ipsilateral and contralateral responses in\nsemitendinosus, vastus lateralis, and lateral gastrocnemius muscles at four treadmill speeds: 0.2, 0.4, 0.6, and 0.8 m/s. The amplitudes of\nipsilateral and contralateral responses were largest at intermediate speeds of 0.4 and 0.6 m/s, followed by the slowest and fastest speeds\nof 0.2 and 0.8 m/s, respectively. The phase-dependent modulation of reflexes was maintained across speeds, with ipsilateral and contralateral responses peaking during the stance-to-swing transition and swing phase of the ipsilateral limb or midstance of the contralateral limb. Reflex modulation across speeds also correlated with the spatial symmetry of the locomotor pattern, but no","src":"originals99","c":31,"cl":3},{"id":"recC2l33o0qbTliw9","t":"Integration of feedforward and feedback control in the neuromechanics of vertebrate locomotion: a review of experimental, simulation and robotic studies","a":"Ijspeert and Daley","s":"","y":2023,"d":"10.1242/jeb.245784","an":[],"fb":[],"md":[],"mr":[],"rv":[],"pdf":1,"n":0,"nt":"","src":"rest383","c":85,"cl":0},{"id":"recC76WYNaaRhRz3f","t":"Simulated Neural Dynamics Produces Adaptive Stepping and Stable Transitions in a Robotic Leg","a":"Klein","s":"Szczecinski; Ritzmann; Quinn","y":2014,"d":"10.1007/978-3-319-09435-9_15","an":[],"fb":[],"md":[],"mr":[],"rv":[],"pdf":1,"n":0,"nt":"","src":"rest383","c":1,"cl":0},{"id":"recC8F0zHHvXzceS9","t":"Taking the next step: cortical contributions to the control of locomotion","a":"Drew and Marigold","s":"","y":2015,"d":"10.1016/j.conb.2015.01.011","an":[],"fb":[],"md":[],"mr":[],"rv":[],"pdf":0,"n":0,"nt":"","src":"rest383","c":220,"cl":1},{"id":"recC9OOtHmEDmuNji","t":"Dephasing and Bursting in Coupled Neural Oscillators","a":"Han","s":"","y":1995,"d":"10.1103/physrevlett.75.3190 ":2015,"d":"10.1113/JP270121","an":["Mammals","Mice"],"fb":[],"md":["Shevtsova 2015"],"mr":[],"rv":[],"pdf":1,"n":1,"nt":"Coordination of neuronal activity between left and right sides of the mammalian spinal cord is provided by several sets of commissural interneurons (CINs) whose axons cross the midline. Genetically identified inhibitory V0D and excitatory V0V CINs and ipsilaterally projecting excitatory V2a interneurons were shown to secure left-right alternation at different locomotor speeds. We have developed computational models of neuronal circuits in the spinal cord that include left and right rhythm-generating centres interacting bilaterally via three parallel pathways mediated by V0D , V2a-V0V and V3 neuron populations. The models reproduce the experimentally observed speed-dependent left-right coordination in normal mice and the changes in coordination seen in mutants lacking specific neuron classes. The models propose an explanation for several experimental results and provide insights into the organization of the spinal locomotor network and parallel CIN pathways involved in gait control at different locomotor speeds.","src":"originals99","c":120,"cl":1},{"id":"recDKiZNcb9N7EN7W","t":"Dynamic Stability of Open-Loop Hopping","a":"Cham","s":"","y":2006,"d":"10.1115/1.2718237","an":[],"fb":[],"md":["Cham 2006"],"mr":[],"rv":[],"pdf":0,"n":1,"nt":"Computational model study. Cutkosky Center for Design Research, Stanford University, Stanford, CA 94305-2232 Dynamic Stability of Open-Loop Hopping Simulations and physical robots have shown that hopping and running are possible without sensory feedback.","src":"task5import","c":27,"cl":4},{"id":"recDNGNcRKT5a9NLH","t":"Influence of Brain Stem on Axial and Hindlimb Spinal Locomotor Rhythm Generating Circuits of the Neonatal Mouse.","a":"Jean-Xavier and Perreault","s":"","y":2018,"d":"10.3389/fnins.2018.00053","an":[],"fb":[],"md":[],"mr":[],"rv":[],"pdf":1,"n":0,"nt":"","src":"rest383","c":13,"cl":1},{"id":"recDNN  control:\nthe transformations that map information from sensory\nto motor coordinates, the specification of individual\nmuscle activations to achieve a kinematic goal, and the\ncontrol of multiple degrees of freedom. Here, we make\nthe case that the vertebrate spinal cord has the capacity\nto solve each of these problems to a degree that is relevant for normal behavior.","src":"originals99","c":135,"cl":2},{"id":"recErzmL73q2PEhtl","t":"A review of the integrate-and-fire neuron model: II. Inhomogeneous synaptic input and network properties","a":"Burkitt","s":"","y":2006,"d":"10.1007/s00422-006-0082-8","an":[],"fb":[],"md":["Burkitt 2006"],"mr":[],"rv":["Burkitt 2006"],"pdf":0,"n":1,"nt":"Review of review integrate-and-fire neuron model: ii.. Computational model study. The integrate-and-ﬁre neuron model has become established as a canonical model for the description of spiking neurons be- cause it is capable of being analyzed mathematically while at the same time being sufﬁciently complex to capture many of the essential features of neural processing.","src":"task5import","c":316,"cl":0},{"id":"recEuvR1ll5KDcz7b","t":"Biologically inspired approaches to robotics: what can we learn from insects?","a":"Beer","s":"Quinn; Chiel; Ritzmann","y":1997,"d":"10.1145/245108.245118","an":[],"fb":[],"md":[],"mr":[],"rv":[],"pdf":0,"n":0,"nt":"","src":"rest383","c":213,"cl":0},{"id":"recEvGQ0MflxZ13yF","t":"Decentralized control of insect walking: A simple neural network explains a wide range of behavioral and neurophysiological results","a":"Schilling and Cruse","s":"","y":2020,"d":"10.1371/journal.pcbi.1007804","an":["Insects"],"fb":[],"md":["Schilling and Cruse 2015"],"mr":["Dürr 2004"],"rv":[],"pdf":1,"n":1,"nt":"Very interesting paper that should be a mandatory read for all that work on insect locomotion. Talks about scaling. 5-rule model. Also is like a literature review that uses 148 reference citations.","src":"originals99","c":63,"cl":0},{"id":"recEvboexSzZrC9Ah","t":"Paradoxical muscle movement in human standing","a":"Loram","s":"","y":2004,"d":"10.1113/jphysiol.2004.062398","an":["Human"],"fb":[],"md":[],"mr":[],"rv":[],"pdf":0,"n":1,"nt":"Here we use dynamic ultrasound imaging in vivo with novel automated tracking of muscle length to test our hypo- thesis.","src":"task5import","c":176,"cl":4},{"id":"recFA1PeRSPTv9POu","t":"Neurobiological Bases of Rhythmic Motor Acts in Vertebrates","a":"Grillner","s":"","y":1985,"d":"10.1126/science.3975635","an":[],"fb":[],"md":[],"mr":[],"rv":[],"pdf":0,"n":0,"nt":"","src":"rest383","c":1085,"cl":6},{"id":"recFcuIXzjebeAqZF","t":"Intralimb and Interlimb Cutaneous Reflexes during Locomotion in the Intact Cat","a":"Hurteau","s":"Thibaudier; Dambreville; Danner; Rybak; Frigon","y":2018,"d":"10.1523/JNEUROSCI.3288-17.2018","an":["Cat"],"fb":["Cutaneous flexor excitation","Cutaneous stance modification"],"md":[],"mr":[],"rv":[],"pdf":1,"n":1,"nt":"The skin contains receptors that, when activated, send inputs to spinal circuits, signaling a perturbation. Rapid responses, or\nreflexes,inmuscles ofthe contacted limb and opposite homologous limb helpmaintain balance andforward progression.Here, we\ninvestigated reflexes during quadrupedal locomotion in the cat by electrically stimulating cutaneous nerves in each of the four\nlimbs. Functionally, responses appear to modify the trajectory or stabilize the movement of the stimulated limb while modifying\nthe support phase ofthe other limbs. Reflexes between limbs aremediated byfast-conducting pathwaysthatinvolve excitatory and\ninhibitory circuits controlling each limb. The comparatively stronger descending pathways from cervical to lumbar circuits\ncontrolling the forelimbs and hindlimbs, respectively, could serve a protective function.","src":"originals99","c":45,"cl":3},{"id":"recFd4pICpFKMQZ4h","t":"Maintenance of Lateral Stability During Standing and Walking in the Cat","a":"Karayannidou","s":"","y":2009,"d":"10.1152/jn.90934.2008","an":["Cat"],"fb" ptic excitation","Chordotonal organ multi-synaptic inhibition"],"md":[],"mr":[],"rv":[],"pdf":1,"n":1,"nt":"The cockroach model and describe the basic characteristics of the neural generation and control of walking and running in this insect. The paper provides a brief overview of some recent studies, including mathematical modeling, which have contributed to knowledge of sensory control in cockroach locomotion. They focus on two sensory mechanisms and sense organs, those providing information related to loading and unloading of the body and the legs, and leg-movement-related sensory receptors, and present evidence for the instrumental role of these sensory signals in inter-leg locomotion control.","src":"originals99","c":49,"cl":0},{"id":"recFp8cXN4LD8SGTC","t":"Self-adapting humanoid locomotion using a neural oscillator network","a":"Yang","s":"","y":2007,"d":"10.1109/iros.2007.4399498","an":["Human"],"fb":[],"md":["Yang 2007"],"mr":[],"rv":[],"pdf":1,"n":1,"nt":"Computational model study. In order to verify the validity of the proposed scheme, we carry out simulations and experiments.","src":"task5import","c":14,"cl":0},{"id":"recFqSV9WOXZsTiV9","t":"Sensory Feedback and Central Neuronal Interactions in Mouse Locomotion","a":"Molkov","s":"Yu; Ausborn; Bouvier; Danner; Rybak","y":2023,"d":"10.1101/2023.10.31.564886","an":[],"fb":[],"md":[],"mr":[],"rv":[],"pdf":1,"n":0,"nt":"","src":"rest383","c":2,"cl":1},{"id":"recFsVAudLXpREicY","t":"Spinal Sensorimotor Circuits Play a Prominent Role in Hindlimb Locomotor Recovery after Staggered Thoracic Lateral Hemisections but Cannot Restore Posture and Interlimb Coordination during Quadrupedal Locomotion in Adult Cats","a":"Audet","s":"","y":2023,"d":"10.1523/ENEURO.0191-23.2023","an":["Cat"],"fb":[],"md":[],"mr":[],"rv":[],"pdf":1,"n":1,"nt":"Staggered thoracic lateral hemisections in cats: hindlimb locomotion recovers spontaneously but forelimb–hindlimb coordination degrades into weaker 2:1 patterns, left–right stance/swing asymmetries appear then reverse after the second hemisection, and posture plus interlimb coordination remain impaired — lumbar sensorimotor circuits carry hindlimb recovery but not supraspinal-dependent coordination.","src":"task5import","c":19,"cl":3},{"id":"recG2jrJ4gY7qKHfD","t":"Neural Adaptation in the Generation of Rhythmic Behavior","a":"Pearson","s":"","y":2000,"d":"10.1146/annurev.physiol.62.1.723","an":[],"fb":[],"md":[],"mr":[],"rv":[],"pdf":0,"n":1,"nt":"Central pattern generators are extremely flexible: neuromodulators, central commands and afferent signals reshape the cellular and synaptic properties of the neurons and the coupling between populations, and afferent feedback from limb proprioceptors drives the long-term adaptation that keeps motor output matched to changed body mechanics and persistent performance errors.","src":"rest383","c":257,"cl":2},{"id":"recG2w6dXkFEbMjK7","t":"The role of the motor cortex in the control of accuracy of locomotor movements in the cat.","a":"Beloozerova and Sirota","s":"","y":1993,"d":"10.1113/jphysiol.1993.sp019498","an":["Cat"],"fb":[],"md":[],"mr":[],"rv":[],"pdf":0,"n":1,"nt":"Motor cortex controls the accuracy of locomotor movements: cortical neurons encode precise foot placement, and cortical inactivation impairs accuracy without abolishing walking.","src":"demo50","c":239,"cl":3},{"id":"recGKVBie7mDU3cny","t":"Influence of Large-Scale Freestream Turbulence on the Performance of a Thin Airfoil","a":"Ravi","s":"","y":2012,"d":"10.2514/1.j051640","an":["Human"],"fb":[],"md":[],"mr":[],"rv":[],"pdf":0,"n":1,"nt":"Freestream turbulence present within the atmospheric boundary layer can generally be characterized in terms of its intensity and integral length scale.","src":"task5import","c":28,"cl":11},{"id":"recGNWivbxaXIUKPy","t":"Phase-dependent modulation of primary afferent depolarization in single cutaneous primary afferents evoked by peripheral stimulation during fictive locomotion in the cat","a":"Gossard","s":"Cabelguen; Rossignol","y":1990,"d":"10.1016/0006-8993(90)90334-8","an":[],"fb":[],"md":[],"mr":[],"rv":[],"pdf":0,"n":0,"nt":"","src":"rest383","c":82,"cl":3},{"id":"recGU0bgWYQk3Q3ur","t":"Subject-Specific Muscle Synergies in Human Balance Control Are Consistent Across Different Biomechanical Contexts","a":"Torres-Oviedo","s":"","y":2010,"d":"10.1152/jn.00960.2009","an":["Human"],"fb":[],"md":[],"mr":[],"rv":[],"pdf":0,"n":1,"nt":"Consistent with this hypothesis, we showed that trial-by-trial variations in muscle activation for multidirectional balance control in humans were con- strained by a small set of muscle synergies.","src":"task5import","c":307,"cl":4},{"id":"recGXAkc9YqiOxZyT","t":"Ipsilateral and Contralateral Interactions in Spinal Locomotor Circuits Mediated by V1 Neurons: Insights from Computational Modeling","a":"Shevtsova","s":"Li; Singh; Dougherty; Rybak","y":2022,"d":"10.3390/ijms23105541","an":[],"fb":[],"md":[],"mr":["Shevtsova 2015"],"rv":[],"pdf":1,"n":1,"nt":"We describe and analyze a computational model of neural circuits in the mammalian spinal cord responsible for generating and shaping locomotor-like oscillations. The model represents interacting populations of spinal neurons, including the neurons that were genetically identified and characterized in a series of previous experimental studies. Here, we specifically focus on the ipsilaterally projecting V1 interneurons, their possible role in the spinal locomotor circuitry, and their involvement in the generation of locomotor oscillations. The proposed connections of these neurons and their involvement in different neuronal pathways in the spinal cord allow the model to reproduce the results of optogenetic manipulations of these neurons under different experimental conditions. We suggest the existence of two distinct populations of V1 interneurons mediating different ipsilateral and contralateral interactions within the spinal cord. The model proposes explanations for multiple experimental data concerning the effects of optogenetic silencing and activation of V1 interneurons on the frequency of locomotor oscillations in the intact cord and hemicord under different experimental conditions. Our simulations provide an important insight into the organization of locomotor circuitry in the mammalian spinal cord.","src":"originals99","c":22,"cl":1},{"id":"recGZwypGABEgcHnw","t":"Central pattern generator for swimming in <i>Melibe<\/i>","a":"Thompson","s":"","y":2005,"d":"10.1242/jeb.01500","an":[],"fb":[],"md":["Thompson 2005"],"mr":[],"rv":[],"pdf":0,"n":1,"nt":"Computational model study. We propose that the swim CPG consists of two pairs of interneurons.","src":"task5import","c":41,"cl":0},{"id":"recGepjwk3eNhBIb5","t":"Extending the Functional Subnetwork Approach to a Generalized Linear Integrate-and-Fire Neuron Model.","a":"Szczecinski","s":"Quinn; Hunt","y":2020,"d":"10.3389/fnbot.2020.577804","an":[],"fb":[],"md":[],"mr":[],"rv":[],"pdf":1,"n":0,"nt":"","src":"rest383","c":12,"cl":0},{"id":"recGh9JducyMI73Jk","t":"Aerodynamic Sensing for a Fixed Wing UAS Operating at High Angles of Attack","a":"Yeo","s":"","y":2012,"d":"10.2514/6.2012-4416","an":[],"fb":[],"md":[],"mr":[],"rv":[],"pdf":0,"n":1,"nt":"This paper describes the ongoing development of a pressure - based aerodynamic data system for a fixed wing UAS operating at high angles of attack .","src":"task5import","c":21,"cl":7},{"id":"recGjIFEmPMcbesLF","t":"Parallel reflex pathways from flexor muscle afferents evoking resetting and flexion enhancement during fictive locomotion and scratch in the cat.","a":"Stecina et al.","s":"","y":2005,"d":"10.1113/jphysiol.2005.095505","an":["Cat"],"fb":["Ia or II stance to swing"],"md":[],"mr":[],"rv":[],"pdf":0,"n":1,"nt":"Parallel reflex pathways from flexor muscle afferents evoke resetting and flexion enhancement during fictive locomotion and scratch; group I/II flexor afferents access the rhythm generator through multiple routes.","src":"demo50","c": in insects and its role in adaptive motor control. We first examine\nthe detection and encoding of mechanical forces by primary mechanoreceptor neurons. We then discuss\nhow central circuits integrate and transform mechanosensory information to guide locomotion. Because\nmost studies in this field have been performed in locusts, cockroaches, crickets, and stick insects, the examples we cite here are drawn mainly from these ‘big insects’. However, we also pay particular attention to the\ntiny fruit fly, Drosophila, where new tools are creating new opportunities, particularly for understanding central circuits. Our aim is to show how studies of big insects have yielded fundamental insights relevant to\nmechanosensation in all animals, and also to point out how the Drosophila toolkit can contribute to future\nprogress in understanding mechanosensory processing.","src":"originals99","c":310,"cl":0},{"id":"recLkJ2b8tJBQhhQO","t":"Using mouse genetics to study the developing spinal locomotor circuit","a":"Thiry","s":"Roussel; Lemieux; Bretzner","y":2020,"d":"10.1016/b978-0-12-816477-8.00011-9","an":[],"fb":[],"md":[],"mr":[],"rv":[],"pdf":0,"n":0,"nt":"","src":"rest383","c":1,"cl":1},{"id":"recLkXRnPa75mfEqC","t":"Ankle dorsi- and plantar-flexion torques measured by dynamometry in healthy subjects from 5 to 80 years","a":"Moraux","s":"","y":2013,"d":"10.1186/1471-2474-14-104","an":["Human"],"fb":[],"md":["Moraux 2013"],"mr":[],"rv":[],"pdf":0,"n":1,"nt":"Computational model study. The objectives of this study were to establish normative data and predictive equations for both ankle dorsi- and plantar-flexion strength from a population of healthy subjects (children and adults), to assess the reliability of the measurements and to study the feasibility of using a novel...","src":"task5import","c":78,"cl":-1},{"id":"recLletXmaXDZQutA","t":"A model of the neuro-musculo-skeletal system for human locomotion","a":"Taga","s":"","y":1995,"d":"10.1007/bf00204048","an":["Human"],"fb" lating the left and right rhythm-generating circuits interacting via several commissural pathways, and extended this model by incorporating V1 and V2b neuron populations involved in flexor–extensor interactions on each cord side. \n\u0002 The model reproduces multiple experimental data on selective silencing and activation of V1 and/or V2b neurons and proposes the organization of their connectivity providing flexor–extensor alternation in the spinal cord.","src":"originals99","c":59,"cl":1},{"id":"recMfFMvBOIrfAd2d","t":"Flexion-reflex of the limb, crossed extension-reflex, and reflex stepping and standing.","a":"Sherrington","s":"","y":1910,"d":"10.1113/jphysiol.1910.sp001362","an":["Cat","Dog"],"fb":["Cutaneous flexor excitation"],"md":[],"mr":[],"rv":[],"pdf":1,"n":1,"nt":"Defined the flexion-reflex as a protective type-reflex of the whole limb and its companion crossed extension-reflex in the spinal cat and dog, and showed that reflex stepping fractionates them by phase: the extensor phase of one limb is reinforced by a crossed extension-reflex driven by the opposite limb's flexion, with stimulus-dependent reversal (Umkehr) marking the turning points of the step.","src":"rest383","c":1325,"cl":3},{"id":"recMmj8yLv1Uq6pyQ","t":"A biologically based neural system coordinates the joints and legs of a tetrapod","a":"Hunt","s":"Schmidt; Fischer; Quinn","y":2015,"d":"10.1088/1748-3190/10/5/055004","an":["Rat"],"fb":[],"md":[],"mr":[],"rv":[],"pdf":1,"n":0,"nt":"","src":"originals99","c":25,"cl":0},{"id":"recMmmhvOifMk1EqN","t":"Tonic Central and Sensory Stimuli Facilitate Involuntary Air-Stepping in Humans","a":"Selionov","s":"Ivanenko; Solopova; Gurfinkel","y":2009,"d":"10.1152/jn.90895.2008","an":[],"fb":[],"md":[],"mr":[],"rv":[],"pdf":1,"n":0,"nt":"","src":"rest383","c":116,"cl":6},{"id":"recMnOlQ5lFStwExZ","t":"Parallel compliance design for increasing robustness and efficiency in legged locomotion - theoretical background and applications","a":"AhmadSharbafi","s :[],"rv":[],"pdf":0,"n":0,"nt":"","src":"rest383","c":364,"cl":2},{"id":"recPOj8x831baOTFR","t":"Chapter 10--a hierarchical perspective on rhythm generation for locomotor control.","a":"Yakovenko","s":"","y":2011,"d":"10.1016/b978-0-444-53825-3.00015-2","an":[],"fb":[],"md":[],"mr":[],"rv":[],"pdf":0,"n":0,"nt":"","src":"rest383","c":35,"cl":3},{"id":"recPPcdJftkGUBtVn","t":"A Functional Subnetwork Approach to Designing Synthetic Nervous Systems That Control Legged Robot Locomotion","a":"Szczecinski","s":"Hunt; Quinn","y":2017,"d":"10.3389/fnbot.2017.00037","an":[],"fb":[],"md":["Szczecinski 2017"],"mr":[],"rv":[],"pdf":1,"n":1,"nt":"Design methodology for synthetic nervous systems: parameterized functional subnetworks performing addition, subtraction, multiplication, division, differentiation, and integration, with gains set from the neural operating range and biologically bounded values, assembled into larger controllers — the arithmetic-primitives approach underpinning MantisBot and later SNS control models.","src":"rest383","c":57,"cl":0},{"id":"recPWRifS8TOvKUYX","t":"Postural control and adaptation are influenced by preceding postural challenges","a":"Tjernström","s":"","y":2010,"d":"10.1007/s00221-010-2166-x","an":["Human"],"fb":[],"md":["Tjernström 2010"],"mr":[],"rv":[],"pdf":0,"n":1,"nt":"Computational model study. We investigated the possible consequences of two consecutive postural tasks on adaptation.","src":"task5import","c":22,"cl":4},{"id":"recPXVzvQp9ltwS8a","t":"Delineating the Diversity of Spinal Interneurons in Locomotor Circuits","a":"Gosgnach","s":"","y":2017,"d":"10.1523/jneurosci.1829-17.2017","an":[],"fb":[],"md":[],"mr":[],"rv":["Gosgnach 2017"],"pdf":0,"n":1,"nt":"Review of delineating diversity spinal interneurons locomotor. Lanuza,5 and Ying Zhang6 1Department of Physiology, University of Alberta, Edmonton, Alberta T6G 2H7, Canada,2Department of Neuroscience, Columbia University, New York, New York 10032, 3Department of Neurobiology and Anatomy, Drexel University, Philadelphia, Pennsylvania 19129,4Department of Neuroscience, Karolinska Institutet, Stockholm SE-171 77, Sweden, 5Department of Developmental...","src":"task5import","c":106,"cl":1},{"id":"recPnDjXSKqOF4BDt","t":"Proprioception and locomotor disorders","a":"Dietz","s":"","y":2002,"d":"10.1038/nrn939","an":["Human"],"fb":[],"md":[],"mr":[],"rv":[],"pdf":1,"n":1,"nt":"Review paper\nKey Points\nLocomotion in mammals depends on central pattern generators — networks of spinal interneurons that can produce rhythmic outputs independently of any modulatory input. However, the spinal activity pattern is influenced by inputs from peripheral afferents, brainstem nuclei and cortical motor centres. Central pattern generators must select the appropriate inputs at each stage of movement and according to external conditions.\n\nAfferent inputs that influence gait include the short-latency stretch reflex, which is mediated by excitatory monosynaptic connections between sensory fibres and motor neurons. This reflex is thought to compensate for small ground irregularities and is initiated when muscle stretch is detected by muscle spindles (the output of which is carried by type 1a fibres). The stretch reflex is modulated over the step cycle, with potential functional consequences.\n\nOther afferent inputs, which mediate polysynaptic reflexes, converge on spinal interneurons, where they are integrated with descending information. The information from afferent receptors such as Golgi organs and skin mechanoceptors is carried by different fibre classes. Polysynaptic reflexes produce compensatory responses during locomotion that involve synergistic activation of muscle groups in both legs.\n\nThe polysynaptic reflex system probably integrates two important sources of afferent information: those related to load and to hip-joint position. In cats, either of these source","src":"originals99","c":489,"cl":2},{"id":"recPnKgpWB1oLiyWJ","t":"On All Fours: A 3D Framework to Study Closed-loop Control of Quadrupedal Mouse Locomotion","a":"Ramalingasetty","s":"","y":2023,"d":"10.1162/isal_a_00788","an":["Mice"],"fb":[],"md":["Ramalingasetty 2023b"],"mr":[],"rv":[],"pdf":1,"n":1,"nt":"Proof-of-concept 3D closed-loop neuromechanical mouse: four limb rhythm generators drive pattern-formation circuits generating muscle synergies, with commissural and long-propriospinal interlimb coordination and spindle/Golgi/cutaneous feedback terminating in the RG, PF, and motoneuron layers; evolution-optimized flat-ground walking collapses with acute feedback removal.","src":"task5import","c":2,"cl":2},{"id":"recPoyqO9O9txmwm5","t":"Speed dependency in α-motoneuron activity and locomotor modules in human locomotion: indirect evidence for phylogenetically conserved spinal circuits","a":"Yokoyama","s":"Ogawa; Shinya; Kawashima; Nakazawa","y":2017,"d":"10.1098/rspb.2017.0290","an":["Human"],"fb":[],"md":[],"mr":[],"rv":[],"pdf":1,"n":1,"nt":"In human walking, generation of muscle activity is largely\naffected by sensory input [32]. In slow walking, as discussed\nabove, large sacral activity in mid-stance is presumably derived\nfrom foot-support interactions thorough load feedback. This\nsacral activity is most probably related to constancy in triceps\nactivity over the speed range and to negative speed dependency in PL activity with regard to load information in\nslow-speed walking, as discussed in [33]. At higher speeds,\nchanges in locomotor muscle activity are clearly related to\nreinforcement of sensory feedback depending on speed\nincreases. It is assumed that extensor activity during early\nstance phase (M5 activity and forward shift of activation\ntiming of M2 in running) was related to reinforcing load feedback (i.e. extensor reinforcing reflex) [34], and hamstring\nactivity at the end of swing (M4 activity) was related to an\nincrease in knee-extension speed (i.e. stretch reflex) [35].\nAlthough there was no doubt about the contributions of\nthese reflex-driven muscle activities to control speed in\nhuman locomotion, a modelling study showed that reflexbased muscle activity alone without CPGs cannot control\nlocomotor speed [36]. In addition to reflex control of locomotion, it has been shown that sensory feedback affects\nlumbar burst generators in CPGs [4,37]. Vibration of leg\nmuscles facilitated locomotor-like muscle activity evoked by\nspinal electromagnetic stimulation to the lumbar segment [4].\nA study in mice demonst","src":"originals99","c":23,"cl":1},{"id":"recPs5aq2lbEr1ozm","t":"Intra-axonal recordings of cutaneous primary afferents during fictive locomotion in the cat","a":"Gossard","s":"Cabelguen; Rossignol","y":1989,"d":"10.1152/jn.1989.62.5.1177","an":[],"fb":[],"md":[],"mr":[],"rv":[],"pdf":0,"n":0,"nt":"","src":"rest383","c":108,"cl":2},{"id":"recQ4DtooAZiS0uHM","t":"Neural control of locomotion; Part 1: The central pattern generator from cats to humans","a":"Duysens and Van de Crommert","s":"","y":1998,"d":"10.1016/s0966-6362(97)00042-8","an":[],"fb":[],"md":[],"mr":[],"rv":[],"pdf":0,"n":0,"nt":"","src":"rest383","c":532,"cl":6},{"id":"recQ54lg8RzZLnbUW","t":"The Human Central Pattern Generator for Locomotion: Does It Exist and Contribute to Walking?","a":"Minassian","s":"Hofstoetter; Dzeladini; Guertin; Ijspeert","y":2017,"d":"10.1177/1073858417699790","an":[],"fb":[],"md":[],"mr":[],"rv":[],"pdf":1,"n":0,"nt":"","src":"rest383","c":203,"cl":6},{"id":"recQA3AJ46DeMxTIb","t":"Sub-populations of Spinal V3 Interneurons Form Focal Modules of Layered Pre-motor Microcircuits.","a":"Chopek","s":"Nascimento; Beato; Brownstone; Zhang","y":2018,"d":"10.1016/j.celrep.2018.08.095","an":[],"fb":[],"md":[],"mr":[],"rv":[],"pdf":0,"n":0,"nt":"","src":"rest383","c":91,"cl":1},{"id":"recQCsnmp7no8jfwi","t":"Stepping responses to treadmill perturbations vary with severity of motor deficits in human SCI","a":"Chu","s":"Hornby; Schmit","y":2018,"d":"10.1152/jn.00486.2017","an":["Human"],"fb":[],"md":[],"mr":[],"rv":[],"pdf":1,"n":1,"nt":"Split-belt treadmill perturbations during human stepping show that stopping one belt in midstance triggers an unnecessary swing in most walkers, with the likelihood dropping as SCI severity increases, while belt acceleration or deceleration during stance advances or delays swing onset — evidence for interdependent central and sensory drive in stepping control that degrades with injury severity.","src":"rest383","c":3,"cl":6},{"id":"recQKVOUIQSE8qO5U","t":"State-dependent rhythmogenesis and frequency control in a half-center locomotor CPG","a":"Ausborn","s":"Snyder; Shevtsova; Rybak; Rubin","y":2018,"d":"10.1152/jn.00550.2017","an":[],"fb":[],"md":[],"mr":[],"rv":[],"pdf":0,"n":0,"nt":"","src":"rest383","c":80,"cl":1},{"id":"recQKYXn4Tb62Xi80","t":"Initiation of locomotion in lampreys.","a":"Dubuc","s":"Brocard; Antri; Fénelon; Gariépy; Smetana; Ménard; Le Ray; Di Prisco; Pearlstein; Sirota; Derjean; St-Pierre; Zielinski; Auclair; Veilleux","y":2008,"d":"10.1016/j.brainresrev.2007.07.016","an":["Lamprey"],"fb":[],"md":[],"mr":[],"rv":["Dubuc 2008"],"pdf":0,"n":1,"nt":"Review of how locomotion is initiated in lampreys: escape swimming is triggered by a simple cutaneous pathway through reticulospinal command cells whose intrinsic membrane properties convert brief sensory input into long-lasting excitation, while goal-directed locomotion is channeled through the mesencephalic locomotor region, which drives reticulospinal cells bilaterally in graded fashion via glutamatergic and cholinergic transmission.","src":"rest383","c":197,"cl":1},{"id":"recQTXZrLF3QI8qUo","t":"A walking robot called human: lessons to be learned from neural control of locomotion.","a":"Duysens","s":"van de Crommert; Smits-Engelsman; van der Helm","y":2002,"d":"10.1016/s0021-9290(01)00187-7","an":[],"fb":[],"md":[],"mr":[],"rv":[],"pdf":0,"n":0,"nt":"","src":"rest383","c":40,"cl":2},{"id":"recQVHpLsp1C9n2mW","t":"On the Influence of Group III/IV Muscle Afferent Feedback on Endurance Exercise Performance","a":"Amann","s":"","y":2020,"d":"10.1249/JES.0000000000000233","an":["Human"],"fb":["group III/IV fatigue"],"md":[],"mr":[],"rv":[],"pdf":1,"n":1,"nt":"Consequences of group III/IV muscle afferent feedback for the development of neuromuscular fatigue and whole body exercise performance. Muscle contraction-induced increases in group III/IV afferent feedback raise circulation and pulmonary ventilation during exercise and thereby assure adequate oxygen delivery to the working locomotor muscle. This attenuates the development of peripheral fatigue and facilitates exercise performance. On the other hand, group III/IV muscle afferent feedback restricts spinal motoneuron output and voluntary muscle activation, i.e. promotes central fatigue and impairs exercise performance. \n\nWith the onset of exercise, contraction-induced mechanical and metabolic stimuli begin to activate molecular receptors located on the terminal end of both thinly myelinated (group III, mainly mechanosensitive) and unmyelinated (group IV, mainly metabosensitive) nerve fibers with their receptive fields within skeletal muscle. \n\nAfferents for groups III/IV can be separated into two categories: One subtype, the so-called metabo- or ergoreceptors, is predominantly activated by the concentrations of intramuscular metabolites (lactate, ATP, protons) existing during ‘normal’ (i.e. freely perfused, aerobic, innocuous) exercise up to strenuous intensities. In contrast, the other subtype, the so-called metabo-nociceptors, only respond to higher (and concurrently noxious) levels of metabolites present in muscle during ischaemic contractions or following hypertonic saline ","src":"originals99","c":77,"cl":-1},{"id":"recQd6HSYCeWFpUbu","t":"The spinal control of locomotion and step-to-step variability in left-right symmetry from slow to moderate speeds","a":"Dambreville","s":"Labarre; Thibaudier; Hurteau; Frigon","y":2015,"d":"10.1152/jn.00419.2015","an":["Cat"],"fb":[],"md":[],"mr":[],"rv":[],"pdf":1,"n":1,"nt":"During\nexperiments, EMG and bilateral video recordings were made during\ntreadmill locomotion from 0.1 to 0.4 m/s in 0.05 m/s increments.\nCycle and stance durations significantly decreased with increasing\nspeed, whereas swing duration remained unaffected. Extensor burst\nduration significantly decreased with increasing speed, whereas sartorius burst duration remained unchanged. Stride length, step length,\nand the relative distance of the paw at stance offset significantly\nincreased with increasing speed, whereas the relative distance at\nstance onset and both the temporal and spatial phasing between\nhindlimbs were unaffected. Both temporal and spatial step-to-step\nleft-right asymmetry decreased with increasing speed. Therefore, the\nspinal cord is capable of adjusting both temporal and spatial parameters during treadmill locomotion, and it is responsible, at least in part,\nfor the step-to-step variability in left-right symmetry observed at slow\nspeeds.","src":"originals99","c":53,"cl":3},{"id":"recQkgW6mi6AezV1b","t":"On the Organization of the Locomotor CPG: Insights From Split-Belt Locomotion and Mathematical Modeling","a":"Latash","s":"Lecomte; Danner; Frigon; Rybak; Molkov","y":2020,"d":"10.3389/fnins.2020.598888","an":["Cat"],"fb":[],"md":["Latash 2020"],"mr":["Latash 2020"],"rv":[],"pdf":1,"n":0,"nt":"","src":"originals99","c":26,"cl":3},{"id":"recQkmqddP5htUGpf","t":"Insect Walking and Biorobotics: A Relationship with Mutual Benefits","a":"Ritzmann","s":"Quinn; Watson; Zill","y":2000,"d":"10.1641/0006-3568(2000)050[0023:IWABAR]2.3.CO;2","an":["Insects"],"fb":[],"md":[],"mr":[],"rv":[],"pdf":1,"n":1,"nt":"Biorobotics represents a synergistic relationship between engineers attempting to design better robots and biologists attempting to understand principles of movement in animals.","src":"originals99","c":81,"cl":0},{"id":"recQrYCoH7uVZ4zvP","t":"Capturability-based analysis and control of legged locomotion, Part 2: Application to M2V2, a lower-body humanoid","a":"Pratt","s":"","y":2012,"d":"10.1177/0278364912452762","an":[],"fb":[],"md":[],"mr":[],"rv":[],"pdf":0,"n":0,"nt":"","src":"task5import","c":265,"cl":4},{"id":"recQs7rSLrhf6qg1K","t":"Multisensory control of human upright stance","a":"Maurer","s":"","y":2006,"d":"10.1007/s00221-005-0256-y","an":["Human"],"fb":[],"md":["Maurer 2006"],"mr":[],"rv":[],"pdf":0,"n":1,"nt":"Computational model study. We found gain and phase of the responses to vary as a function of stimulus frequency and in relation to the absence versus presence of vestibular and proprioceptive cues.","src":"task5import","c":406,"cl":4},{"id":"recQt1Ib00hBvnEem","t":"The Brain in Its Body: Motor Control and Sensing in a Biomechanical Context","a":"Chiel","s":"Ting; Ekeberg; Hartmann","y":2009,"d":"10.1523/jneurosci.3338-09.2009","an":[],"fb":[],"md":[],"mr":[],"rv":[],"pdf":0,"n":0,"nt":"","src":"rest383","c":146,"cl":0},{"id":"recQwvJAHTH2EEnnZ","t":"Highly mobile robots that run and jump","a":"Horchler","s":"Quinn; Lambrecht; Morrey","y":2004,"d":"","an":[],"fb":[],"md":[],"mr":[],"rv":[],"pdf":0,"n":1,"nt":"Mini-WHEGS robots abstract cockroach locomotion principles into 9-cm four-wheel-leg vehicles using an alternating diagonal gait that run over 10 body lengths per second, climb obstacles taller than their leg length, and add a jumping mechanism for larger obstacles — an example of insect-derived mechanical intelligence transferable to bipedal foot placement hardware.","src":"task5import","c":0,"cl":-1},{"id":"recQyzVSZr7RtOUvr","t":"Fish swimming: patterns in muscle function","a":"Altringham","s":"","y":1999,"d":"10.1242/jeb.202.23.3397","an":[],"fb":[],"md":["Altringham 1999"],"mr":[],"rv":["Altringham 1999"],"pdf":0,"n":1,"nt":"Review of fish swimming: patterns muscle function. Computational model study. However, several features are common to most species, and future work may reveal patterns that will lead to a more integrated view of ﬁsh swimming.","src":"task5import","c":261,"cl":8},{"id":"recRAV1TB6KDUwAPV","t":"Left-right locomotor coordination in human neonates","a":"Dewolf","s":"Scaleia; Fabiano; Sylos-Labini; Mondi; Picone; Paolo; Paolillo; Ivanenko; Lacquaniti","y":2022,"d":"10.1523/jneurosci.0612-22.2022","an":[],"fb":[],"md":[],"mr":[],"rv":[],"pdf":0,"n":0,"nt":"","src":"rest383","c":10,"cl":1},{"id":"recRBc4Qpxc04yzxW","t":"Hip and ankle responses for reactive balance emerge from varying priorities to reduce effort and kinematic excursion: A simulation study","a":"Versteeg","s":"","y":2016,"d":"10.1016/j.jbiomech.2016.08.007","an":["Human"],"fb":[],"md":["Versteeg 2016"],"mr":[],"rv":[],"pdf":0,"n":1,"nt":"Computational model study. Similar to prior studies using torque- driven models, we investigated how movement patterns during a reactive balance response are affected by high-level task goals (e.g., reducing center-of-mass movement, maintaining vertical trunk orientation, and minimizing effort).","src":"task5import","c":33,"cl":4},{"id":"recRIvcDW0p0T6DDa","t":"Brainstem Circuits for Locomotion","a":"Leiras","s":"Cregg; Kiehn","y":2022,"d":"10.1146/annurev-neuro-082321-025137","an":[],"fb":[],"md":[],"mr":[],"rv":[],"pdf":1,"n":1,"nt":"Locomotion is a universal motor behavior that is expressed as the output of many integrated brain functions. Locomotion is organized at several levels of the nervous system, with brainstem circuits acting as the gate between brain areas regulating innate, emotional, or motivational locomotion and executive spinal circuits. Here we review recent advances on brainstem circuits involved in controlling locomotion. We describe how delineated command circuits govern the start, speed, stop, and steering of locomotion. We also discuss how these pathways interface between executive circuits in the spinal cord and diverse brain areas important for context-specific selection of locomotion. A recurrent theme is the need to establish a functional connectome to and from brainstem command circuits. Finally, we point to unresolved issues concerning the integrated function of locomotor control.","src":"originals99","c":140,"cl":1},{"id":"recRRXllFjR4hJBVE","t":"Spinal control of muscle synergies for adult mammalian locomotion","a":"Desrochers","s":"Harnie; Doelman; Hurteau; Frigon","y":2019,"d":"10.1113/JP277018","an":["Cat"],"fb":[],"md":[],"mr":["Kargo 2010"],"rv":[],"pdf":1,"n":1,"nt":"Key points\nThe control of locomotion is thought to be generated by activating groups of muscles that perform similar actions, which are termed muscle synergies.\nHere, we investigated if muscle synergies are controlled at the level of the spinal cord.\nWe did this by comparing muscle activity in the legs of cats during stepping on a treadmill before and after a complete spinal transection that abolishes commands from the brain.\nWe show that muscle synergies were maintained following spinal transection, validating the concept that muscle synergies for locomotion are primarily controlled by circuits of neurons within the spinal cord.","src":"originals99","c":60,"cl":3},{"id":"recRT3oLAqSocsheD","t":"A distributed neural network architecture for hexapod robot locomotion","a":"Beer","s":"Chiel; Quinn; Espenschied; Larsson","y":1992,"d":"10.1162/neco.1992.4.3.356","an":[],"fb":[],"md":["Beer 1992"],"mr":[],"rv":[],"pdf":0,"n":1,"nt":"The classic distributed neural-network controller for hexapod locomotion, designed directly from insect neuroethology: varying a single command neuron's activity smoothly modulates the robot across a continuous range of statically stable insect-like gaits, with robustness to lesions that carried over from simulation to the real six-legged robot.","src":"rest383","c":121,"cl":0},{"id":"recRXPfKgEjgdGKe2","t":"Aging causes a reorganization of cortical and spinal control of posture","a":"Papegaaij","s":"","y":2014,"d":"10.3389/fnagi.2014.00028","an":["Human"],"fb":[],"md":[],"mr":[],"rv":["Papegaaij 2014"],"pdf":1,"n":1,"nt":

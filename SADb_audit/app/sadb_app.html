":"The pyloric central pattern generator in Crustacea: a set of conditional neuronal oscillators","a":"Bal","s":"","y":1988,"d":"10.1007/bf00604049","an":[],"fb":[],"md":[],"mr":[],"rv":[],"pdf":0,"n":1,"nt":"This was shown by isolating in situ pyloric neurons from all other elements in the pyloric network.","src":"task5import","c":127,"cl":5},{"id":"recRmBChe7Lolwn0F","t":"A spinal circuit for skilled locomotion","a":"Toscano","s":"Evtushenko; Giomi; Santuz","y":2025,"d":"10.1016/j.cub.2025.09.030","an":[],"fb":[],"md":[],"mr":[],"rv":[],"pdf":0,"n":0,"nt":"","src":"digest20","c":1,"cl":1},{"id":"recRqtgGMEHCYFJ4t","t":"Effects of spinal transection and locomotor speed on muscle synergies of the cat hindlimb","a":"Klishko","s":"","y":2025,"d":"10.1113/JP288089","an":["Cat"],"fb":[],"md":[],"mr":[],"rv":[],"pdf":1,"n":1,"nt":"Fifteen hindlimb muscle EMGs in cats across 0.4–1.0 m/s before and after low-thoracic transection factor into five synergies in every condition; synergy number, composition, and activation patterns survive transection and speed changes, supporting spinal-level synergy control and grounding a pattern-formation network organization for the two-level CPG.","src":"task5import","c":8,"cl":3},{"id":"recRsTA1RaPWpafjV","t":"Gating and reversal of reflexes in ankle muscles during human walking","a":"Duysens","s":"Trippel; Horstmann; Dietz","y":1990,"d":"10.1007/bf00231254","an":[],"fb":[],"md":[],"mr":[],"rv":[],"pdf":0,"n":0,"nt":"","src":"rest383","c":312,"cl":2},{"id":"recRtx7hS4xPDLv4P","t":"Bipedal Robots: A Systematic Review of Dynamical Models, Balance Control Strategies, and Locomotion Methods","a":"Al-Tameemi and Amanuel","s":"","y":2025,"d":"","an":[],"fb":[],"md":[],"mr":[],"rv":["Al-Tameemi 2025"],"pdf":1,"n":1,"nt":"Systematic review of bipedal robotics: dynamical models from LIPM through centroidal to whole-body dynamics; balance strategies from ankle/hip to whole-body control; and locomotion methods split between model-based (ZMP, Capture Point, DCM) and learning-based (RL, human motion data), with sensor fusion, energy-aware RL rewards, and hierarchical architectures proposed as the road ahead.","src":"task5import","c":0,"cl":-1},{"id":"recRx4HKvsONLqcG4","t":"Inter-leg coordination in the control of walking speed in Drosophila","a":"Wosnitza","s":"","y":2013,"d":"10.1242/jeb.078139","an":["Cat","Insects"],"fb":[],"md":[],"mr":[],"rv":[],"pdf":0,"n":1,"nt":"The transition from one gait to another is discontinuous and it can be shown that quadrupeds select the energetically optimal gait at a given speed (Hoyt and Taylor, 1981).","src":"task5import","c":180,"cl":0},{"id":"recRx7GzrmC60kkDl","t":"Initiation of locomotion in mammals.","a":"Jordan","s":"","y":1998,"d":"10.1111/j.1749-6632.1998.tb09040.x","an":[],"fb":[],"md":[],"mr":[],"rv":[],"pdf":0,"n":0,"nt":"","src":"rest383","c":291,"cl":5},{"id":"recSEg1aVNs16JtjP","t":"Distribution of networks generating and coordinating locomotor activity in the neonatal rat spinal cord in vitro: a lesion study","a":"Kjærulff","s":"Kiehn","y":1996,"d":"10.1523/jneurosci.16-18-05777.1996","an":["Rat","Mammals"],"fb":[],"md":[],"mr":[],"rv":[],"pdf":0,"n":1,"nt":"Lesion study in the neonatal rat spinal cord in vitro: the rhythm-generating network is distributed over the entire lumbar enlargement and extends into caudal thoracic segments (the ventral third alone suffices; sagittal lateral fragments do not), and the left–right alternation pathways run primarily in the ventral commissure.","src":"rest383","c":516,"cl":1},{"id":"recSGKVp8xyKgUa3H","t":"Six-legged walking in insects: how CPGs, peripheral feedback, and descending signals generate coordinated and adaptive motor rhythms","a":"Bidaye","s":"Bockemühl; Büschges","y":2018,"d":"10.1152/jn.00658.2017","an":[],"fb":[],"md":[],"mr":[],"rv":[],"pdf":0,"n":0,"nt":"","src":"rest383","c":175,"cl":0},{"id":"recSRi5Pinh7wq0vV","t":"Proprioceptive Control of Extensor Activity during Fictive Scratching and Weight Support Compared to Fictive Locomotion","a":"Perreault","s":"Enríquez-Denton; Hultborn","y":1999,"d":"10.1523/jneurosci.19-24-10966.1999","an":[],"fb":[],"md":[],"mr":[],"rv":[],"pdf":1,"n":0,"nt":"","src":"rest383","c":34,"cl":2},{"id":"recSdhE0hA5bdq22R","t":"Depression of group Ia monosynaptic EPSPs in cat hindlimb motoneurones during fictive locomotion.","a":"Gosgnach","s":"Quevedo; Fedirchuk; McCrea","y":2000,"d":"10.1111/j.1469-7793.2000.00639.x","an":["Cat"],"fb":["Ia presynaptic inhibition"],"md":[],"mr":[],"rv":[],"pdf":1,"n":1,"nt":"During brainstem-evoked fictive locomotion in decerebrate cats, monosynaptic group Ia EPSPs are tonically depressed to about two-thirds of control in most motoneurones, with group I field potentials similarly reduced and only weak correlation with decreased motoneurone input resistance — evidence that presynaptic inhibition of Ia transmission underlies the tonic depression of stretch reflexes during locomotion.","src":"rest383","c":83,"cl":2},{"id":"recSh9tW4eoP1c5tq","t":"Depression of muscle and cutaneous afferent-evoked monosynaptic field potentials during fictive locomotion in the cat.","a":"Perreault","s":"Shefchyk; Jiménez; McCrea","y":1999,"d":"10.1111/j.1469-7793.1999.00691.x","an":[],"fb":[],"md":[],"mr":[],"rv":[],"pdf":0,"n":0,"nt":"","src":"rest383","c":56,"cl":2},{"id":"recSpMH8YzrBr84sG","t":"Towards Autonomous MAV Soaring in Cities: CFD Simulation, EFD Measurement and Flight Trials","a":"Watkins","s":"","y":2015,"d":"10.1260/1756-8293.7.4.441","an":[],"fb":[],"md":["Watkins 2015"],"mr":[],"rv":[],"pdf":0,"n":1,"nt":"Computational model study. Good agreement was found with the wind-tunnel results.","src":"task5import","c":34,"cl":11},{"id":"recStTn5dbc2B80S0","t":"Pontine reticulospinal projections in the neonatal mouse: Internal organization and axon trajectories.","a":"Sivertsen","s":"Perreault; Glover","y":2016,"d":"10.1002/cne.23904","an":["Mice"],"fb":[],"md":[],"mr":[],"rv":[],"pdf":0,"n":1,"nt":"Retrograde tracing in the neonatal mouse shows the pontine reticulospinal projection consists of segregated ipsi- and contralaterally projecting populations (3:1 ipsilateral) that are predominantly excitatory (GAD-negative) with distinct brainstem and spinal axon trajectories; the larger size and greater number of the uncrossed population accounts for its more reliable transmission to spinal motoneurons. This is the anatomical substrate for the powerful descending reticulospinal drive assumed in spinal locomotor models.","src":"rest383","c":16,"cl":1},{"id":"recSwiN9EQNBLX0wH","t":"The flexion synergy, mother of all synergies and father of new models of gait","a":"Duysens","s":"De Groote; Jonkers","y":2013,"d":"10.3389/fncom.2013.00014","an":["Human"],"fb":["Ib stance to swing"],"md":[],"mr":[],"rv":[],"pdf":1,"n":1,"nt":"The flexion synergy of Sherrington's flexor reflex, the withdrawal-reflex modules of Schouenborg, and the neonatal locomotor modules of Dominici largely overlap, and the end-of-stance facilitation of the flexion synergy — broadly afferent-facilitated but load-suppressed — points to a flexor burst generator as the core of an asymmetric CPG model whose afferent gating has already been implemented in walking bipedal robots.","src":"rest383","c":89,"cl":1},{"id":"recSz0XyHOg0CLnJt","t":"Tetraspine: Robust terrain handling on a tensegrity robot using central pattern generators","a":"Tietz","s":"","y":2013,"d":"10.1109/aim.2013.6584102","an":["Cockroach"],"fb":[],"md":["Tietz 2013"],"mr":[],"rv":[],"pdf":0,"n":1,"nt":"Computational model study. —In order to produce a new mode of robust robotic locomotion and better understand how vertebrates coordinate motion with a compliant spine, we are developing a modular tensegrity robot inspired by the spine.","src":"task5import","c":72,"cl":0},{"id":"recT5hSCm9ZQnfcqU","t":"A Generalized Linear Integrate-and-Fire Neural Model Produces Diverse Spiking Behaviors","a":"Mihalaş","s":"","y":2009,"d":"10.1162/neco.2008.12-07-680","an" nding, lateral force, and lateral limb shifting — compared across walking speeds: bending wins at low speed, lateral force at medium, lateral shifting at high, with forelimbs consistently leading steering and hindlimbs adjusting propulsion and stability per strategy.","src":"task5import","c":0,"cl":1},{"id":"recUDhhSVfIJ5cJg9","t":"Contribution of sensory feedback to ongoing ankle extensor activity during the stance phase of walking","a":"Donelan and Pearson","s":"","y":2004,"d":"10.1139/y04-043","an":[],"fb":[],"md":[],"mr":[],"rv":[],"pdf":0,"n":0,"nt":"","src":"rest383","c":92,"cl":2},{"id":"recUFsO1LHr9BtikS","t":"An analysis of the sources of musculoskeletal system impedance","a":"Winters","s":"","y":1988,"d":"10.1016/0021-9290(88)90248-5","an":[],"fb":[],"md":["Winters 1988"],"mr":[],"rv":[],"pdf":0,"n":1,"nt":"Computational model study. It is shown that impedance modulation occurs automatically as a function of the specific operating ranges utilized during a given task by each of four different muscle-joint mechanical relations.","src":"task5import","c":88,"cl":4},{"id":"recUQzJIupLCDV5g1","t":"Five basic muscle activation patterns account for muscle activity during human locomotion","a":"Ivanenko","s":"Poppele; Lacquaniti","y":2004,"d":"10.1113/jphysiol.2003.057174","an":["Human"],"fb":[],"md":[],"mr":[],"rv":[],"pdf":1,"n":1,"nt":"We recorded from12–16 ipsilateral leg and trunk muscles\nusing both surface and intramuscular recording and determined the average, normalized EMG\nof each record for 10–15 consecutive step cycles. We identified five basic underlying factors or\ncomponent waveforms that can account for about 90% of the total waveform variance across\ndifferent muscles during normal gait. Furthermore, while activation patterns of individual\nmuscles could vary dramatically with speed and gravitational load, both the limb kinematics\nand the basic EMG components displayed only limited changes. Thus, we found a systematic\nphase shift of all five factors with speed in the same direction as the shift in the onset of the swing\nphase. This tendency for the factors to be timed according to the lift-off event supports the idea\nthat the origin of the gait cycle generation is the propulsion rather than heel strike event. The\nbasic invariance of the factors with walking speed and with body weight unloading implies\nthat a few oscillating circuits drive the active muscles to produce the locomotion kinematics.\nA flexible and dynamic distribution of these basic components to the muscles may result\nfrom various descending and proprioceptive signals that depend on the kinematic and kinetic\ndemands of the movements","src":"originals99","c":1102,"cl":4},{"id":"recUT6zMfwDnmCJSX","t":"A Soft-Body Controller with Ubiquitous Sensor Feedback","a":"Boxerbaum","s":"Daltorio; Chiel; Quinn","y":2012,"d":"10.1007/978-3-642-31525-1_4","an":[],"fb":[],"md":[],"mr":[],"rv":[],"pdf":0,"n":0,"nt":"","src":"rest383","c":5,"cl":0},{"id":"recUWzWrumdQrLybs","t":"Proprioceptive Feedback and Preferred Patterns of Human Movement","a":"Dean","s":"","y":2013,"d":"10.1097/jes.0b013e3182724bb0","an":[],"fb":[],"md":[],"mr":[],"rv":[],"pdf":0,"n":0,"nt":"","src":"task5import","c":38,"cl":2},{"id":"recUXRSFaXun2RKPU","t":"Electrophysiology of a Dendritic Neuron Model","a":"Rall","s":"","y":1962,"d":"10.1016/s0006-3495(62)86953-7","an":[],"fb":[],"md":[],"mr":[],"rv":[],"pdf":0,"n":0,"nt":"","src":"task5import","c":505,"cl":5},{"id":"recUksKtoVK6MIcpG","t":"MAV stability augmentation using weighted outputs from distributed hair sensor arrays","a":"Keshavan","s":"","y":2010,"d":"10.1109/acc.2010.5531002","an":["Insects","Human"],"fb":[],"md":["Keshavan 2010"],"mr":[],"rv":[],"pdf":0,"n":1,"nt":"Computational model study. Trichoid hair sensillae, found extensively on the surface of the head, wings and the thorax of most insects, are used to sense the nature of air ﬂow past the body.","src":"task5import","c":13,"cl":7},{"id":"recUzbZHjD8A3on2Q","t":"Bifurcations in Morris–Lecar neuron model","a":"Tsumoto","s":"","y":2006,"d":"10.1016/j.neucom.2005.03.006","an":[],"fb":[],"md":[],"mr":[],"rv":[],"pdf":0,"n":0,"nt":"","src":"task5import","c":250,"cl":5},{"id":"recV1vWLQwAPpvTX9","t":"Population Dynamics of Spiking Neurons: Fast Transients, Asynchronous States, and Locking","a":"Gerstner","s":"","y":2000,"d":"10.1162/089976600300015899","an":[],"fb":[],"md":[],"mr":[],"rv":[],"pdf":0,"n":1,"nt":"It is analytically sho wn that transien ts from a state of incoheren t / ring can b e immediate/.","src":"task5import","c":439,"cl":0},{"id":"recV2OcjvB0mkuvBy","t":"Identification of the human postural control system through stochastic trajectory optimization","a":"Wang","s":"","y":2020,"d":"10.1016/j.jneumeth.2020.108580","an":["Human"],"fb":[],"md":["Wang 2020"],"mr":[],"rv":[],"pdf":0,"n":1,"nt":"Computational model study. However, unstable controllers were sometimes found, which obviously do not explain human balance and can- not be applied in control of humanoid robots.","src":"task5import","c":7,"cl":4},{"id":"recV3YQtMTF5hreIm","t":"Emulating Balance Control Observed in Human Test Subjects with a Neural Network","a":"Hilts","s":"Szczecinski; Quinn; Hunt","y":2000,"d":"10.1007/978-3-319-95972-6_21","an":[],"fb":[],"md":[],"mr":[],"rv":[],"pdf":1,"n":0,"nt":"","src":"rest383","c":2,"cl":0},{"id":"recV3anD1eqvb5qrV","t":"Central pattern generators in the brainstem and spinal cord: an overview of basic principles, similarities and differences.","a":"Steuer and Guertin","s":"","y":2019,"d":"10.1515/revneuro-2017-0102","an":[],"fb":[],"md":[],"mr":[],"rv":[],"pdf":0,"n":0,"nt":"","src":"rest383","c":120,"cl":1},{"id":"recV4rRSMl2nvVVaR","t":"A robotic device for understanding neuromechanical interactions during standing balance control.","a":"Scrivens","s":"","y":2008,"d":"10.1088/1748-3182/3/2/026002","an":["Cat","Human"],"fb":[],"md":["Scrivens 2008"],"mr":[],"rv":[],"pdf":0,"n":1,"nt":"Computational model study. Here we demonstrate that independent variations in either stance width or delayed neural feedback gains can have profound and often surprisingly detrimental effects on the postural stability of the system.","src":"task5import","c":19,"cl":4},{"id":"recV6UpcysNrMaRLB","t":"Human lumbar cord circuitries can be activated by extrinsic tonic input to generate locomotor-like activity","a":"Minassian","s":"Persy; Rattay; Pinter; Kern; Dimitrijevic","y":2007,"d":"10.1016/j.humov.2007.01.005","an":["Human"],"fb":["large diameter spinal afferent stimulation"],"md":[],"mr":[],"rv":[],"pdf":1,"n":1,"nt":"Cited by Geyer and Herr, 2010.\nWe have demonstrated that non-patterned electrical stimulation of the lumbar cord can induce stepping-like activity in the lower limbs of complete spinal cord injured individuals. This result suggested the existence of a human lumbar locomotor pattern generator, which can convert a tonic input to a rhythmic motor output. We have studied the human lumbar cord in isolation from supraspinal input but under extrinsic tonic input delivered by spinal cord stimulation. Large-diameter afferents within the posterior roots are directly depolarized by the electrical stimulation. These afferents project to motoneurons as well as to lumbar interneurons involved in the motor control of lower limbs. Stimulation at 25–50Hz can elicit rhythmic alternating flexion/extension movements of the lower limbs in supine individuals. Reducing the tonic input frequency to 5–15Hz initiates lower limb extension. Epidural stimulation applied during manually assisted treadmill stepping in complete spinal cord injured persons immediately increases the central state of excitability of lumbar cord networks and enhances stepping-like functional motor outputs. Sustained, non-patterned tonic input via the posterior roots can activate human lumbar cord networks. Pattern generating configurations of these multifunctional circuitries can be set-up depending on the stimulation parameters and particularly on the input frequency.","src":"originals99","c":207,"cl":6},{"id":"recV7qGPJWiTDrPsM","t":"Modelling spinal circuitry involved in locomotor pattern generation: insights from the effects of afferent stimulation","a":"Rybak","s":"Stecina; Shevtsova; McCrea","y":2006,"d":"10.1113/jphysiol.2006.118711","an":["Cat"],"fb":["Ia reciprocal inhibition"],"md":["Rybak CPG 2006"],"mr":[],"rv":[],"pdf":1,"n":1,"nt":"Computational model of 2 level CPG","src":"originals99","c":229,"cl":2},{"id":"recV8nQBbNyZDolul","t":"Computational modeling of spinal circuits controlling limb coordination and gaits in quadrupeds","a":"Danner","s":"Shevtsova; Frigon; Rybak","y":2017,"d":"10.7554/eLife.31050","an":["Mice"],"fb":[],"md":["Danner 2017"],"mr":[],"rv":[],"pdf":1,"n":1,"nt":"Interactions between cervical and lumbar spinal circuits are mediated by long propriospinal neurons (LPNs). Ablation of descending LPNs in mice disturbs left-right coordination at high speeds without affecting fore-hind alternation. We developed a computational model of spinal circuits consisting of four rhythm generators coupled by commissural interneurons (CINs), providing left-right interactions, and LPNs, mediating homolateral and diagonal interactions. The proposed CIN and diagonal LPN connections contribute to speed-dependent gait transition from walk, to trot, and then to gallop and bound; the homolateral LPN connections ensure fore-hind alternation in all gaits. The model reproduces speed-dependent gait expression in intact and genetically transformed mice and the disruption of hindlimb coordination following ablation of descending LPNs. Inputs to CINs and LPNs can affect interlimb coordination and change gait independent of speed. We suggest that these interneurons represent the main targets for supraspinal and sensory afferent signals adjusting gait.","src":"originals99","c":147,"cl":1},{"id":"recV95cZ8x0IFkHAB","t":"Synchronization of coupled neural oscillators with heterogeneous delays","a":"Panchuk","s":"","y":2013,"d":"10.1142/s0218127413300395","an":[],"fb":[],"md":[],"mr":[],"rv":[],"pdf":1,"n":0,"nt":"","src":"task5import","c":36,"cl":-1},{"id":"recVBO9N6W9EQlOhn","t":"On the possibility (or lack thereof) of agreement between experiment and computation of flows over wings at moderate Reynolds number","a":"J.","s":"","y":2017,"d":"10.1098/rsfs.2016.0076","an":["Human"],"fb":[],"md":[],"mr":[],"rv":[],"pdf":0,"n":1,"nt":"Here we exam- ine one ostensibly simple case of the NACA 0012 aerofoil and make careful comparison between the technical literature, and new experiments and com- putations.","src":"task5import","c":69,"cl":-1},{"id":"recVNVLeWUkALdZvb","t":"Parametric resonance for vibration energy harvesting with design techniques to passively reduce the initiation threshold amplitude","a":"Jia","s":"","y":2014,"d":"10.1088/0964-1726/23/6/065011","an":[],"fb":[],"md":[],"mr":[],"rv":[],"pdf":0,"n":1,"nt":"Experimental results of the parametric resonant harvesters with these additional enabling designs demonstrated up to an order of magnitude lower initiation threshold than otherwise, while attaining a much higher power peak than direct resonance.","src":"task5import","c":60,"cl":-1},{"id":"recVOknfb17E9AxjJ","t":"Neural Adaptive Nonlinear MIMO Control for Bipedal Walking Robot Locomotion in Hazardous and Complex Task Applications","a":"Bekhiti","s":"","y":2025,"d":"10.3390/robotics14060084","an":[],"fb":[],"md":["Bekhiti 2025"],"mr":[],"rv":[],"pdf":1,"n":1,"nt":"Neural adaptive MIMO control (nonlinear dynamic inversion plus RBF networks with finite-time convergence) on a 5-DOF underactuated Rabbit biped holds stable limit cycles through +100% trunk-mass, ±30% limb-inertia, and torque-saturation perturbations, outperforming four benchmark controllers on real dSPACE hardware.","src":"task5import","c":9,"cl":4},{"id":"recVR50O3JUPELXyW","t":"Bio-inspired knee joint mechanism for a hydraulic quadruped robot","a":"Khan","s":"","y":2015,"d":"10.1109/icara.2015.7081168","an":["Human"],"fb":[],"md":[],"mr":[],"rv":[],"pdf":0,"n":1,"nt":"In this paper, we focus on the knee joint and propose the adaptation and optimization of the so-called isogram mechanism.","src":"task5import","c":26,"cl":14},{"id":"recVWdOYkr9BABcFS","t":"Powered artificial knee with agonist-antagonist actuation","a":"Herr","s":"Martinez-Villalpando; Weber","y":2010,"d":"","an":[],"fb":[],"md":[],"mr":[],"rv":[],"pdf":0,"n":0,"nt":"","src":"task5import","c":0,"cl":-1},{"id":"recVXrmH9NwbZIb2Z","t":"Motor Systems","a":"Donkelaar","s":"","y":2020,"d":"10.1007/978-3-030-41878-6_9","an":[],"fb":[],"md":[],"mr":[],"rv":[],"pdf":0,"n":0,"nt":"","src":"rest383","c":2,"cl":6},{"id":"recVlk7Kg9rIPLH2v","t":"On the central generation of locomotion in the low spinal cat","a":"Grillner and Zangger","s":"","y":1979,"d":"10.1007/BF00235671","an":["Cat"],"fb":["Total afferent inhibition"],"md":[],"mr":[],"rv":[],"pdf":1,"n":1,"nt":"Cited by Geyer and Herr, 2010.\nTotal afferent inhibition.\n\nA central network of neurones in the spinal cord has been shown to produce a rhythmic motor output similar to locomotion after suppression of all afferent inflow. The experiments were performed mainly in acute spinal cats (th. 12), which had received DOPA i.v. and the monoamine oxidase inhibitor Nialamide. In some preparations all dorsal roots supplying the spinal cord were transected, in others phasic afferent activity was suppressed by curarization. The activity was recorded as neurograms from nerve filaments or as electromyograms.\n\nIt is concluded that:\n\n1. alternating activity between flexors and extensors of foot, ankle, knee, and hip of one limb can still occur\n\n2. the duration of the flexor discharges vary less with the cycle duration than the extensor discharges\n\n3. different flexor muscles may retain individual patterns\n\n4. the activity at different joints can be dissociated\n\n5. there is at least one network for each limb\n\n6. the coordination between the two hindlimbs can be alternating as in walking or be more closely spaced as in galloping\n\n7. alternating activity in the ankle remains even when only segments L6, L7 and S1 are intact.","src":"originals99","c":842,"cl":3},{"id":"recVuer0aedxQFf9J","t":"Biomechanics of smart wings in a bat robot: morphing wings using SMA actuators","a":"Colorado","s":"","y":2012,"d":"10.1088/1748-3182/7/3/036006","an":[],"fb":[],"md":["Colorado 2012"],"mr":[],"rv":["Colorado 2012"],"pdf":0,"n":1,"nt":"Review of biomechanics smart wings bat robot:. Computational model study. 7 036006 View the article online for updates and enhancements.","src":"task5import","c":113,"cl":-1},{"id":"recW1H5x8SWtYa1gS","t":"Mechanisms of Left-Right Coordination in Mammalian Locomotor Pattern Generation Circuits: A Mathematical Modeling View","a":"Molkov","s":"Bacak; Talpalar; Rybak","y":2015,"d":"","an":[],"fb":[],"md":[],"mr":[],"rv":[],"pdf":0,"n":0,"nt":"","src":"task5import","c":0,"cl":-1},{"id":"recW2QvwSd3rFpEda","t":"Biorobotic approaches to the study of motor systems","a":"Beer","s":"Chiel; Quinn; Ritzmann","y":1998,"d":"10.1016/s0959-4388(98)80121-9","an":[],"fb":[],"md":[],"mr":[],"rv":[],"pdf":0,"n":0,"nt":"","src":"rest383","c":96,"cl":0},{"id":"recW61jLS87WefMpR","t":"Integration of posture and locomotion in acute decerebrate cats and in awake, freely moving cats","a":"Mori","s":"","y":1987,"d":"10.1016/0301-0082(87)90010-4","an":["Cat"],"fb":[],"md":[],"mr":[],"rv":["Mori 1987"],"pdf":0,"n":1,"nt":"Integration of posture and locomotion in decerebrate cats: postural set and locomotion share circuitry, with tonically controlled parallel descending systems.","src":"demo50","c":438,"cl":6},{"id":"recW9N71oxz3FQxwu","t":"Regulation of Arm and Leg Movement during Human Locomotion","a":"Zehr and Duysens","s":"","y":2004,"d":"10.1177/1073858404264680","an":[],"fb":[],"md":[],"mr":[],"rv":[],"pdf":0,"n":0,"nt":"","src":"rest383","c":410,"cl":2},{"id":"recWBpHg0iCsCHuuf","t":"Central Pattern G iew","a":"Šegvić","s":"","y":2015,"d":"10.1109/mipro.2015.7160432","an":[],"fb":[],"md":[],"mr":[],"rv":["Šegvić 2015"],"pdf":0,"n":1,"nt":"Review of technologies distributed flight control systems: review. Technological developments, such as embedded computing and microelectromechanical systems are enabling advanced aerospace-oriented distributed sy stems.","src":"task5import","c":4,"cl":-1},{"id":"recdziQxCrW4TUaWv","t":"Primacy of Flexor Locomotor Pattern Revealed by Ancestral Reversion of Motor Neuron Identity","a":"Machado et al.","s":"","y":2015,"d":"10.1016/j.cell.2015.06.036","an":["Mice"],"fb":[],"md":[],"mr":[],"rv":[],"pdf":0,"n":1,"nt":"Ancestral reversion of lumbar motor neuron identity reveals the primacy of the flexor locomotor pattern; flexor-dominant circuitry appears to be the conserved building block of limb locomotion.","src":"demo50","c":72,"cl":1},{"id":"rece0GWaNeVWzC8pG","t":"A Muscle-Reflex Model That Encodes Principles of Legged Mechanics Produces Human Walking Dynamics and Muscle Activities","a":"Geyer and Herr","s":"","y":2010,"d":"10.1109/TNSRE.2010.2047592","an":["Human"],"fb":[],"md":[],"mr":["Geyer and Herr 2010","Ekeberg and Grillner","Ivashko 2003"],"rv":[],"pdf":1,"n":1,"nt":"While neuroscientists identify increasingly complex neural circuits that control animal and human gait, biomechanists ﬁnd that locomotion requires little control if principles of legged mechanics are heeded that shape and exploit the dynamics of legged systems. Here, we show that muscle reﬂexes could be vital to link these two observations. We develop a model of human locomotion that is controlled by muscle reﬂexes which encode principles of legged mechanics. Equipped with this reﬂex control, we ﬁnd this model to stabilize into a walking gait from its dynamic interplay with the ground, reproduce human walking dynamics and leg kinematics, tolerate ground disturbances, and adapt to slopes without parameter interventions. In addition, we ﬁnd this model to predict some individual muscle activation patterns known from walking experiments. The results suggest not only that the interplay between mechanics and motor control is essential to human locomotion, but also that human motor output could for some muscles be dominated by neural circuits that encode principles of legged mechanics.","src":"originals99","c":668,"cl":0},{"id":"rece3okHaUWzAhj9Q","t":"Load Detectors and Their Reflexes During Gait in Cat and Man","a":"Duysens","s":"","y":2000,"d":"10.1007/978-94-010-0870-9_20","an":[],"fb":[],"md":[],"mr":[],"rv":[],"pdf":0,"n":0,"nt":"","src":"rest383","c":0,"cl":2},{"id":"rece4glVJOgKigM6f","t":"Design and analysis of biomimetic joints for morphing of micro air vehicles","a":"Grant","s":"","y":2010,"d":"10.1088/1748-3182/5/4/045007","an":["Vertebrates"],"fb":[],"md":[],"mr":[],"rv":["Grant 2010"],"pdf":0,"n":1,"nt":"Review of design analysis biomimetic joints morphing. This paper presents an overview of designs that incorporate morphing to enhance their ﬂight characteristics.","src":"task5import","c":32,"cl":-1},{"id":"receATbUhJ9PJFJZC","t":"Kinematic primitives for walking and trotting gaits of a quadruped robot with compliant legs","a":"Spröwitz","s":"","y":2014,"d":"10.3389/fncom.2014.00027","an":[],"fb":[],"md":[],"mr":[],"rv":[],"pdf":1,"n":1,"nt":"This revealed that kinematic patterns resulting from feed-forward control had a lower complexity (in-air stepping, 2–3 primitives) than kinematic patterns from on-ground locomotion (4 primitives), although both experiments applied identical motor patterns.","src":"task5import","c":38,"cl":0},{"id":"receKznRVOjGovl5x","t":"PSO-based single multiplicative neuron model for time series prediction","a":"Zhao","s":"","y":2009,"d":"10.1016/j.eswa.2008.01.061","an":[],"fb":[],"md":[],"mr":[],"rv":[],"pdf":0,"n":0,"nt":"","src":"task5import","c":174,"cl":10},{"id":"receOhzFcvpaCztBp","t":"2008 Special Issue: Central pattern generators for locomotion control in animals and robots: A review","a":"Ijspeert","s":"","y":2008,"d":"10.1016/j.neunet.2008.03.014","an":["Vertebrates"],"fb":[],"md":[],"mr":[],"rv":["Ijspeert 2008"],"pdf":1,"n":1,"nt":"The canonical review of locomotor CPGs spanning neurobiology and robotics: CPG circuits turn simple low-dimensional inputs into coordinated high-dimensional rhythmic output, CPG models — neural networks or coupled oscillators — are a standard robot-control approach, and robots themselves serve as scientific tools for testing biological hypotheses about CPG function.","src":"rest383","c":1879,"cl":0},{"id":"receRQ4hYm1Keotr6","t":"The role of V3 neurons in speed-dependent interlimb coordination during locomotion in mice.","a":"Zhang","s":"Shevtsova; Deska-Gauthier; Mackay; Dougherty; Danner; Rybak","y":2022,"d":"10.7554/elife.73424","an":["Mice"],"fb":[],"md":["Zhang 2022"],"mr":["Danner 2017"],"rv":[],"pdf":0,"n":1,"nt":"Silencing V3 neurons in mice reduces maximal locomotor speed and abolishes stable trot, gallop, and bound, and an extended left-right rhythm-generator model shows locally projecting V3 neurons mediate left-right synchronization (gallop and bound) while ascending long propriospinal V3 neurons with contralateral cervical projections couple fore and hind generators for trot.","src":"rest383","c":56,"cl":1},{"id":"receSBqoDy6lH0O6z","t":"Crossed activation of thoracic trunk motoneurons by medullary reticulospinal neurons.","a":"LaPallo","s":"Giorgi; Perreault","y":2019,"d":"10.1152/jn.00194.2019","an":[],"fb":[],"md":[],"mr":[],"rv":[],"pdf":1,"n":0,"nt":"","src":"rest383","c":5,"cl":1},{"id":"receWDFQyRMe7UvvZ","t":"Resonance tuning in a neuro-musculo-skeletal model of the forearm","a":"Verdaasdonk","s":"","y":2007,"d":"10.1007/s00422-006-0112-6","an":["Human"],"fb":[],"md":["Verdaasdonk 2007"],"mr":["Verdaasdonk 2007"],"rv":[],"pdf":1,"n":1,"nt":"Cited  by Geyer and Herr, 2010.\nIn rhythmic movements, humans activate their muscles in a robust and energy efficient way. These activation patterns are oscillatory and seem to originate from neural networks in the spinal cord, called central pattern generators (CPGs). Evidence for the existence of CPGs was found for instance in lampreys, cats and rats. There are indications that CPGs exist in humans as well, but this is not proven yet. Energy efficiency is achieved by resonance tuning: the central nervous system is able to tune into the resonance frequency of the limb, which is determined by the local reflex gains. The goal of this study is to investigate if the existence of a CPG in the human spine can explain the resonance tuning behavior, observed in human rhythmic limb movement. A neuro-musculo-skeletal model of the forearm is proposed, in which a CPG is organized in parallel to the local reflexloop. The afferent and efferent connections to the CPG are based on clues about the organization of the CPG, found in literature. The model is kept as simple as possible (i.e., lumped muscle models, groups of neurons are lumped into half-centers, simple reflex model), but incorporates enough of the essential dynamics to explain behavior—such as resonance tuning—in a qualitative way. Resonance tuning is achieved above, at and below the endogenous frequency of the CPG in a highly non-linear neuro- musculo-skeletal model. Afferent feedback of muscle lengthening to the CPG is necessar","src":"originals99","c":37,"cl":6},{"id":"receXHrZLNVgcCYod","t":"Amplitude modulation of the soleus H-reflex in the human during walking and standing","a":"Capaday et al.","s":"","y":1986,"d":"10.1523/jneurosci.06-05-01308.1986","an":["Human"],"fb":["Ia monosynaptic excitation"],"md":[],"mr":[],"rv":[],"pdf":0,"n":1,"nt":"The soleus H-reflex is strongly modulated over the step cycle during walking versus standing; central gating of the monosynaptic Ia pathway is phase- and task-dependent.","src":"demo50","c":978,"cl":2},{"id":"recegKF0v16iALz2P","t":"Functional properties of human muscle spindles","a":"Macefield","s":"","y":2018,"d":"10.1152/jn.00071.2018","an":["Cat","Human"],"fb":[],"md":[],"mr":[],"rv":["Macefield 2018"],"pdf":0,"n":1,"nt":"Review of functional properties human muscle spindles. First published April 18, 2018; doi:10.1152/ jn.00071.2018.—Muscle spindles are ubiquitous encapsulated mechanoreceptors found in most mammalian muscles.","src":"task5import","c":191,"cl":5},{"id":"recekls2eVExj4oy8","t":"Flexor and Extensor Ankle Afferents Broadly Innervate Locomotor Spinal Shox2 Neurons and Induce Similar Effects in Neonatal Mice.","a":"Li","s":"Garcia-Ramirez; Dougherty","y":2019,"d":"10.3389/fncel.2019.00452","an":[],"fb":[],"md":[],"mr":[],"rv":[],"pdf":1,"n":0,"nt":"","src":"rest383","c":15,"cl":2},{"id":"recen5aErDkxJRjGK","t":"Simple model of spiking neurons","a":"Izhikevich","s":"","y":2003,"d":"10.1109/tnn.2003.820440","an":["Human"],"fb":[],"md":["Izhikevich 2003"],"mr":[],"rv":[],"pdf":0,"n":1,"nt":"Computational model study. As we develop such large-scale brain models consisting of spiking neurons, we must find compromises between two seemingly mutually exclusive requirements: The model for a single neuron must be: 1) computationally simple, yet 2) capable of producing rich firing patterns exhibited by real biological neurons.","src":"task5import","c":4933,"cl":5},{"id":"recenxdRrnk3ydqyg","t":"Interlimb coordination is not strictly controlled during walking","a":"Arai","s":"Ota; Funato; Tsuchiya","y":2024,"d":"10.1038/s42003-024-06843-w","an":[],"fb":[],"md":[],"mr":[],"rv":[],"pdf":1,"n":0,"nt":"","src":"digest20","c":9,"cl":1},{"id":"receq11WZowRmJdba","t":"Minimal-calibration multimodal wearable sensing for long-duration three-dimensional shoulder kinematics","a":"Jin","s":"","y":2026,"d":"10.1038/s44460-026-00059-7","an":["Human"],"fb":[],"md":[],"mr":[],"rv":[],"pdf":0,"n":1,"nt":"Here we report a wearable platform for long-duration tracking of three-dimensional shoulder kinematics with minimal calibration.","src":"task5import","c":5,"cl":-1},{"id":"receqsanpBJrR4x5v","t":"New Moves in Motor Control","a":"Büschges","s":"Scholz; El Manira","y":2011,"d":"10.1016/j.cub.2011.05.029","an":[],"fb":[],"md":[],"mr":[],"rv":["Buschges 2011"],"pdf":1,"n":1,"nt":"They review here some of the new insights into motor network function that these advances have provided and indicate how these advances might bridge gaps in our understanding of motor control. To these ends, they first review motor neural network organisation highlighting cross-phylum principles. The authors then use prominent examples from the field to show how neurogenetic approaches can complement classical physiological studies, and identify additional areas where these approaches could be advantageously applied.","src":"originals99","c":128,"cl":0},{"id":"receswW0WAOzeYQcm","t":"A neuro-mechanical model of legged locomotion: single leg control","a":"Ekeberg","s":"","y":1998,"d":"10.1007/s004220050468","an":[],"fb":[],"md":[],"mr":[],"rv":[],"pdf":0,"n":0,"nt":"","src":"task5import","c":63,"cl":0},{"id":"recetENlBYcGrP7zO","t":"Modulation of stretch reflexes during locomotion in the mesencephalic cat","a":"Akazawa","s":"Aldridge; Steeves; Stein","y":1982,"d":"10.1113/jphysiol.1982.sp014319","an":[],"fb":[],"md":[],"mr":[],"rv":[],"pdf":1,"n":0,"nt":"","src":"rest383","c":178,"cl":2},{"id":"receunfNmjwzp7QH4","t":"Variable-mechanical-impedance artificial legs","a":"Herr","s":"","y":2015,"d":"","an":[],"fb":[],"md":[],"mr":[],"rv":[],"pdf":0,"n":0,"nt":"","src":"task5import","c":0,"cl":-1},{"id":"recewflUcft50Rh2J","t":"Human Lumbosacral Spinal Cord Interprets Loading During Stepping","a":"Harkema","s":"Hurley; Patel; Requejo; Dobkin; Edgerton","y":1997,"d":"10.1152/jn.1997.77.2.797","an":[],"fb":[],"md":[],"mr":[],"rv":[],"pdf":1,"n":0,"nt":"","src":"rest383","c":605,"cl":2},{"id":"recf2nnsCOlfEvGxV","t":"An interneuronal relay for group I and II muscle afferents in the midlumbar segments of the cat spinal cord.","a":"Edgley and Jankowska","s":"","y":1987,"d":"10.1113/jphysiol.1987.sp016676","an":[],"fb":[],"md":[],"mr":[],"rv":[],"pdf":0,"n":0,"nt":"","src":"rest383","c":236,"cl":2},{"id":"recf6gvkwsPmIHY3N","t":"AnimatLab: A 3D graphics environment for neuromechanical simulations","a":"Cofer","s":"","y":2010,"d":"10.1016/j.jneumeth.2010.01.005","an":[],"fb":[],"md":[],"mr":[],"rv":[],"pdf":1,"n":1,"nt":"The nervous systems of animals evolved to exert dynamic control of behavior in response to the needs of the animal and changing signals from the environment. To understand the mechanisms of dynamic control requires a means of predicting how individual neural and body elements will interact to produce the performance of the entire system. AnimatLab is a software tool that provides an approach to this problem through computer simulation. AnimatLab enables a computational model of an animal's body to be constructed from simple building blocks, situated in a virtual 3D world subject to the laws of physics, and controlled by the activity of a multicellular, multicompartment neural circuit. Sensor receptors on the body surface and inside the body respond to external and internal signals and then excite central neurons, while motor neurons activate Hill muscle models that span the joints and generate movement. AnimatLab provides a common neuromechanical simulation environment in which to construct and test models of any skeletal animal, vertebrate or invertebrate. The use of AnimatLab is demonstrated in a neuromechanical simulation of human arm flexion and the myotactic and contact-withdrawal reflexes.","src":"originals99","c":104,"cl":0},{"id":"recf7GGvFAHjfl09v","t":"Phase-Resetting Curves Determine Synchronization, Phase Locking, and Clustering in Networks of Neural Oscillators","a":"Achuthan","s":"","y":2009,"d":"10.1523/jneurosci.0426-09.2009","an":[],"fb":[],"md":[],"mr":[],"rv":[],"pdf":0,"n":0,"nt":"","src":"task5import","c":155,"cl":5},{"id":"recfCLJpSnraphHug","t":"Modeling the mammalian locomotor CPG: insights from mistakes and perturbations","a":"McCrea and Rybak","s":"","y":2007,"d":"10.1016/S0079-6123(06)65015-2","an":["Cat"],"fb":[],"md":["McCrea & Rybak 2007"],"mr":[],"rv":[],"pdf":1,"n":1,"nt":"A computational model of the mammalian spinal cord circuitry incorporating a two-level central pattern generator (CPG) with separate half-center rhythm generator (RG) and pattern formation (PF) networks.\nThe model consists of interacting populations of interneurons and motoneurons described in the Hodgkin-Huxley style. Locomotor rhythm generation is based on a combination of intrinsic (persistent sodium current dependent) properties of excitatory RG neurons and reciprocal inhibition between the two half-centers comprising the RG. The two-level architecture of the CPG was suggested from an analysis of deletions (spontaneous omissions of activity) and the effects of afferent stimulation on the locomotor pattern and rhythm observed during fictive locomotion in the cat. The RG controls the activity of the PF network that in turn defines the rhythmic pattern of motoneuron activity. The model produces realistic firing patterns of two antagonist motoneuron populations and generates locomotor oscillations encompassing the range of cycle periods and phase durations observed during cat locomotion. A number of features of the real CPG operation can be reproduced with separate RG and PF networks, which would be difficult if not impossible to demonstrate with a classical single-level CPG. The two-level architecture allows the CPG to maintain the phase of locomotor oscillations and cycle timing during deletions and during sensory stimulation. The model provides a basis for functional ident","src":"originals99","c":128,"cl":1},{"id":"recfIKtOOvoPaRCFc","t":"Chapter 2--the spinal generation of phases and cycle duration.","a":"Gossard","s":"Sirois; Noué; Côté; Ménard; Leblond; Frigon","y":2011,"d":"10.1016/b978-0-444-53825-3.00007-3","an":[],"fb":[],"md":[],"mr":[],"rv":[],"pdf":0,"n":0,"nt":"","src":"rest383","c":41,"cl":3},{"id":"recfOzo8DPOvRNrjE","t":"The Circuitry of the Human Spinal Cord: Spinal and Corticospinal Mechanisms of Movement","a":"Pierrot-Deseilligny and Burke","s":"","y":2012,"d":"","an":[],"fb":[],"md":[],"mr":[],"rv":[],"pdf":0,"n":0,"nt":"","src":"task5import","c":0,"cl":-1},{"id":"recfRnmXD28Ogkq4e","t":"Control of Mammalian Locomotion by Somatosensory Feedback","a":"Frigon","s":"","y":2021,"d":"10.1002/cphy.c210020","an":["Mammals"],"fb":[],"md":[],"mr":[],"rv":[],"pdf":1,"n":1,"nt":"When animals walk overground, mechanical stimuli activate various receptors located in muscles,joints, and skin. Afferents from these mechanoreceptors project to neuronal networks controllinglocomotion in the spinal cord and brain. The dynamic interactions between the control systemsat different levels of the neuraxis ensure that locomotion adjusts to its environment and meetstask demands. In this article, we describe and discuss the essential contribution of somatosen-sory feedback to locomotion. We start with a discussion of how biomechanical properties of thebody affect somatosensory feedback. We follow with the different types of mechanoreceptors andsomatosensory afferents and their activity during locomotion. We then describe central projectionsto locomotor networks and the modulation of somatosensory feedback during locomotion and its mechanisms. We then discuss experimental approaches and animal models used to investigate the control of locomotion by somatosensory feedback before providing an overview of the different functional roles of somatosensory feedback for locomotion. Lastly, we briefly describe the role of somatosensory feedback in the recovery of locomotion after neurological injury. We highlight the fact that somatosensory feedback is an essential component of a highly integrated system for locomotor control. \n\nMajor teaching points\n•  During locomotion, mechanical stimuli within and out-side the body activate various types of mechanoreceptors located in mus","src":"originals99","c":98,"cl":3},{"id":"recfWfvyxP3M5wWWJ","t":"Muscle Spindles and Their Motor Control","a":"Matthews","s":"","y":1964,"d":"10.1152/physrev.1964.44.2.219","an":["Cat"],"fb":[],"md":["Matthews 1964"],"mr":[],"rv":[],"pdf":0,"n":1,"nt":"Computational model study. The existence of two distinct types of afferent nerve ending, however, has been widely suspected since Ruflini described the histologically distinct primary and secondary endings, while very recent histological work strongly suggests the existence of two distinct types of intrafusal muscle fiber with independent motor...","src":"task5import","c":571,"cl":5},{"id":"recfdwgo7yvRq9Lt7","t":"Hip proprioceptive feedback influences the control of mediolateral stability during human walking","a":"Roden-Reynolds","s":"","y":2015,"d":"10.1152/jn.00551.2015","an":[],"fb":[],"md":[],"mr":[],"rv":[],"pdf":0,"n":0,"nt":"","src":"task5import","c":82,"cl":4},{"id":"recfiz9tzgn955QdA","t":"Contribution of Hind Limb Flexor Muscle Afferents to the Timing of Phase Transitions in the Cat Step Cycle","a":"Hiebert","s":"","y":1996,"d":"10.1152/jn.1996.75.3.1126","an":["Cat"],"fb":[],"md":[],"mr":[],"rv":[],"pdf":1,"n":0,"nt":"","src":"originals99","c":276,"cl":2},{"id":"recfjnlS1Vy7XmC5v","t":"Sensory Feedback Control of Locomotor Pattern Generation in Cats and Mice.","a":"Akay","s":"","y":2020,"d":"10.1016/j.neuroscience.2020.05.008","an":[],"fb":[],"md":[],"mr":[],"rv":[],"pdf":0,"n":0,"nt":"","src":"rest383","c":25,"cl":3},{"id":"recfqPkdLRcChf2pV","t":"Ankle Extensor EMG Patterns Quantification of Muscle Load, Length Change, and Mechanics of Slope Walking in the Cat:","a":"Gregor","s":"Smith; Prilutsky","y":2015,"d":"","an":[],"fb":[],"md":[],"mr":[],"rv":[],"pdf":0,"n":0,"nt":"","src":"task5import","c":0,"cl":-1},{"id":"recg4V4p9GonZaJLl","t":"Improving the Prediction Accuracy of Echo State Neural Networks by Anti-Oja’s Learning","a":"Hutchison","s":"","y":2007,"d":"10.1007/978-3-540-74690-4_3","an":[],"fb":[],"md":[],"mr":[],"rv":[],"pdf":0,"n":1,"nt":"This regu- lar adaptation of Echo State neural networks was optimized by updat- ing the weights of the dynamic reservoir with Anti-Oja’s learning.","src":"task5import","c":28,"cl":9},{"id":"recgA09TdqMRYuiyY","t":"Segmental organization of vestibulospinal inputs to spinal interneurons mediating crossed activation of thoracolumbar motoneurons in the neonatal mouse.","a":"Kasumacic","s":"Lambert; Coulon; Bras; Vinay; Perreault; Glover","y":2015,"d":"10.1523/jneurosci.5188-14.2015","an":[],"fb":[],"md":[],"mr":[],"rv":[],"pdf":1,"n":0,"nt":"","src":"rest383","c":48,"cl":1},{"id":"recgA8OcMZa9kUyIK","t":"The possibility of phase-dependent monosynaptic and polysynaptic la excitation to homonymous motoneurones during fictive locomotion","a":"Schomburg and Behrends","s":"","y":1978,"d":"10.1016/0006-8993(78)90363-3","an":[],"fb":[],"md":[],"mr":[],"rv":[],"pdf":0,"n":0,"nt":"","src":"rest383","c":79,"cl":2},{"id":"recgBcEvpJsPJMomt","t":"A model of spindle afferent response to muscle stretch","a":"Hasan","s":"","y":1983,"d":"10.1152/jn.1983.49.4.989","an":[],"fb":[],"md":["Hasan 1983"],"mr":[],"rv":[],"pdf":0,"n":1,"nt":"Computational model study. A unified model of the properties of stretch responses of mammalian spindle end- ings is proposed.","src":"task5import","c":122,"cl":5},{"id":"recgNahYOEnT2yzYE","t":"Proprioceptive modulation of hip flexor activity during the swing phase of locomotion in decerebrate cats.","a":"Lam and Pearson","s":"","y":2001,"d":"10.1152/jn.2001.86.3.1321","an":["Cat"],"fb":["Ia or II swing to stance"],"md":[],"mr":[],"rv":[],"pdf":1,"n":1,"nt":"muscle spindle ends swing","src":"originals99","c":107,"cl":2},{"id":"recgPmjGMrRBLOuA5","t":"A Review of the Integrate-and-fire Neuron Model: I. Homogeneous Synaptic Input","a":"Burkitt","s":"","y":2006,"d":"10.1007/s00422-006-0068-6","an":[],"fb":[],"md":["Burkitt 2006"],"mr":[],"rv":["Burkitt 2006"],"pdf":0,"n":1,"nt":"Review of review integrate-and-fire neuron model: i.. Computational model study. The integrate-and-ﬁre neuron model has become established as a canonical model for the description of spiking neurons be- cause it is capable of being analyzed mathematically while at the same time being sufﬁciently complex to capture many of the essential features of neural processing.","src":"task5import","c":1244,"cl":0},{"id":"recgQ4H7oES3zg5BT","t":"What functions do reflexes serve during human locomotion","a":"Zehr and Stein","s":"","y":1999,"d":"10.1016/s0301-0082(98)00081-1","an":[],"fb":[],"md":[],"mr":[],"rv":[],"pdf":0,"n":0,"nt":"","src":"rest383","c":500,"cl":2},{"id":"recgRFsKPiTtwLYEQ","t":"Multisensory Feedback Can Enhance Embodiment Within an Enriched Virtual Walking Scenario","a":"Leonardis","s":"","y":2014,"d":"10.1162/pres_a_00190","an":[],"fb":[],"md":[],"mr":[],"rv":[],"pdf":0,"n":0,"nt":"","src":"task5import","c":53,"cl":17},{"id":"recgVeruBw8U5XUjE","t":"A Feedback Model Reproduces Muscle Activity During Human Postural Responses to Support-Surface Translations","a":"Welch","s":"","y":2008,"d":"10.1152/jn.01110.2007.","an":["Cat","Human"],"fb":[],"md":["Welch 2008"],"mr":[],"rv":[],"pdf":0,"n":1,"nt":"Computational model study. We investigated whether a simple feedback law could explain temporal patterns of muscle activation in response to support-surface translations in human subjects.","src":"task5import","c":0,"cl":-1},{"id":"recgWW7JlRJMm851a","t":"The construction of movement by the spinal cord","a":"Tresch","s":"","y":1999,"d":"10.1038/5721","an":["Vertebrates","Frog"],"fb":[],"md":[],"mr":[],"rv":[],"pdf":1,"n":1,"nt":"We used a computational analysis to identify the basic elements with which the vertebrate spinal\ncord constructs one complex behavior. This analysis extracted a small set of muscle synergies from\nthe range of muscle activations generated by cutaneous stimulation of the frog hindlimb. The\nflexible combination of these synergies was able to account for the large number of different motor\npatterns produced by different animals. These results therefore demonstrate one strategy used by\nthe vertebrate nervous system to produce movement in a computationally simple manner.","src":"originals99","c":642,"cl":4},{"id":"recghr9s21A35rvHN","t":"The brain has a body: adaptive behavior emerges from interactions of nervous system, body and environment.","a":"Chiel and Beer","s":"","y":1997,"d":"10.1016/s0166-2236(97)01149-1","an":[],"fb":[],"md":[],"mr":[],"rv":["Chiel and Beer 1997"],"pdf":0,"n":1,"nt":"The brain has a body: adaptive behavior emerges from nervous system–body–environment interaction, so neural analysis alone cannot explain motor control.","src":"demo50","c":869,"cl":0},{"id":"recgxiNQmBE2N5s7M","t":"An adaptive locomotion controller for a hexapod robot: CPG, kinematics and force feedback","a":"Chen","s":"","y":2014,"d":"10.1007/s11432-014-5148-y","an":["Insects"],"fb":[],"md":["Chen 2014"],"mr":[],"rv":[],"pdf":0,"n":1,"nt":"Computational model study. To tackle this challenge, a central pattern generator (CPG)-based locomotion control methodology is proposed, integrated with a contact force feedback function.","src":"task5import","c":25,"cl":0},{"id":"recgzIOzQxO3lmhT2","t":"Neural Control of Stereotypic Limb Movements","a":"Rossignol","s":"","y":2011,"d":"10.1002/cphy.cp120105","an":[],"fb":[],"md":[],"mr":[],"rv":[],"pdf":1,"n":0,"nt":"","src":"rest383","c":386,"cl":3},{"id":"rech1JxuXg5zKkApI","t":"Control of reflex reversal in stick insect walking: effects of intersegmental signals, changes in direction, and optomotor-induced turning","a":"Hellekes","s":"Blincow; Hoffmann; Büschges","y":2012,"d":"10.1152/jn.00718.2011","an":[],"fb":[],"md":[],"mr":[],"rv":[],"pdf":1,"n":0,"nt":"","src":"rest383","c":61,"cl":0},{"id":"rech5DPeIL8qPxKbO","t":"A Simple Experimentally Based Model Using Proprioceptive Regulation of Motor Primitives Captures Adjusted Trajectory Formation in Spinal Frogs","a":"Kargo","s":"","y":2010,"d":"10.1152/jn.01054.2007","an":["Frog"],"fb":[],"md":["Kargo 2010"],"mr":[],"rv":[],"pdf":1,"n":1,"nt":"In frogs, prior work supports\nfixed-duration pulses of fixed composition synergies, forming primitives. In wiping behaviors, spinal frogs adjust their motor activity\naccording to the starting limb position and generate fairly straight and\naccurate isochronous trajectories across the workspace. To test\nwhether a compact description using primitives modulated by proprioceptive feedback could reproduce such trajectory formation, we built\na biomechanical model based on physiological data. We recorded\nfrom hindlimb muscle spindles to evaluate possible proprioceptive\ninput. As movement was initiated, early skeletofusimotor activity\nenhanced many muscle spindles firing rates. Before movement began,\na rapid estimate of the limb position from simple combinations of\nspindle rates was possible. Three primitives were used in the model\nwith muscle compositions based on those observed in frogs. Our\nsimulations showed that simple gain and phase shifts of primitives\nbased on published feedback mechanisms could generate accurate\nisochronous trajectories and motor patterns that matched those observed. Although on-line feedback effects were omitted from the\nmodel after movement onset, our primitive-based model reproduced\nthe wiping behavior across a range of starting positions. Without\nmodifications from proprioceptive feedback, the model behaviors\nmissed the target in a manner similar to that in deafferented frogs.\nThese data show how early proprioception might be used to make a\nsimple estimat","src":"originals99","c":75,"cl":4},{"id":"rechChYUiOWxMAyom","t":"Reactive Balance Control in Response to Perturbation in Unilateral Stance: Interaction Effects of Direction, Displacement and Velocity on Compensatory Neuromuscular and Kinematic Responses","a":"Freyler","s":"","y":2015,"d":"10.1371/journal.pone.0144529","an":["Human"],"fb":[],"md":[],"mr":[],"rv":[],"pdf":1,"n":1," ade in studies of the spinal networks\nthat control locomotion. Through united efforts using electrophysiological and molecular\ngenetic network approaches and behavioural studies in phylogenetically diverse experimental\nmodels, the organization of locomotor networks has begun to be decoded. The emergent themes\nfrom this research are that the locomotor networks have a modular organization with distinct\ntransmitter and molecular codes and that their organization is reconfigured with changes to the\nspeed of locomotion or changes in gait.","src":"originals99","c":806,"cl":1},{"id":"reclD5keu6AOXNPQL","t":"Intracellular analysis of reflex pathways underlying the stumbling corrective reaction during fictive locomotion in the cat.","a":"Quevedo","s":"Stecina; McCrea","y":2005,"d":"10.1152/jn.00176.2005","an":[],"fb":[],"md":[],"mr":[],"rv":[],"pdf":0,"n":0,"nt":"","src":"rest383","c":47,"cl":2},{"id":"reclFa8gRAcl3H377","t":"Design process and tools for dynamic neuromechanical models and robot controllers","a":"Szczecinski","s":"Hunt; Quinn","y":2017,"d":"10.1007/s00422-017-0711-4","an":[],"fb":[],"md":[],"mr":[],"rv":[],"pdf":0,"n":0,"nt":"","src":"rest383","c":52,"cl":0},{"id":"reclFhqtYHPAnaJ7k","t":"A Neural Basis for Motor Primitives in the Spinal Cord","a":"Hart and Giszter","s":"","y":2010,"d":"10.1523/jneurosci.5894-08.2010","an":[],"fb":[],"md":[],"mr":[],"rv":[],"pdf":0,"n":0,"nt":"","src":"rest383","c":276,"cl":4},{"id":"reclGnyvIRax1xURR","t":"Contribution of load and length related manipulations to muscle responses during force perturbations","a":"Klarner","s":"","y":2010,"d":"10.14288/1.0071394","an":[],"fb":[],"md":[],"mr":[],"rv":[],"pdf":1,"n":0,"nt":"","src":"rest383","c":2,"cl":2},{"id":"reclN5HTDt1mlKkYP","t":"What Can Bidirectional Walking Tell Us about Central Pattern Generators?","a":"Veshchitskii","s":"Lyakhovetskii; Gorskii; Musienko; Merkulyeva","y":2022,"d":"10.1007/s11055-023-01357-0","an":[],"fb":[],"md":[],"mr":[],"rv":[],"pdf":0,"n":0,"n e during locomotion that may activate MNs far from the site of pattern generator","src":"originals99","c":231,"cl":6},{"id":"reclnMQymdT8XM2Fh","t":"Goal-Directed CPG-Based Control for Tensegrity Spines with Many Degrees of Freedom Traversing Irregular Terrain","a":"Mirletz","s":"","y":2015,"d":"10.1089/soro.2015.0012","an":[],"fb":[],"md":[],"mr":[],"rv":[],"pdf":0,"n":0,"nt":"","src":"task5import","c":61,"cl":0},{"id":"reclt0iqz6YI4mebn","t":"Different Motor Neuron Spike Patterns Produce Contractions With Very Similar Rises in Graded Slow Muscles","a":"Hooper","s":"","y":2007,"d":"10.1152/jn.01014.2006","an":["Stick Insect","Insects"],"fb":[],"md":[],"mr":[],"rv":[],"pdf":0,"n":1,"nt":"A consequence of spike-number dependency is that brief changes in spike frequency do not alter contraction slope and we show here that extensor motor neuron bursts with different spike patterns give rise to contractions with very similar contraction rises.","src":"task5import","c":27,"cl":0},{"id":"recltwPKqu4h48ziw","t":"Capturability-based analysis and control of legged locomotion, Part 1: Theory and application to three simple gait models","a":"Koolen","s":"","y":2012,"d":"10.1177/0278364912452673","an":[],"fb":[],"md":[],"mr":[],"rv":[],"pdf":0,"n":0,"nt":"","src":"task5import","c":488,"cl":4},{"id":"reclwbsReGhWM71WF","t":"Bio-inspired controller achieving forward speed modulation with a 3D bipedal walker","a":"Van der Noot","s":"Ijspeert; Ronsse","y":2018,"d":"10.1177/0278364917743320","an":["Human"],"fb":[],"md":["Van Der Noot 2017"],"mr":[],"rv":[],"pdf":1,"n":1,"nt":"In the present contribution, we embrace the idea of combining a CPG and reflexes in a neuromuscular torquebased controller for bipedal locomotion. More precisely, we design a controller capable of generating robust and humanlike locomotion gaits on a 3D bipedal walker.\n\nIn this paper, we have developed a bio-inspired torque-based controller supporting the emergence of a new generation of robust and energy-efficient walkers. It recruits virtual muscles driven by reflexes and a central pattern generator, and thus requires no computationally intensive inverse kinematics or dynamics modeling. This controller is capable of generating energyefficient and human-like gaits (both regarding kinematics and dynamics) across a large range of forward speeds, in a 3D environment. After a single off-line optimization process, the forward speed can be continuously commanded within this range by changing high-level parameters, as linear or quadratic functions of the target speed. Sharp speed transitions can then be achieved with no additional tuning, resulting in immediate adaptations of the step length and frequency. In this paper, we particularly embodied this controller on a simulated version of COMAN, a 95 cm tall humanoid robot. We reached forward speed modulations between 0.4 and 0.9 m/s. This covers normal human walking speeds once scaled to the robot size. Finally, the walker demonstrated significant robustness against a large spectrum of unpredicted perturbations: facing external push","src":"originals99","c":45,"cl":0},{"id":"recm18696kNIhqLhS","t":"Parallel Compliance Design for Increasing Robustness and Efficiency in Legged Locomotion—Proof of Concept","a":"Sharbafi","s":"","y":2019,"d":"10.1109/tmech.2019.2917416","an":[],"fb":[],"md":[],"mr":[],"rv":[],"pdf":0,"n":0,"nt":"","src":"task5import","c":26,"cl":15},{"id":"recm4QfxeuEDhYkqj","t":"Pattern generation for stick insect walking movements-multisensory control of a locomotor program","a":"Bässler and Büschges","s":"","y":1998,"d":"10.1016/s0165-0173(98)00006-x","an":["Stick Insect","Insects"],"fb":[],"md":[],"mr":[],"rv":["Bässler and Büschges 1998"],"pdf":0,"n":0,"nt":"","src":"rest383","c":241,"cl":0},{"id":"recm4urpzERKRV42b","t":"Identified proprioceptive afferents and motor rhythm entrainment in the crayfish walking system","a":"Elson","s":"","y":1992,"d":"10.1152/jn.1992.67.3.530","an":[],"fb":[],"md":[],"mr":[],"r root recordings of spinal motoneurons during fictive locomotion in the isolated mouse spinal cord show spontaneous deletions of activity. The majority of deletions in the isolated neonatal mouse spinal cord are non-resetting: they do not change the phase of subsequent motor cycles. Flexor and extensor motoneurons express asymmetric responses during deletions: flexor deletions are accompanied by tonic ipsilateral extensor activity, while extensor deletions do not perturb rhythmic ipsilateral flexor activity. Non-resetting deletions on one side of the cord do not perturb rhythmic activity on the other side of the cord and can occur in isolated hemicords. \n• We have characterized the activity of motoneurons and identified interneurons during spontaneous motor deletions. The motoneurons and a subset of V2a interneurons fall silent during non-resetting motor deletions while a second subset of V2a interneurons and commissural interneurons continue unperturbed rhythmic firing. This allowed us to suggest their involvement at different levels of the locomotor network operation. \n• We have developed a computational model of the central pattern generator that reproduces, and proposes a ","src":"originals99","c":140,"cl":1},{"id":"recnqSC80xlmzWM29","t":"Is there a central pattern generator in man?","a":"Illis","s":"","y":1995,"d":"10.1038/sc.1995.54","an":[],"fb":[],"md":[],"mr":[],"rv":[],"pdf":0,"n":0,"nt":"","src":"task5import","c":33,"cl":6},{"id":"reco3bdQdh4PwmIA2","t":"Optimal exploitation of natural dynamics in legged locomotion","a":"Remy","s":"","y":2011,"d":"10.3929/ethz-a-6665065","an":[],"fb":[],"md":[],"mr":[],"rv":[],"pdf":0,"n":0,"nt":"","src":"task5import","c":42,"cl":0},{"id":"recoEJr11AdVO4jyw","t":"Stumbling corrective reaction during fictive locomotion in the cat.","a":"Quevedo","s":"Stecina; Gosgnach; McCrea","y":2005,"d":"10.1152/jn.00175.2005","an":["Cat"],"fb":["Cutaneous flexor excitation"],"md":[],"mr":[],"rv":[],"pdf":0,"n":1,"nt":"Stimulation of :7,"cl":0},{"id":"recopsVmxzO6xveyX","t":"Adaptive control for backward quadrupedal walking. III. Stumbling corrective reactions and cutaneous reflex sensitivity.","a":"Buford and Smith","s":"","y":1993,"d":"10.1152/jn.1993.70.3.1102","an":["Cat"],"fb":["Cutaneous flexor excitation"],"md":[],"mr":[],"rv":[],"pdf":0,"n":1,"nt":"In cats walking forward or backward on a treadmill, paw taps that obstruct swing evoke direction-appropriate stumbling corrective reactions — draw the limb away from the obstacle, lift it over, then reposition for stance — while stance-phase taps leave the ongoing step largely unchanged but exaggerate the next swing; mechanical taps produce far richer responses than electrical pulses, so cutaneous reflex sensitivity is structured by phase, gait direction, and stimulus modality.","src":"rest383","c":75,"cl":2},{"id":"recoquDvuj5YSRUMx","t":"V1 and V2b Interneurons Secure the Alternating Flexor-Extensor Motor Activity Mice Require for Limbed Locomotion","a":"Zhang","s":"Lanuza; Britz; Wang; Siembab; Velasquez; Álvarez; Frank; Goulding","y":2014,"d":"10.1016/j.neuron.2014.02.013","an":["Mice"],"fb":[],"md":[],"mr":[],"rv":[],"pdf":0,"n":1,"nt":"V1 and V2b interneurons together supply the inhibitory component that secures alternating flexor-extensor activity: removing V1/V2b-derived neurotransmission in the isolated mouse spinal cord synchronizes L2 flexor and L5 extensor rhythms, and mice lacking V1/V2b inhibition cannot articulate limb joints — identifying these two ventral inhibitory classes as core elements of the limb CPG.","src":"rest383","c":246,"cl":1},{"id":"recovIoTNW4vuQZGL","t":"Multisensory control of spinal reflex pathways.","a":"Lundberg","s":"","y":1979,"d":"10.1016/s0079-6123(08)60803-1","an":[],"fb":[],"md":[],"mr":[],"rv":[],"pdf":0,"n":0,"nt":"","src":"rest383","c":389,"cl":6},{"id":"recp5dgFg2CMMDQAz","t":"Forelimb movements contribute to hindlimb cutaneous reflexes during locomotion in cats","a":"Harnie","s":"Al Arab; Mari; Y "d":"10.1152/jn.1999.81.2.758","an":["Cat"],"fb":[],"md":[],"mr":[],"rv":[],"pdf":1,"n":0,"nt":"","src":"originals99","c":186,"cl":2},{"id":"recppCfVTamaeAgGf","t":"Complete dynamical analysis of a neuron model","a":"Shilnikov","s":"","y":2012,"d":"10.1007/s11071-011-0046-y","an":[],"fb":[],"md":[],"mr":[],"rv":[],"pdf":0,"n":0,"nt":"","src":"task5import","c":92,"cl":5},{"id":"recpqM3xOZzQDCuEm","t":"A genetically defined asymmetry underlies the inhibitory control of flexor–extensor locomotor movements","a":"Britz","s":"Zhang; Grossmann; Dyck; Kim; Dymecki; Gosgnach; Goulding","y":2015,"d":"10.7554/elife.04718","an":[],"fb":[],"md":[],"mr":[],"rv":[],"pdf":1,"n":0,"nt":"","src":"rest383","c":157,"cl":1},{"id":"recprNyXfPDeyM3RE","t":"Adaptive control for backward quadrupedal walking. II. Hindlimb muscle synergies","a":"Buford and Smith","s":"","y":1990,"d":"10.1152/jn.1990.64.3.756","an":[],"fb":[],"md":[],"mr":[],"rv":[],"pdf":0,"n":0,"nt":"","src":"rest383","c":118,"cl":3},{"id":"recpyybF425zhdpCj","t":"The special nature of human walking and its neural control","a":"Capaday","s":"","y":2002,"d":"10.1016/S0166-2236(02)02173-2","an":["Human"],"fb":[],"md":[],"mr":[],"rv":[],"pdf":1,"n":1,"nt":"Review paper. \nWalking the way we do is inherently unstable. Sophisticated neurological control systems are required to ensure that we progress and maintain our balance at the same time. Most of what is known about the functional organization of these neurological control systems is inferred from studies on animals. Here, I compare selected studies on the neural control of human walking with similar studies in reduced animal preparations. The simple monosynaptic reflex appears to be controlled by comparable mechanisms in walking cats and humans. However, peripheral feedback mechanisms suggested to contribute to the switch from stance to swing on the basis of experiments in reduced cat preparations have little influence during human walking. A cat whose spinal cord has been c exors and extensorstogether at the same frequency also produces no illusion, because what is perceived is the signaldifference between antagonist muscles of each arm and between arms. The size of the illusiondepends on how the muscle has been conditioned beforehand, due to a property of muscle calledthixotropy. When measuring the illusion, blindfolded subjects may carry out a matching or pointingtask. In pointing, signals from muscle spindles are less important than in matching. Afferent signalsfrom kinesthetic receptors project to areas of somatosensory cortex to generate sensations ofdetection and location. This is referred to the body model, which provides information about sizeand shape of body parts. Kinesthesia, together with vision and touch, is associated with the senseof body ownership. All three can combine or each, on its own, can generate ownership","src":"originals99","c":109,"cl":5},{"id":"recsjzapLr4hhTX2T","t":"Central Pattern Generators of the Mammalian Spinal Cord","a":"Frigon","s":"","y":2012,"d":"10.1177/1073858410396101","an":[],"fb":[],"md":[],"mr":[],"rv":[],"pdf":1,"n":0,"nt":"","src":"rest383","c":117,"cl":3},{"id":"recsnUZTPv5WxrH8Z","t":"Lumbar Spinal Interneuron Activity as it Relates to Rhythmic Motor Output in the Adult, Spinal, Air-Stepping Cat","a":"McMahon","s":"","y":2014,"d":"","an":[],"fb":[],"md":[],"mr":[],"rv":[],"pdf":0,"n":0,"nt":"","src":"task5import","c":0,"cl":-1},{"id":"recsy1TGt4l91eSM4","t":"Proprioceptive postural control of a musculoskeletal model against horizontal disturbances","a":"Kaminishi","s":"","y":2017,"d":"10.1109/robio.2017.8324592","an":["Human"],"fb":[],"md":["Kaminishi 2017"],"mr":[],"rv":[],"pdf":0,"n":1,"nt":"Computational model study. Here, we developed a hypothesis that when we cannot use all sensory information, we maintain upright posture with high muscle stiffness.","src":"task5import","c":1,"cl":4},{"id":"rect8MScpgOSBshV2","t":"Are muscle synergies useful for neural control?","a":"de Rugy","s":" at neural plasticity can more ef- fectively enhance the learning performance when oﬄine learning is applied.","src":"task5import","c":81,"cl":9},{"id":"rectWwpvfDrrq5UfP","t":"Simulation of Human Balance Control Using an Inverted Pendulum Model","a":"Hilts","s":"Szczecinski; Quinn; Hunt","y":2017,"d":"10.1007/978-3-319-63537-8_15","an":["Human"],"fb":[],"md":["Hilts 2017"],"mr":[],"rv":[],"pdf":1,"n":1,"nt":"A synthetic nervous system providing proportional-derivative control of a single-joint inverted pendulum model of human balance: an ankle angular-position sensor feeds a neural network that computes the derivative of position error and applies corrective torque about the ankle, maintaining unstable equilibrium and correcting perturbations — the minimal building block for larger neuromechanical balance controllers.","src":"rest383","c":5,"cl":0},{"id":"rectXDBaf77sZeUjO","t":"Central pattern generators for bipedal locomotion","a":"Pinto","s":"","y":2006,"d":"10.1007/s00285-006-0021-2","an":[],"fb":[],"md":[],"mr":[],"rv":[],"pdf":0,"n":1,"nt":"We show that breaking the symmetry between fore and hind limbs in quad, which yields the CPGarm, leads to periodic solution types whose associated leg rhythms correspond to seven of the eight leg gaits found in leg; the missing biped gait is the asymmetric hop.","src":"task5import","c":107,"cl":6},{"id":"rectZDCJfjdHtvPJI","t":"Deadbeat control with (almost) no sensing in a hybrid model of legged locomotion","a":"Council","s":"","y":2014,"d":"10.1109/icamechs.2014.6911592","an":[],"fb":[],"md":[],"mr":[],"rv":[],"pdf":0,"n":0,"nt":"","src":"task5import","c":11,"cl":0},{"id":"rectZLWJhnmJpn1le","t":"Spinal Cord Pattern Generators for Locomotion","a":"Dietz","s":"","y":2003,"d":"10.1016/s1388-2457(03)00120-2","an":["Human"],"fb":["Ib stance to swing"],"md":[],"mr":[],"rv":[],"pdf":1,"n":1,"nt":"CPG generates rhythm an shapes the pattern of bursts of motoneurons(Pg.2)\n\nCats with transected spinal cord and with cut dorsal roots still produce rhythmic alternating contraction in ankle flexors and extensors (Pg.2)\n\nBasic mechanism underlying locomotion, no fundamental differences seems to exist between bipeds and quadrupeds.(Pg.2)\n\nDifferences between cats and primates may be due to increased importance of the Cortico spinal tract in primates. Additionally the gait of primates relies more on Supraspinal drive.(Pg.2)\n\nSpinal Circuitry for locomotion might be suppressed by Supraspinal input, with the hypothesis be to free the movement of the hands and arms for locomotor movement.(Pg.3)\n\nThere are observation which indicate the neural controls of human locomotion is based on the activity of Spinal CPGs (Review Duysens and Van de Crommert,1998) (Pg. 3)\n\nSelection of an appropriate locomotor pattern depends on a combination of CPGs and afferent inputs as well from the respective motor condition. This information is used to organize muscles synergies and meet multiple conditions of stance and gait (Review Mackay-Lyons,2002)(Pg. 3)\n\nBackwards walking is seen to resemble the EMG-timings of hip muscles reversed in time as forward walking  (Pg. 3)\n\nIn humans powerful presynaptic inhibitory effects from flexor group 1 afferents onto extensor group 1 afferents exist, although are weak (Pg. 3)\n\nCortico-Spinal projections to lower limb motoneurons humans are stronger to the flexor tha","src":"originals99","c":409,"cl":6},{"id":"rectZR2ZBRnroIfAm","t":"Phenomenological models of the dynamics of muscle during isotonic shortening","a":"Yeo","s":"","y":2013,"d":"10.1016/j.jbiomech.2013.07.018","an":["Human","Mice"],"fb":[],"md":["Yeo 2013"],"mr":[],"rv":[],"pdf":0,"n":1,"nt":"Computational model study. We investigated the effectiveness of simple, Hill-type, phenomenological models of the force-length- velocity relationship for simulating measured length trajectories during muscle shortening, and, if so, what forms of the model are most useful.","src":"task5import","c":8,"cl":0},{"id":"rectaFyuIeNlLwfL4","t":"Neural control of rhythmic limb motion is shaped by size and speed","a":"Sutton","s":"Szczecinski; Quinn; Chiel","y":2021,"d":"10.21203/rs.3.rs-153297/v1","an":[],"fb":[],"md":[],"mr":[],"rv":[],"pdf":1,"n":0,"nt":"","src":"rest383","c":9,"cl":0},{"id":"rectjvVuwduCV07V1","t":"Passive dynamics change leg mechanics for an unexpected surface during human hopping","a":"Moritz","s":"","y":2004,"d":"10.1152/japplphysiol.00393.2004","an":["Human"],"fb":[],"md":[],"mr":[],"rv":[],"pdf":0,"n":1,"nt":"The goal of this study was to determine the contributions of anticipation and reaction when human hoppers encounter surprise, expected, and random changes from a soft elastic surface (27 kN/m) to a hard surface (411 kN/m).","src":"task5import","c":158,"cl":0},{"id":"rectlEVb3Wncz8mDx","t":"Biomimetic joint actuators","a":"Herr","s":"Weber; Garlow; Casler","y":2012,"d":"","an":[],"fb":[],"md":[],"mr":[],"rv":[],"pdf":0,"n":0,"nt":"","src":"task5import","c":0,"cl":-1},{"id":"rectrNVAvBOL6BXhy","t":"Incidence and Cost of Serious Fall-Related Injuries in Nursing Homes","a":"Quigley","s":"","y":2012,"d":"10.1177/1054773811414180","an":["Human"],"fb":[],"md":[],"mr":[],"rv":[],"pdf":0,"n":1,"nt":"Over a 3-year period, there were 2,400 admissions to VHA hospitals for FRI, with 55.4% hip fractures and10.1% intracranial injuries, with an average cost of US$23,723 per admission.","src":"task5import","c":45,"cl":-1},{"id":"rectzob2WlPdjyhq5","t":"Functional muscle synergies constrain force production during postural tasks.","a":"McKay","s":"","y":2008,"d":"10.1016/j.jbiomech.2007.09.012","an":["Cat"],"fb":[],"md":["McKay 2008"],"mr":[],"rv":[],"pdf":0,"n":1,"nt":"Computational model study. We recently demonstrated that a set of ﬁve functional muscle synergies were sufﬁcient to characterize both hindlimb muscle activity and active forces during automatic postural responses in cats standing at multiple postural conﬁgurations.","src":"task5import","c":63,"cl":4},{"id":"recu ree, the foot lifts off the terrain and moves in the direction of locomotion to be placed back on the ground and start the next stance phase (Pg 2)\n\nFor animals walking is prefered at slow speeds with the left and right legs alternating with each other (Pg2)\n\nAt faster speed running is the fastest gait for bipedals where there are intervals of both legs being in the air, sprinting is not classified as a gait (Pg2)\n\nsensory feedback during locomotion comes from the segmentalafferents that signal the current position, movement and force of the body, collectivelycalled proprioception and signals originating from the external world, referred to asexteroception (Pg 3)\n\nProprioceptive information is mainly transmitted by myelinated GroupIa and Group II afferents f","src":"originals99","c":43,"cl":1},{"id":"recxImUtZqHMAo2HI","t":"Functional plasticity following spinal cord lesions.","a":"Frigon and Rossignol","s":"","y":2006,"d":"10.1016/s0079-6123(06)57016-5","an":["Cat"],"fb":[],"md":[],"mr":[],"rv":["Frigon and Rossignol 2006"],"pdf":0,"n":1,"nt":"After spinal cord injury, reflex pathways caudal to the lesion are initially depressed by low motoneuron excitability and then recover — sometimes to exaggeration (spasticity) — and in spinal cats step training normalizes transmission in simple reflex pathways, suggesting that the modified afferent inflow must itself be normalized for a stable locomotor rhythm to be re-expressed.","src":"rest383","c":145,"cl":3},{"id":"recxKzUOlEeeGip7W","t":"Sensing Unsteady Pressure on MAV Wings: A New Method for Turbulence Alleviation","a":"Marino","s":"","y":2014,"d":"10.4028/www.scientific.net/amm.629.48","an":[],"fb":[],"md":[],"mr":[],"rv":[],"pdf":0,"n":1,"nt":"Unsteady surface pressures were measured to understand if the information could be adopted for resolving turbulence-induced perturbati ons and to furthermore use it in a turbulence mitigation system.","src":"task5import","c":6,"cl":-1},{"id":"recxMRmKKgPVbqnT9","t":"For

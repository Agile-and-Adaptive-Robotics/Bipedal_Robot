   <g id="text_1">
    <text style="font: 10px 'Arial'" transform="translate(179.429725 75.831512)">RG: 4 ×16 Ca/LIF</text>
    <text style="font: 10px 'Arial'" transform="translate(168.452381 86.444012)">64 spiking membranes</text>
   </g>
   <g id="text_2">
    <text style="font: 10px 'Arial'" transform="translate(180.540662 154.495626)">PF: 8 ×16 Ca/LIF</text>
    <text style="font: 10px 'Arial'" transform="translate(165.671912 165.108126)">128 spiking membranes</text>
   </g>
   <g id="text_3">
    <text style="font: 10px 'Arial'" transform="translate(319.038412 154.528282)">12 graded motor neurons</text>
    <text style="font: 10px 'Arial'" transform="translate(322.657944 165.222345)">12 monoarticular routes</text>
   </g>
   <g id="text_4">
    <text style="font: 10px 'Arial'" transform="translate(48.838694 241.801312)">12 II +4 heel/toe inputs</text>
    <text style="font: 10px 'Arial'" transform="translate(51.481662 252.378187)">16 ×32 =512 LIF cells</text>
   </g>
   <g id="text_5">
    <text style="font: 10px 'Arial'" transform="translate(209.6351 241.564906)">28 graded source</text>
    <text style="font: 10px 'Arial'" transform="translate(201.863225 252.405219)">Ia / Ib / legacy II cells</text>
   </g>
   <g id="text_6">
    <text style="font: 10px 'Arial'" transform="translate(341.272006 70.57573)">40 graded cells</text>
    <text style="font: 10px 'Arial'" transform="translate(326.56185 81.269793)">local/commissural INs</text>
    <text style="font: 10px 'Arial'" transform="translate(342.945444 91.846668)">Renshaw cells</text>
   </g>
   <g id="text_7">
    <text style="font: 10px 'Arial'" transform="translate(14.649 282.960351)">Inputs: length-related outputs, tendon tension (N), heel/toe contact (0/1).</text>
    <text style="font: 10px 'Arial'" transform="translate(14.649 293.808163)">Output: MN mV → V → source LinearHill muscle tension (N).</text>
    <text style="font: 10px 'Arial'" transform="translate(14.649 304.648476)">Actual GRF/support are recorded; no added GRF-to-balance pathway.</text>
   </g>
   <g id="text_8">
    <text style="font: 11px 'Arial'; text-anchor: start" x="7.2" y="15.207656" transform="rotate(-0 7.2 15.207656)">(A) W2L controller: 704 spiking and 80 graded membranes</text>
   </g>
  </g>
  <g id="text_9">
   <text style="font: 10px 'Arial'" transform="translate(14.22 349.940906)">Layer overview; selected arrows only. All 216 chemical pathways and 44 physical input</text>
   <text style="font: 10px 'Arial'" transform="translate(14.22 360.634969)">adapters remain in the editable graph and ledger.</text>

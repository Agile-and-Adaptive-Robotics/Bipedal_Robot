   <g id="text_7">
    <text style="fill: #233340; font: 700 12px 'Arial'; text-anchor: middle" x="198" y="96.910625" transform="rotate(-0 198 96.910625)">Connect muscles and sensors</text>
   </g>
   <g id="text_8">
    <text style="fill: #233340; font: 11px 'Arial'; text-anchor: middle" x="198" y="111.979219" transform="rotate(-0 198 111.979219)">Map motor commands to muscles and sensory signals to circuit inputs.</text>
   </g>
   <g id="patch_11">
    <path d="M 198 140 
L 194 131 
L 202 131 
z
" clip-path="url(#p54c6c17292)" style="fill: #344f5f"/>
   </g>
   <g id="text_9">
    <text style="fill: #233340; font: 700 12px 'Arial'; text-anchor: middle" x="198" y="159.410625" transform="rotate(-0 198 159.410625)">Run and save the baseline</text>
   </g>
   <g id="text_10">
    <text style="fill: #233340; font: 11px 'Arial'; text-anchor: middle" x="198" y="174.54625" transform="rotate(-0 198 174.54625)">Set the initial pose, stimulus, descending drive, and support.</text>
   </g>
   <g id="text_11">
    <text style="fill: #233340; font: 11px 'Arial'; text-anchor: middle" x="198" y="187.54625" transform="rotate(-0 198 187.54625)">Use the same settings for either repeat.</text>
   </g>
   <g id="patch_12">
    <path d="M 94 232 
L 90 223 
L 98 223 
z
" clip-path="url(#p54c6c17292)" style="fill: #344f5f"/>

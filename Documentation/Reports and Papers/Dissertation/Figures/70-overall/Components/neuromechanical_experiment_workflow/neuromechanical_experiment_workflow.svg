   <g id="text_1">
    <text style="fill: #233340; font: 700 12px 'Arial'; text-anchor: middle" x="94" y="21.910625" transform="rotate(-0 94 21.910625)">Choose or build a controller</text>
   </g>
   <g id="text_2">
    <text style="fill: #233340; font: 11px 'Arial'; text-anchor: middle" x="94" y="37.04625" transform="rotate(-0 94 37.04625)">Specify motor outputs and the</text>
   </g>
   <g id="text_3">
    <text style="fill: #233340; font: 11px 'Arial'; text-anchor: middle" x="94" y="49.979219" transform="rotate(-0 94 49.979219)">sensory pathways to test.</text>
   </g>
   <g id="text_4">
    <text style="fill: #233340; font: 700 12px 'Arial'; text-anchor: middle" x="302" y="21.905" transform="rotate(-0 302 21.905)">Select a verified body model</text>
   </g>
   <g id="text_5">
    <text style="fill: #233340; font: 11px 'Arial'; text-anchor: middle" x="302" y="37.043672" transform="rotate(-0 302 37.043672)">Gait2392, its rerouted robot</text>
   </g>
   <g id="text_6">
    <text style="fill: #233340; font: 11px 'Arial'; text-anchor: middle" x="302" y="50.110703" transform="rotate(-0 302 50.110703)">counterpart, or a CAD model.</text>
   </g>

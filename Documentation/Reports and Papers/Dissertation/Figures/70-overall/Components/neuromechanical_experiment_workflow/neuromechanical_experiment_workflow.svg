z
" clip-path="url(#p54c6c17292)" style="fill: #344f5f"/>
   </g>
   <g id="text_21">
    <text style="fill: #233340; font: 700 12px 'Arial'; text-anchor: middle" x="198" y="348.98375" transform="rotate(-0 198 348.98375)">Compare each repeat with the baseline</text>
   </g>
   <g id="text_22">
    <text style="fill: #233340; font: 11px 'Arial'; text-anchor: middle" x="198" y="364.04625" transform="rotate(-0 198 364.04625)">Align recordings at stimulus onset or the same foot-contact event.</text>
   </g>
   <g id="text_23">
    <text style="fill: #233340; font: 11px 'Arial'; text-anchor: middle" x="198" y="377.04625" transform="rotate(-0 198 377.04625)">Compare neural activity, muscle force, joint motion, and foot loads.</text>
   </g>
   <g id="text_24">
    <text style="fill: #233340; font: 11px 'Arial'; text-anchor: middle" x="198" y="390.04625" transform="rotate(-0 198 390.04625)">Identify the first signal that differs from baseline.</text>
   </g>

   <g id="text_12">
    <text style="fill: #233340; font: 700 12px 'Arial'; text-anchor: middle" x="94" y="247.905" transform="rotate(-0 94 247.905)">Sensory-pathway repeat</text>
   </g>
   <g id="text_13">
    <text style="fill: #233340; font: 11px 'Arial'; text-anchor: middle" x="94" y="263.04625" transform="rotate(-0 94 263.04625)">Change one pathway. Keep the</text>
   </g>
   <g id="text_14">
    <text style="fill: #233340; font: 11px 'Arial'; text-anchor: middle" x="94" y="276.043672" transform="rotate(-0 94 276.043672)">model, actuator routes, and</text>
   </g>
   <g id="text_15">
    <text style="fill: #233340; font: 11px 'Arial'; text-anchor: middle" x="94" y="289.04625" transform="rotate(-0 94 289.04625)">other neural settings fixed.</text>
   </g>
   <g id="text_16">
    <text style="fill: #233340; font: 700 12px 'Arial'; text-anchor: middle" x="302" y="247.910625" transform="rotate(-0 302 247.910625)">Actuator-route repeat</text>
   </g>
   <g id="text_17">
    <text style="fill: #233340; font: 11px 'Arial'; text-anchor: middle" x="302" y="263.04625" transform="rotate(-0 302 263.04625)">Change one attachment or route.</text>
   </g>
   <g id="text_18">
    <text style="fill: #233340; font: 11px 'Arial'; text-anchor: middle" x="302" y="276.043672" transform="rotate(-0 302 276.043672)">Keep the neural controller and</text>
   </g>
   <g id="text_19">
    <text style="fill: #233340; font: 11px 'Arial'; text-anchor: middle" x="302" y="289.04625" transform="rotate(-0 302 289.04625)">its sensory settings fixed.</text>
   </g>
   <g id="text_20">
    <text style="fill: #233340; font: italic 11px 'Arial'; text-anchor: middle" x="198" y="268.343672" transform="rotate(-0 198 268.343672)">or</text>
   </g>

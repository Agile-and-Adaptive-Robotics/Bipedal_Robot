   <g id="text_1">
    <text style="font: 700 21px 'Arial'; text-anchor: start" x="16.196875" y="30.272222" transform="rotate(-0 16.196875 30.272222)">From a scaled model to a tested neuromechanical controller</text>
   </g>
   <g id="text_2">
    <text style="fill: #425466; font: 12px 'Arial'; text-anchor: start" x="16.196875" y="62.122222" transform="rotate(-0 16.196875 62.122222)">Proposed orchestration using the existing conversion, design, training, and verification components</text>
   </g>
   <g id="text_3">
    <text style="font: 700 12px 'Arial'; text-anchor: start" x="16.196875" y="101.05" transform="rotate(-0 16.196875 101.05)">BUILD AND VERIFY</text>
   </g>
   <g id="text_4">
    <text style="font: 11px 'Arial'" transform="translate(86.782734 152.854747)">Scaled OpenSim model</text>
    <text style="font: 11px 'Arial'" transform="translate(69.198203 164.650184)">+ geometry and reference data</text>
   </g>
   <g id="text_5">
    <text style="font: 11px 'Arial'" transform="translate(384.260781 152.9962)">Convert and repair</text>
    <text style="font: 11px 'Arial'" transform="translate(356.601797 164.630762)">kinematics + muscle functions</text>
   </g>
   <g id="text_6">
    <text style="font: 11px 'Arial'" transform="translate(656.364922 152.915762)">Choose explicit actuator</text>
    <text style="font: 11px 'Arial'" transform="translate(654.839531 164.7112)">and passive-loss profiles</text>
   </g>
   <g id="text_7">
    <text style="font: 11px 'Arial'" transform="translate(941.005625 152.864715)">Bind controller by name,</text>
    <text style="font: 11px 'Arial'" transform="translate(942.525859 164.628184)">function, side, and units</text>
   </g>
   <g id="text_8">
    <text style="font: 700 12px 'Arial'; text-anchor: start" x="16.196875" y="210.755556" transform="rotate(-0 16.196875 210.755556)">DESIGN AND CALIBRATE</text>
   </g>
   <g id="text_9">
    <text style="font: 11px 'Arial'" transform="translate(89.525859 276.647967)">Applicable FSA design</text>
    <text style="font: 11px 'Arial'" transform="translate(73.944531 288.572311)">units, functions, gains, timing</text>
   </g>
   <g id="text_10">
    <text style="font: 11px 'Arial'" transform="translate(406.571016 276.645389)">Hunt A–B</text>
    <text style="font: 11px 'Arial'" transform="translate(358.690078 288.440826)">free rhythm → afferent timing</text>
   </g>
   <g id="text_11">
    <text style="font: 11px 'Arial'" transform="translate(697.942344 276.709842)">Hunt C</text>
    <text style="font: 11px 'Arial'" transform="translate(653.614062 288.50528)">feedforward motor output</text>
   </g>
   <g id="text_12">
    <text style="font: 11px 'Arial'" transform="translate(983.192344 276.645389)">Hunt D</text>
    <text style="font: 11px 'Arial'" transform="translate(928.175156 288.440826)">sensory waveform refinement</text>
   </g>
   <g id="text_13">
    <text style="font: 700 12px 'Arial'; text-anchor: start" x="16.196875" y="334.616667" transform="rotate(-0 16.196875 334.616667)">CURRICULUM: CALIBRATE, THEN RECHECK THE SAVED CONTROLLER</text>
   </g>
   <g id="text_14">
    <text style="font: 11px 'Arial'" transform="translate(77.710703 407.584278)">1  Deafferented air</text>
    <text style="font: 11px 'Arial'" transform="translate(71.047969 419.379715)">rhythm + feedforward</text>
   </g>
   <g id="text_15">
    <text style="font: 11px 'Arial'" transform="translate(311.207344 407.584278)">2  Afferented air</text>
    <text style="font: 11px 'Arial'" transform="translate(291.400469 419.379715)">timing + reflex response</text>
   </g>
   <g id="text_16">
    <text style="font: 11px 'Arial'" transform="translate(529.934766 407.731747)">3  Ground standing</text>
    <text style="font: 11px 'Arial'" transform="translate(521.832578 419.495215)">posture + load support</text>
   </g>
   <g id="text_17">
    <text style="font: 11px 'Arial'" transform="translate(743.568672 407.600262)">4  Harness ground steps</text>
    <text style="font: 11px 'Arial'" transform="translate(749.518984 419.363731)">unloading + clearance</text>
   </g>
   <g id="text_18">
    <text style="font: 11px 'Arial'" transform="translate(977.681484 407.664715)">5  Contact refinement</text>
    <text style="font: 11px 'Arial'" transform="translate(982.261953 419.299278)">assistance weaning</text>
   </g>
   <g id="text_19">
    <text style="font: 700 12px 'Arial'; text-anchor: start" x="19.7625" y="488.204444" transform="rotate(-0 19.7625 488.204444)">Hunt fitting operates within the curriculum; stages 1-2 calibrate and verify suspended motion.</text>
   </g>
   <g id="text_20">
    <text style="font: 12px 'Arial'; text-anchor: start" x="19.7625" y="525.716667" transform="rotate(-0 19.7625 525.716667)">IK/GRF bank → design ranges and targets → held-out participants, speeds, and trials</text>
   </g>
   <g id="text_21">
    <text style="font: 12px 'Arial'; text-anchor: start" x="19.7625" y="561.813333" transform="rotate(-0 19.7625 561.813333)">Cross-cutting tests: state, parameter, sensor, neural, mechanical, and actuator disturbances</text>
   </g>
   <g id="text_22">
    <text style="font: 12px 'Arial'; text-anchor: start" x="19.7625" y="598.617778" transform="rotate(-0 19.7625 598.617778)">Failure → diagnose the affected function → revise that block → repeat the relevant earlier gates</text>
   </g>
   <g id="text_23">
    <text style="fill: #425466; font: 10px 'Arial'; text-anchor: start" x="19.7625" y="633.298889" transform="rotate(-0 19.7625 633.298889)">Szczecinski’s seven steps apply to compatible GLIF pathways; graded and ionic circuits retain their appropriate design rules.</text>
   </g>
  </g>
 </g>
 <defs>
  <clipPath id="pae3c63f8f1">
   <rect x="5.5" y="5.5" width="1141" height="637"/>

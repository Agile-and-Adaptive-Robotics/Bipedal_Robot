   <g id="text_1">
    <text style="font: 10px 'Arial'; text-anchor: middle" x="341.406383" y="51.685875" transform="rotate(-0 341.406383 51.685875)">PF → MN projections and Ia/II → PF routes are extracted from this fitted graph.</text>
   </g>
   <g id="text_2">
    <text style="font: 10px 'Arial'" transform="translate(224.141539 567.525562)">No iliacus Ib → RG or PF pathway in this checkpoint.</text>
    <text style="font: 10px 'Arial'" transform="translate(243.771227 578.365875)">Triangle = excitation; filled circle = inhibition.</text>
   </g>
   <g id="text_3">
    <text style="font: 13px 'Arial'" transform="translate(225.670312 16.663594)">syn6: iliacus flexor feedback subnetwork</text>
    <text style="font: 13px 'Arial'" transform="translate(15.047969 30.565875)">Antagonist and commissural paths omitted here; this panel shows homonymous routes and carrying PF channels.</text>
   </g>

   <g id="text_1">
    <text style="font: 10px 'Arial'; text-anchor: middle" x="341.406383" y="51.375094" transform="rotate(-0 341.406383 51.375094)">PF → MN projections and Ia/II → PF routes are extracted from this fitted graph.</text>
   </g>
   <g id="text_2">
    <text style="font: 10px 'Arial'" transform="translate(224.141539 567.214781)">No iliacus Ib → RG or PF pathway in this checkpoint.</text>
    <text style="font: 10px 'Arial'" transform="translate(243.771227 578.055094)">Triangle = excitation; filled circle = inhibition.</text>
   </g>
   <g id="text_3">
    <text style="font: 13px 'Arial'" transform="translate(229.284922 16.505156)">s3k: iliacus flexor feedback subnetwork</text>
    <text style="font: 13px 'Arial'" transform="translate(15.047969 30.255094)">Antagonist and commissural paths omitted here; this panel shows homonymous routes and carrying PF channels.</text>
   </g>
